<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Shred Roadmap</title>

<link rel="icon" type="image/png" href="./favicon.png?v=4">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=4">
<meta name="theme-color" content="#101217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHRED">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{
  --bg:#101217;--card:#1b1e27;--card2:#1e222c;--border:#2a2e38;--accent:#ff3b30;--accent2:#ff5a4e;
  --amber:#f5a623;--text:#eef0f4;--muted:#9aa0ac;--blue:#6fa8ff;--green:#63d69a;
}
*{box-sizing:border-box}

/* Hide scrollbars globally */
::-webkit-scrollbar { display: none; }
* { -ms-overflow-style: none; scrollbar-width: none; }

html,body{height:100%;margin:0;background:var(--bg);touch-action:manipulation;overflow:hidden;}
button,a,img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0;}
p{margin:0;line-height:1.45;color:var(--muted);font-size:13.5px;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

#root{position:relative; max-width:520px; margin:0 auto; height:100%;}
#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;}
.splashinner{display:flex;flex-direction:column;align-items:center;}
.splashtitle{font-family:'Oswald';font-weight:700;font-size:26px;letter-spacing:2px;text-align:center;line-height:1.15;color:#fff;margin-top:16px;}
.splashtitle span{color:var(--accent);}

/* --- TOP BAR --- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:#101217;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--border);}
.topbar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; max-width: 520px; margin-left: auto; margin-right: auto;}
.brand { font-family: 'Oswald'; font-weight: 700; font-size: 15px; letter-spacing: 1px; flex: 1; margin-bottom: 0; }
.brand span { color: var(--accent); }
.auth-container { display: flex; align-items: center; gap: 8px; }
.user-email { font-size: 9.5px; color: var(--muted); font-family: 'Inter', system-ui, sans-serif; }

/* --- CAROUSEL ARCHITECTURE --- */
.carousel {
  display: flex;
  width: 100%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-top: calc(85px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  scroll-behavior: smooth;
}
.view-panel {
  flex: 0 0 100%;
  width: 100%;
  height: 100%;
  scroll-snap-align: start;
  overflow-y: auto;
  padding: 0 16px 20px;
  -webkit-overflow-scrolling: touch;
}

.eyebrow{color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.h2{font-size:16px;}
.lede{font-size:13px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:12px;}
.card h3{font-size:13.5px;margin-bottom:8px;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.card h3 .tag{text-align:right;}
.tag{color:var(--muted);font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:500;}

/* progress bar */
.phasebar-wrapper { max-width: 520px; margin: 0 auto; }
.phasebar{display:flex;gap:4px;margin-bottom:3px;}
.pseg{flex:1;height:8px;border-radius:5px;background:var(--card2);border:1px solid var(--border);overflow:hidden;}
.pseg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;}
.plabels{display:flex;gap:4px;}
.plabels span{flex:1;text-align:center;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.plabels span.cur{color:var(--accent2);font-weight:700;}
.bignum{font-family:'Oswald';font-size:30px;font-weight:700;}
.statrow{display:flex;gap:10px;margin-bottom:12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

/* nav buttons */
.navbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;width:100%;text-align:left;color:var(--text);}
.navbtn .ic{font-size:22px;}
.navbtn b{display:block;font-family:'Oswald';font-size:15px;text-transform:uppercase;letter-spacing:.5px;}
.navbtn span{font-size:11.5px;color:var(--muted);}
.navbtn.accent{border-color:#4a2226;background:#211316;}
.navbtn.blue{border-color:#263049;background:#161b26;}
.navbtn.info{border-color:#264034;background:#12211c;}
.navbtn.setupbtn{border-color:#3a301e;background:#1a150e;}

/* checklist */
ul.check{list-style:none;padding:0;margin:0;}
ul.check li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;}
ul.check li:last-child{border-bottom:none;}
.box{flex:0 0 20px;height:20px;border-radius:5px;border:1.5px solid #565a66;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;}
.box.on{background:var(--accent);border-color:var(--accent);}
.box.on:after{content:'\2713';color:#fff;font-size:12px;font-weight:700;}
.itxt{flex:1;font-size:13px;color:var(--text);line-height:1.3;}
.itxt a{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px;}
.itxt.done, .itxt.done a{color:var(--muted); text-decoration:line-through;}
.itxt.done .tag{text-decoration:none; display:inline-block;}
li.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #23262f;}
li.mrow:last-child{border-bottom:none;}
.mbtn{flex:0 0 auto;border-radius:8px;border:1.3px solid var(--border);background:var(--card2);color:var(--muted);font-size:11px;font-weight:700;padding:7px 12px;letter-spacing:.3px;white-space:nowrap;}
.mbtn.on{background:#123324;border-color:var(--green);color:var(--green);}
.mbtn.blue.on{background:#16233a;border-color:var(--blue);color:var(--blue);}
.mbtn.ro{opacity:.4;pointer-events:none;}
.docli{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;}
.docli:last-child{border-bottom:none;}
.docic{font-size:14px;flex:0 0 20px;text-align:center;}

/* chop / test stepper */
.chop{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #23262f;gap:8px;}
.chop:last-child{border-bottom:none;}
.chop .nm{font-size:12px;line-height:1.3;}
.chop .nm b{display:block;font-size:9.5px;color:var(--muted);font-weight:500;}
.stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.stepper button{width:26px;height:26px;border-radius:7px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1;}
.stepper .lvl{font-family:'Oswald';font-size:14px;min-width:34px;text-align:center;}
.lvl.hit{color:var(--green);}

/* daily blocks */
.blk{border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;transition:opacity .2s;}
.blk.done-today{border-left-color:var(--green);opacity:.62;}
.blk .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.blk .nm{font-family:'Oswald';font-weight:700;font-size:13.5px;text-transform:uppercase;}
.blk .topright{display:flex;align-items:center;gap:10px;}
.blk .min{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.blkcheck{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700;cursor:pointer;white-space:nowrap;}
.blkcheck .box{width:16px;height:16px;border-radius:4px;margin:0;}
.blkcheck .box.on:after{font-size:10px;}
.blkcheck.ro{opacity:.4;cursor:default;}

/* day picker */
.daypick{display:flex;gap:4px;margin-bottom:10px;}
.dchip2{flex:1;padding:7px 3px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:10.5px;font-weight:700;text-align:center;}
.dchip2.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.dchip2.istoday:after{content:'\2022';margin-left:2px;}
.dchip2.isactive{border-color:var(--accent);}

/* streak calendar */
.streak-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 2px; }
.s-day { background: #23262f; border-radius: 6px; padding: 5px 2px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid transparent; }
.s-day .s-date { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1; transition: color 0.2s;}
.s-day .s-wkd { font-size: 8px; text-transform: uppercase; color: var(--muted); margin-top: 2px; font-weight: 600; letter-spacing: .3px; transition: color 0.2s;}
/* shades */
.s-day.past { background: #16181e; }
.s-day.past .s-date, .s-day.past .s-wkd { opacity: 0.4; }
.s-day.weekend { background: #2d1e21; } 
.s-day.weekend .s-date, .s-day.weekend .s-wkd { color: #e57368; opacity: 0.75; }
.s-day.past.weekend { background: #1f1618; }
/* hit overrides */
.s-day.hit { background: #123324 !important; border-color: var(--green); }
.s-day.hit .s-date, .s-day.hit .s-wkd { color: var(--green) !important; opacity: 1; }
.s-day.today { border-color: var(--accent); }
.s-day.today .s-date { color: #fff !important; opacity: 1; }

/* bottom nav */
.botnav{position:fixed;bottom:0;left:0;right:0;background:#15171e;border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;}
.botnav-inner{display:flex; width:100%; max-width:520px; margin:0 auto;}
.botnav button{flex:1;background:none;border:none;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.3px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;border-radius:8px;}
.botnav button .ic{font-size:16px;}
.botnav button.active{color:var(--accent2);}

/* misc */
.note{border-left:3px solid var(--amber);background:#241f14;padding:10px 12px;border-radius:0 10px 10px 0;font-size:12px;color:#e6d9b8;margin-bottom:12px;}
.tbtn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.danger{background:#2a1214;border-color:#5c1f22;color:#ff8a80;}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.acc{margin-bottom:10px;}
.acchead{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.acchead b{font-family:'Oswald';font-size:13px;text-transform:uppercase;}
.accbody{padding:10px 4px 2px;}
.chev{color:var(--muted);font-size:11px;transition:transform .2s;}
.chev.open{transform:rotate(90deg);}

/* customized dropdown selector with built-in arrow */
.select{
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
  padding:8px 30px 8px 10px;
  font-size:12.5px;
  font-weight:500;
  font-family:inherit;
  width:100%;
  margin-top:6px;
  appearance:none;
  -webkit-appearance:none;
  outline:none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa0ac' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  background-size: 14px;
}
table.info{width:100%;border-collapse:collapse;}
table.info th{text-align:left;font-size:9px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:4px 4px;}
table.info td{font-size:11.5px;color:var(--text);padding:6px 4px;border-bottom:1px solid #23262f;vertical-align:top;}
table.info td.day{font-weight:700;white-space:nowrap;color:var(--accent2);}
.infolist{list-style:none;padding:0;margin:0;}
.infolist li{font-size:12px;color:var(--text);padding:6px 0;border-bottom:1px solid #23262f;}
.infolist li:last-child{border-bottom:none;}
</style>
<script>
  window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      var sp = document.getElementById("splash");
      if(sp) sp.remove();
    }, 1500);
  });
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDO-7ovvVwmowSa6KIoPwglO93nnp2kS4Y",
  authDomain: "shred-auth.firebaseapp.com",
  projectId: "shred-auth",
  storageBucket: "shred-auth.firebasestorage.app",
  messagingSenderId: "372290387192",
  appId: "1:372290387192:web:3052450efe7d7f8eaa4f0d",
  measurementId: "G-NLJVRXEG85"
};

const hasFirebase = !!firebaseConfig.apiKey;
let auth, db, googleProvider, currentUser = null;

if(hasFirebase) {
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    googleProvider = new GoogleAuthProvider();
    db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if(user) {
        try {
          const docSnap = await getDoc(doc(db, "users", user.uid));
          if(docSnap.exists()){
            state = Object.assign(defaultState(), docSnap.data());
            state.setupGuitar = state.setupGuitar || "prs";
            state.setupTuning = state.setupTuning || "e_std";
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            showToast("Progress synced from cloud!");
          } else {
            await setDoc(doc(db, "users", user.uid), state);
            showToast("Local progress saved to cloud!");
          }
        } catch(e) {
          console.error("Sync error:", e);
        }
      }
      render();
    });
  } catch(e) {
    console.error("Firebase init error:", e);
  }
}

function k(){return Array.prototype.slice.call(arguments).join(".");}
function todayISO(){return new Date().toISOString().slice(0,10);}
function todayName(){return DAYS[new Date().getDay()];}
function isWeekendDay(d){return d==="Sat"||d==="Sun";}
function activeDay(){ if(state.activeDayOverride && state.activeDayDate===todayISO()) return state.activeDayOverride; return todayName(); }

function ensureDailyReset(){
  var t=todayISO();
  if(state.practicedDate!==t){
    updateStreakStatus();
    state.practiced={};
    state.practicedDate=t;
    saveState();
  }
}

function itemKeysForPhase(idx){
  var p=PHASES[idx];
  if(p.kind==="setup"){
    var ks=[]; PREREQ.forEach(function(pr,i){ ks.push(k("p0","pre",i)); });
    return {keys:ks,chopTarget:null,testReq:null};
  }
  var ks3=[];
  (p.concept||[]).forEach(function(_,i){ks3.push(k(p.id,"c",i));});
  p.exercises.forEach(function(_,i){ks3.push(k(p.id,"e",i));});
  p.songs.forEach(function(_,i){ks3.push(k(p.id,"s",i));});
  return {keys:ks3,chopTarget:p.target,testReq:p.testReq};
}
function phasePercent(idx){
  if(idx<state.phaseIndex) return 100;
  if(idx>state.phaseIndex) return 0;
  var info=itemKeysForPhase(idx);
  var total=info.keys.length+(info.chopTarget?5:0)+(info.testReq?5:0);
  var done=info.keys.filter(function(kk){return !!state.checks[kk];}).length;
  if(info.chopTarget) done+=CHOP.filter(function(c){return state.chop[c.key]>=info.chopTarget;}).length;
  if(info.testReq) done+=TESTCATS.filter(function(c){return state.testLevel[c.key]>=info.testReq;}).length;
  return total?Math.round(done/total*100):0;
}

function totalStreak(){return (state.streakDates||[]).length;}

function updateStreakStatus(){
  var t = todayISO();
  var hasPracticed = Object.keys(state.practiced).some(function(k){ return state.practiced[k]; });
  var idx = state.streakDates.indexOf(t);
  
  if (hasPracticed && idx === -1) {
    state.streakDates.push(t);
  } else if (!hasPracticed && idx !== -1 && state.practicedDate === t) {
    state.streakDates.splice(idx, 1);
  }
}

function currentStreak(){
  var dates = state.streakDates.slice().sort().reverse();
  if(dates.length===0) return 0;
  var streak = 0;
  var checkDate = new Date();
  var todayStr = checkDate.toISOString().slice(0,10);
  checkDate.setDate(checkDate.getDate() - 1);
  var yestStr = checkDate.toISOString().slice(0,10);
  
  var dStart = new Date();
  if(dates.indexOf(todayStr) !== -1) {
     streak = 1; 
  } else if(dates.indexOf(yestStr) !== -1) {
     streak = 1;
     dStart.setDate(dStart.getDate() - 1);
  } else {
     return 0;
  }
  
  for(var i=1; i<=1000; i++){
     dStart.setDate(dStart.getDate() - 1);
     var iso = dStart.toISOString().slice(0,10);
     if(dates.indexOf(iso) !== -1) streak++;
     else break;
  }
  return streak;
}

function blockPKey(name,day){ return name+"."+day; }
function isBlockPracticed(name,day){ return !!state.practiced[blockPKey(name,day)]; }
function toggleBlockPracticed(name,day){ ensureDailyReset(); var kk=blockPKey(name,day); state.practiced[kk]=!state.practiced[kk]; applyStateChange(); }
function dailyBlocksStatus(day,idx){
  var p=PHASES[idx],st={};
  if(p.kind==="setup"){ st.prereq=isBlockPracticed("prereq",day); st.warmup=isBlockPracticed("warmup",day); return st; }
  st.warmup=isBlockPracticed("warmup",day);
  if(isWeekendDay(day)){ st.casual=isBlockPracticed("casual",day); return st; }
  st.focused=isBlockPracticed("focused",day);
  st.casual=isBlockPracticed("casual",day);
  st.cooldown=isBlockPracticed("cooldown",day);
  return st;
}
function isFullyDoneToday(){
  var st=dailyBlocksStatus(activeDay(),state.phaseIndex);
  var keys=Object.keys(st);
  return keys.length>0 && keys.every(function(kk){return st[kk];});
}

function resetPhaseChecks(fromIdx,toIdx){
  for(var i=fromIdx;i<=toIdx;i++){
    var info=itemKeysForPhase(i);
    info.keys.forEach(function(kk){ delete state.checks[kk]; });
  }
}
function markPhaseComplete(idx){
  var info=itemKeysForPhase(idx);
  info.keys.forEach(function(kk){ state.checks[kk]=true; });
  if(info.chopTarget) CHOP.forEach(function(c){ if((state.chop[c.key]||0)<info.chopTarget) state.chop[c.key]=info.chopTarget; });
  if(info.testReq) TESTCATS.forEach(function(c){ if((state.testLevel[c.key]||0)<info.testReq) state.testLevel[c.key]=info.testReq; });
}

function applyStateChange(skipAuto){
  ensureDailyReset();
  updateStreakStatus();
  if(!skipAuto){
    var idx=state.phaseIndex;
    if(idx<PHASES.length-1 && phasePercent(idx)===100){ state.phaseIndex=idx+1; showToast("\ud83d\udd25 Phase unlocked: "+PHASES[idx+1].label+"!"); }
  }
  if(isFullyDoneToday() && state.congratsDate!==todayISO()){
    state.congratsDate=todayISO();
    showToast("\ud83e\udd18 Nice work - today's full session is complete!");
  }
  saveState(); render();
}
function toggleCheck(key){ state.checks[key] = state.checks[key] ? false : todayISO(); applyStateChange(); }
function setChop(sk,d){ state.chop[sk]=Math.max(0,Math.min(10,(state.chop[sk]||0)+d)); applyStateChange(); }
function setTest(sk,d){ state.testLevel[sk]=Math.max(0,Math.min(5,(state.testLevel[sk]||0)+d)); applyStateChange(); }
function setBonusLevel(key,d,max){ state.bonusLevel[key]=Math.max(0,Math.min(max,(state.bonusLevel[key]||0)+d)); applyStateChange(); }
function setActiveDay(d){ state.activeDayOverride=d; state.activeDayDate=todayISO(); saveState(); render(); showToast(DAY_FULL[d]+" is now your active session"); }
function resetActiveDay(){ state.activeDayOverride=null; saveState(); render(); }
function handlePhaseSelect(newIdx){
  var oldIdx=state.phaseIndex;
  if(newIdx===oldIdx) return;
  if(newIdx>oldIdx){
    for(var i=oldIdx;i<newIdx;i++) markPhaseComplete(i);
    state.phaseIndex=newIdx;
    applyStateChange(true);
    showToast("Now on "+PHASES[newIdx].label+" - earlier phases marked complete");
  } else {
    ui.phaseJumpPending=newIdx;
    render();
  }
}
function confirmPhaseJumpBack(){
  var newIdx=ui.phaseJumpPending, oldIdx=state.phaseIndex;
  resetPhaseChecks(newIdx+1,oldIdx);
  state.phaseIndex=newIdx;
  ui.phaseJumpPending=null;
  applyStateChange(true);

function getDailyActiveSequence(list, prefix, editable){
  var html="";
  for(var i=0; i<list.length; i++){
    var kk = prefix + "." + i;
    var val = state.checks[kk];
    if(val){
      if(val === todayISO()){
        html += checkItem(list[i].t, kk, list[i].url, editable);
        break; 
      }
    } else {
      html += checkItem(list[i].t, kk, list[i].url, editable);
      break; 
    }
  }
  return html;
}

function renderStreakCalendar(){
  var html='<div class="streak-grid">';
  var now = new Date();
  var todayIsoStr = todayISO();
  var jsDay = now.getDay(); 
  var monBasedDay = (jsDay + 6) % 7; 
  var startDate = new Date(now.getTime());
  startDate.setDate(now.getDate() - monBasedDay - 21);
  var shortDays = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

  for(var i=0; i<28; i++){
    var d = new Date(startDate.getTime());
    d.setDate(startDate.getDate() + i);
    var iso = d.toISOString().slice(0,10);
    var isHit = state.streakDates.indexOf(iso) !== -1;
    var isToday = iso === todayIsoStr;
    var isPast = iso < todayIsoStr;
    var dayOfWeek = d.getDay();
    var isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
    
    var c = "s-day" + (isHit?" hit":"") + (isToday?" today":"") + (isPast?" past":"") + (isWeekend?" weekend":"");
    var dayName = shortDays[i % 7];
    var dateNum = d.getDate();
    html += '<div class="'+c+'"><div class="s-date">'+dateNum+'</div><div class="s-wkd">'+dayName+'</div></div>';
  }
  return html + '</div>';
}

function renderDaily(){
  var idx=state.phaseIndex,p=PHASES[idx];
  var day=ui.dayOverride||todayName();
  var act=activeDay();
  var editable=(day===act);
  var wknd=isWeekendDay(day);
  var html='<div class="eyebrow">'+DAY_FULL[day]+' &middot; '+p.label+'</div>';
  html+=dayPicker(day);

  if(!editable){
    var notePrefix = state.activeDayOverride ? "Currently selected practice session is" : "Suggested practice session is";
    html+='<div class="note">'+notePrefix+' <b>'+DAY_FULL[act]+'</b>. <button class="tbtn" data-action="activateday" data-day="'+day+'" style="margin-top:8px;display:block;">Switch to '+DAY_FULL[day]+' instead \u2192</button></div>';
  }

  if(p.kind==="setup"){
    var preBody='<ul class="check">'+PREREQ.map(function(pr,i){
      var kk = k("p0","pre",i);
      if(state.checks[kk] && state.checks[kk] !== todayISO()) return ""; 
      return prereqItem(pr.t,kk,pr.url,editable);
    }).join("")+'</ul>';
    html+=blk("prereq",day,"Prerequisites",null,preBody,editable);
    html+=blk("warmup",day,"Warm-Up",null,'<p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p>',editable);
    html+='<div class="note">Run the Phase Transition Test on Home for your baseline - it\'s informational here, not required to advance.</div>';
    return html;
  }

  if(wknd){
    html+=blk("warmup",day,"Warm-Up","15 min",'<p>Extended warm-up + weak-spot review.</p>',editable);
    if(day==="Sat"){
      var songHtml = getDailyActiveSequence(p.songs||[], p.id+".s", editable);
      var body='<p>Deep-dive: polish next solo toward full tempo.</p>' + (songHtml ? '<ul class="check">'+songHtml+'</ul>' : '<p>All this tier\'s solos learned. \ud83c\udfb8</p>');
      html+=blk("casual",day,"CASUAL","45 min",body,editable);
    } else {
      html+=blk("casual",day,"Creative","45 min",'<p>Improv over a backing track, or pick a bonus drill.</p><button class="tbtn" data-action="go" data-view="library" style="margin-top:8px;">Open Library \u2192</button>',editable);
    }
    return html;
  }

  var essential=ESSENTIAL[day]||"Reinforce Weakest";
  var essUrl=ESSENTIAL_URL[essential];

  html+=blk("warmup",day,"Warm-Up","5 min",'<p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p>',editable);

  var focusBody='';
  if(day==="Mon"){
    if(p.concept && p.concept.length){
      var conceptHtml = getDailyActiveSequence(p.concept, p.id+".c", editable);
      focusBody += conceptHtml ? '<ul class="check">'+conceptHtml+'</ul>' : '<p>All concept videos completed.</p>';
    } else {
      focusBody += '<p>All concept videos completed.</p>';
    }
    
    var monExHtml = p.exercises.map(function(t,i){
      var kk = k(p.id,"e",i);
      return checkItem(t.t, kk, t.url, editable);
    }).join("");
    if(monExHtml) focusBody+='<p style="margin-top:6px;">Exercises in rotation (check off once solid):</p><ul class="check">'+monExHtml+'</ul>';
    else focusBody+='<p style="margin-top:6px;color:var(--muted);">All exercises mastered for this phase! \ud83c\udfb8</p>';

  } else if(day==="Tue"){
    var tueExHtml = p.exercises.map(function(t,i){
      var kk = k(p.id,"e",i);
      return checkItem(t.t, kk, t.url, editable);
    }).join("");
    if(tueExHtml) focusBody+='<p style="margin-bottom:6px;">Exercises in rotation (check off once solid):</p><ul class="check">'+tueExHtml+'</ul>';
    else focusBody+='<p style="margin-bottom:6px;color:var(--muted);">All exercises mastered for this phase! \ud83c\udfb8</p>';
    
    focusBody+='<p style="margin:6px 0;">Chop-builders (picking) - protect ~15 min:</p>'+chopRow(p.target,["alt","sweep"]);
  } else if(day==="Wed"){
    var theoryHtml = "";
    THEORY_DOCS.forEach(function(docItemObj){
      theoryHtml += docItem(docItemObj.t, docItemObj.url);
    });
    var theorySeq = getDailyActiveSequence(THEORY_ITEMS, "theory", editable);
    if(theorySeq) {
      theoryHtml += theorySeq;
    } else {
      theoryHtml += '<p style="margin-top:6px;color:var(--muted);">All theory items completed!</p>';
    }
    focusBody+='<p style="margin-bottom:6px;">Theory in rotation:</p><ul class="check">'+theoryHtml+'</ul>';
  } else if(day==="Thu"){
    focusBody+='<p style="margin-bottom:6px;">Chop-builders (legato/economy/tapping):</p>'+chopRow(p.target,["legato","econ","tap"]);
  } else if(day==="Fri"){
    focusBody+='<p>Revisit your hardest exercise or chop-builder from the week, then spend the micro-dose reinforcing whichever skill felt weakest.</p>';
    if(p.testReq){
      var met=TESTCATS.filter(function(c){return (state.testLevel[c.key]||0)>=p.testReq;}).length;
      focusBody+='<div class="note" style="margin-top:8px;">Phase Transition Test: '+met+'/5 at Level '+p.testReq+'+. <button class="tbtn" data-action="go" data-view="home" style="margin-top:6px;display:block;">Retake Phase Test \u2192</button></div>';
    }
  }
  if(day!=="Fri") focusBody+='<p style="margin-top:8px;">+ 5 min: '+linked(essential+" micro-dose",essUrl)+'</p>';
  html+=blk("focused",day,"Focused","30 + 5 min",focusBody,editable);

  var casualBody='';
  if(day==="Mon"||day==="Thu"){ 
    var songHtml = getDailyActiveSequence(p.songs||[], p.id+".s", editable);
    casualBody += songHtml ? '<ul class="check">'+songHtml+'</ul>' : '<p>All this tier\'s solos learned. \ud83c\udfb8</p>';
  }
  else if(day==="Tue"){ casualBody+='<p>Riff writing / improv over a backing track.</p>'; }
  else if(day==="Wed"){ casualBody+='<p>Apply today\'s theory concept on the fretboard.</p>'; }
  else if(day==="Fri"){ casualBody+='<p>Free jam using everything from the week.</p>'; }
  html+=blk("casual",day,"Casual","15 min",casualBody,editable);
  html+=blk("cooldown",day,"Cool-Down","5 min",'<p>Quick review - what clicked, what didn\'t.</p>',editable);
  return html;
}

function renderSetup(){
  var isPrs = state.setupGuitar === "prs";
  var conf = setupData[state.setupGuitar][state.setupTuning];
  
  var html='<div class="eyebrow">Gear Optimization</div><div class="h2" style="font-size:20px;margin-bottom:10px;">Guitar Setup Companion</div>';
  html+='<p class="lede">Follow these mechanical adjustments in exactly this order to achieve optimal low string action suitable for shredding without excessive fret buzz.</p>';

  // DROPDOWNS
  html+='<div style="display:flex; gap:8px; margin-bottom:12px;">';
  html+='<select class="select" style="flex:1; margin-top:0;" data-action="setGuitar">';
  html+='<option value="prs" '+(isPrs?'selected':'')+'>PRS SE CE 24 (25" scale)</option>';
  html+='<option value="epi" '+(isPrs?'':'selected')+'>Epiphone LP Std (24.75" scale)</option>';
  html+='</select>';
  
  html+='<select class="select" style="flex:1; margin-top:0;" data-action="setTuning">';
  html+='<option value="e_std" '+(state.setupTuning==='e_std'?'selected':'')+'>E Standard</option>';
  html+='<option value="drop_d" '+(state.setupTuning==='drop_d'?'selected':'')+'>Drop D</option>';
  html+='<option value="d_std" '+(state.setupTuning==='d_std'?'selected':'')+'>D Standard</option>';
  html+='<option value="drop_c" '+(state.setupTuning==='drop_c'?'selected':'')+'>Drop C</option>';
  html+='<option value="c_std" '+(state.setupTuning==='c_std'?'selected':'')+'>C Standard</option>';
  html+='<option value="dadfae" '+(state.setupTuning==='dadfae'?'selected':'')+'>DADFAE (Ghost Reveries)</option>';
  html+='</select>';
  html+='</div>';
  
  html+='<div class="note"><b>Note:</b> These target measurements are specifically optimized to match the tension profile of 10-46 E Standard strings on a 25" scale.</div>';
  
  html+='<div class="card"><h3>Recommended Measurements</h3><table class="info"><tr><th>Adjustment</th><th>Target</th></tr>';
  html+='<tr><td class="day">String Gauge</td><td>'+conf.gauge+'</td></tr>';
  if(isPrs) html+='<tr><td class="day">Tremolo Float</td><td>1.6 mm (1/16") off body</td></tr>';
  html+='<tr><td class="day">Neck Relief</td><td>'+conf.relief+' mm at 8th fret</td></tr>'+
    '<tr><td class="day">String Action (Low E)</td><td>'+conf.actBass+' mm at 12th fret</td></tr>'+
    '<tr><td class="day">String Action (High E)</td><td>'+conf.actTreb+' mm at 12th fret</td></tr>'+
    '<tr><td class="day">Pickup Height (Bass, Neck)</td><td>2.5 mm to bottom of string</td></tr>'+
    '<tr><td class="day">Pickup Height (Treble, Bridge)</td><td>1.5 mm to bottom of string</td></tr>'+
    '</table></div>';
    
  html+='<div class="card"><h3>1. Strip and Clean</h3><p style="text-align:justify;">Remove the old strings and deep clean the fretboard to lift away accumulated dirt. Condition the rosewood fretboard with a light coat of lemon oil. Leave it for 10 min for the neck to absorb the oils, and then wipe the excess away. Finally, clean the rest of the guitar body and hardware using appropriate instrument cleaning products.</p></div>';
  
  html+='<div class="card"><h3>2. Restring and Stretch</h3><p style="text-align:justify;">Install your fresh strings. Before measuring anything, stretch the strings thoroughly by pulling firmly on each string all the way up and down the neck. Retune and repeat until the tuning stops dropping.</p></div>';
  
  if(isPrs) {
    html+='<div class="card"><h3>3. Set the Tremolo Float</h3><p style="text-align:justify;">The PRS patented tremolo is designed to float exactly 1.6 mm parallel to the guitar body. If it sits too high or low, remove the back cavity plate and adjust the two claw screws holding the springs (tightening pulls the bridge down; loosening lifts it). Retune after every quarter-turn.<br><br><b>The PRS F# Test:</b> To confirm the perfect float without a ruler, pull the whammy bar back as far as it will go. When perfectly balanced, your open Low E string will pitch up exactly to an F#.</p></div>';
  }
  
  html+='<div class="card"><h3>4. Adjust Neck Relief (Truss Rod)</h3><p style="text-align:justify;">Put a capo on the 1st fret and hold down the Low E string at the highest fret. Check the gap between the bottom of the string and the top of the 8th fret. You want a tiny '+conf.relief+' mm gap - just enough space to slide a piece of standard printer paper through with slight friction. If the gap is larger, tighten the truss rod (turn clockwise) a quarter-turn at a time.</p></div>';
  
  html+='<div class="card"><h3>5. Lower the String Action</h3><p style="text-align:justify;">With the neck nearly flat, adjust the saddle heights. Set the Low E to '+conf.actBass+' mm at the 12th fret, and the High E to '+conf.actTreb+' - '+(conf.actTreb+0.1).toFixed(1)+' mm at the 12th fret.<br><br><b>Radius matching:</b> '+(isPrs ? 'Drop the individual saddles using a small Allen key on the two grub screws per saddle. Adjust the middle strings so they form a matching '+setupData[state.setupGuitar].radius+' curve to fit the fretboard.' : 'Adjust the thumbwheels on either side of the Tune-O-Matic bridge. The bridge saddle slots are pre-cut to automatically match the '+setupData[state.setupGuitar].radius+' fretboard radius.')+' Test by doing 1.5-step bends above the 15th fret on the High E string; if the note chokes out, raise that specific side just a hair.</p></div>';
  
  html+='<div class="card"><h3>6. Lubricate the Nut</h3><p style="text-align:justify;">Apply graphite powder (from a mechanical pencil) or a dedicated lubricant into the nut slots before tuning up to pitch. This stops the strings from binding and pinging.</p></div>';
  
  html+='<div class="card"><h3>7. Set Intonation</h3><p style="text-align:justify;">This must be done last. Check the tuning of the open string, then fret the note at the 12th fret. If the fretted note is <b>sharp</b>, use a screwdriver on the back of the bridge to move the saddle <b>backward</b> (away from the neck). If the fretted note is <b>flat</b>, move the saddle <b>forward</b>. Retune the open string after every saddle adjustment until both match perfectly.</p></div>';

  html+='<div class="card"><h3>8. Adjust Pickup Height</h3><p style="text-align:justify;">Fret the highest note ('+(isPrs?'24th':'22nd')+' fret). Adjust the height screws on either side of the pickups. Set the bass side to <b>2.5 mm</b> below the strings, and the treble side to <b>1.5 mm</b>. In high-gain and shred contexts, keeping the bass side slightly lower prevents the low-end from becoming muddy (stratitis), while the higher treble side keeps your pick attack aggressive and cuts through the mix.</p></div>';

  var vidUrl = isPrs ? 'https://www.youtube.com/watch?v=wmoc9ksdZdE' : 'https://www.youtube.com/watch?v=3Dhn56ybQHg';
  var vidTitle = isPrs ? 'Official PRS Setup Guide' : 'Epiphone Les Paul Setup Guide';

  html+='<button class="tbtn primary" style="width:100%; margin-bottom: 20px; display:flex; justify-content:center; align-items:center; gap:8px;" onclick="window.open(\''+vidUrl+'\', \'_blank\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg> '+vidTitle+'</button>';

  return html;
}

function initAppLayout() {
  var root = document.getElementById("root");
  root.innerHTML = `
    <div class="topbar" id="topbar"></div>
    <div class="carousel" id="carousel">
      <div class="view-panel" data-view-id="home" id="panel-home"></div>
      <div class="view-panel" data-view-id="daily" id="panel-daily"></div>
      <div class="view-panel" data-view-id="library" id="panel-library"></div>
      <div class="view-panel" data-view-id="info" id="panel-info"></div>
      <div class="view-panel" data-view-id="setup" id="panel-setup"></div>
    </div>
    <div class="botnav" id="botnav"></div>
  `;
  var carousel = document.getElementById('carousel');
  carousel.addEventListener('scroll', function() {
    var width = carousel.offsetWidth;
    var scrollX = carousel.scrollLeft;
    var index = Math.round(scrollX / width);
    if (APP_VIEWS[index] && ui.view !== APP_VIEWS[index]) {
       ui.view = APP_VIEWS[index];
       updateBotNav();
    }
  }, {passive: true});
}

function updateBotNav() {
  var botnav = document.getElementById('botnav');
  if(!botnav) return;
  botnav.innerHTML = '<div class="botnav-inner">' +
    navBtn("home","\ud83c\udfe0","Home") + 
    navBtn("daily","\ud83c\udfaf","Daily") + 
    navBtn("library","\ud83d\udcda","Library") + 
    navBtn("info","\u2139\ufe0f","Info") + 
    navBtn("setup","\ud83d\udee0\ufe0f","Setup") + '</div>';
}
function navBtn(view,ic,label){ return '<button data-action="go" data-view="'+view+'" class="'+(ui.view===view?"active":"")+'"><span class="ic">'+ic+'</span>'+label+'</button>'; }

function render(){
  try {
    ensureDailyReset();
    if(!document.getElementById("carousel")) initAppLayout();

    var tops = {};
    document.querySelectorAll('.view-panel').forEach(function(p){ tops[p.id] = p.scrollTop; });

    var topbarHTML = '<div class="topbar-header"><div class="brand">THE <span>SHRED</span> ROADMAP</div>';
    if(hasFirebase){
      topbarHTML += '<div class="auth-container">';
      if(currentUser && currentUser.email){
        var shortName = currentUser.email.split('@')[0];
        topbarHTML += '<span class="user-email">' + shortName + '</span>';
      }
      topbarHTML += '<button id="authBtn" class="dchip2" style="padding:5px 10px; margin:0; border-color:var(--border); color:var(--text);">' + (currentUser ? "Logout" : "Login with Google") + '</button></div>';
    }
    topbarHTML += '</div>' + progressBar();
    document.getElementById('topbar').innerHTML = topbarHTML;

    document.getElementById('panel-home').innerHTML = renderHome();
    document.getElementById('panel-daily').innerHTML = renderDaily();
    document.getElementById('panel-library').innerHTML = renderLibrary();
    document.getElementById('panel-info').innerHTML = renderInfo();
    document.getElementById('panel-setup').innerHTML = renderSetup();

    updateBotNav();

    document.querySelectorAll('.view-panel').forEach(function(p){ p.scrollTop = tops[p.id] || 0; });

    var idx = APP_VIEWS.indexOf(ui.view);
    var carousel = document.getElementById('carousel');
    var expectedScroll = idx * carousel.offsetWidth;
    if (Math.abs(carousel.scrollLeft - expectedScroll) > carousel.offsetWidth * 0.5) {
      carousel.scrollTo({left: expectedScroll, behavior: 'instant'});
    }

  } catch(err) {
    console.error("Render error:", err);
    var root=document.getElementById("root");
    if(root) { root.innerHTML = '<div style="padding: 20px; color: #ff3b30; font-family: monospace;"><h3>Render Error:</h3><p>' + err.message + '</p><pre>' + err.stack + '</pre></div>'; }
  }
}

document.addEventListener("click",function(e){
  if(e.target.closest("a")) return;
  var t=e.target.closest("[data-action],[data-toggle],#authBtn");
  if(!t) return;

  if(t.id === "authBtn"){
    if(currentUser){ signOut(auth).then(() => { showToast("Logged out"); render(); }); } 
    else { signInWithPopup(auth, googleProvider).catch(err => showToast("Login failed")); }
    return;
  }

  if(t.dataset.toggle){ toggleCheck(t.dataset.toggle); return; }
  var a=t.dataset.action;
  
  if(a==="go"){
    ui.view=t.dataset.view;
    var idx = APP_VIEWS.indexOf(ui.view);
    var carousel = document.getElementById('carousel');
    carousel.scrollTo({left: idx * carousel.offsetWidth, behavior: 'smooth'});
    
    var panel = document.getElementById('panel-' + ui.view);
    if(panel) panel.scrollTo({top: 0, behavior: 'smooth'});
    
    updateBotNav();
    return;
  }
  
  if(a==="toggleacc"){ui.lib[t.dataset.acc]=!ui.lib[t.dataset.acc]; render();}
  else if(a==="setday"){ ui.dayOverride=t.dataset.day; render(); }
  else if(a==="chop"){ setChop(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="test"){ setTest(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="bonuslvl"){ setBonusLevel(t.dataset.k,parseInt(t.dataset.d,10),parseInt(t.dataset.max,10)); }
  else if(a==="blockprac"){ toggleBlockPracticed(t.dataset.block,t.dataset.day); }
  else if(a==="togm"){ toggleCheck(t.dataset.key); }
  else if(a==="activateday"){ setActiveDay(t.dataset.day); }
  else if(a==="resetactiveday"){ resetActiveDay(); }
  else if(a==="cloudsave"){ 
    if(!currentUser) { showToast("Please login first to save to cloud."); return; }
    setDoc(doc(db, "users", currentUser.uid), state).then(() => showToast("Progress manually saved to cloud!")).catch(() => showToast("Error saving to cloud."));
  }
  else if(a==="cloudload"){ 
    if(!currentUser) { showToast("Please login first to load from cloud."); return; }
    getDoc(doc(db, "users", currentUser.uid)).then(docSnap => {
      if(docSnap.exists()){
        state = Object.assign(defaultState(), docSnap.data());
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
        showToast("Progress loaded from cloud!");
      } else {
        showToast("No cloud data found.");
      }
    }).catch(() => showToast("Error loading from cloud."));
  }
  else if(a==="reset"){ handleReset(); }
  else if(a==="cancelreset"){ cancelReset(); }
  else if(a==="confirmreset"){ confirmReset(); }
  else if(a==="canceljump"){ cancelPhaseJumpBack(); }
  else if(a==="confirmjump"){ confirmPhaseJumpBack(); }
});

document.addEventListener("change",function(e){
  if(e.target.dataset.action==="setphase") handlePhaseSelect(parseInt(e.target.value,10));
  if(e.target.dataset.action==="setGuitar") { state.setupGuitar = e.target.value; saveState(); render(); }
  if(e.target.dataset.action==="setTuning") { state.setupTuning = e.target.value; saveState(); render(); }
});

ensureDailyReset();
render();
setTimeout(function(){
  var sp=document.getElementById("splash");
  if(sp) sp.remove();
},1200);
</script>
