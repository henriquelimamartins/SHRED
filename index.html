import { PHASES, CREATIVE, PHASE_BLURB, CHOP, TESTCATS, THEORY_DOCS, THEORY_ROOT_ITEMS, THEORY_GROUPS, THEORY_ITEMS, ESSENTIAL, ESSENTIAL_URL, BONUS, PREREQ, WARMUP_URL, WEEKLY_RHYTHM } from "./js/data/bhgs.js?v=1";

initFirebase(render, showToast);
let ui={view:"home",lib:{},dayOverride:null,resetConfirm:false,phaseJumpPending:null};
const APP_VIEWS = ["home", "daily", "improv", "dojo", "library", "setup"];

function k(){return Array.prototype.slice.call(arguments).join(".");}
function todayISO(){return new Date().toISOString().slice(0,10);}
function todayName(){return DAYS[new Date().getDay()];}
function isWeekendDay(d){return d==="Sat"||d==="Sun";}
function activeDay(){ if(state.activeDayOverride && state.activeDayDate===todayISO()) return state.activeDayOverride; return todayName(); }

function ensureDailyReset(){
  var t=todayISO();
  if(state.practicedDate!==t){
    updateStreakStatus();
    state.practiced={};
    state.practicedDate=t;
    saveState();
  }
}

function itemKeysForPhase(idx){
  var p=PHASES[idx];
  if(p.kind==="setup"){
    var ks=[]; PREREQ.forEach(function(pr,i){ ks.push(k("p0","pre",i)); });
    return {keys:ks,chopTarget:null,testReq:null};
  }
  var ks3=[];
  (p.concept||[]).forEach(function(_,i){ks3.push(k(p.id,"c",i));});
  p.exercises.forEach(function(_,i){ks3.push(k(p.id,"e",i));});
  p.songs.forEach(function(_,i){ks3.push(k(p.id,"s",i));});
  return {keys:ks3,chopTarget:p.target,testReq:p.testReq};
}
function phasePercent(idx){
  if(idx<state.phaseIndex) return 100;
  if(idx>state.phaseIndex) return 0;
  var info=itemKeysForPhase(idx);
  var total=info.keys.length+(info.chopTarget?CHOP.length:0)+(info.testReq?TESTCATS.length:0);
  var done=info.keys.filter(function(kk){return !!state.checks[kk];}).length;
  if(info.chopTarget) done+=CHOP.filter(function(c){return state.chop[c.key]>=info.chopTarget;}).length;
  if(info.testReq) done+=TESTCATS.filter(function(c){return state.testLevel[c.key]>=info.testReq;}).length;
  return total?Math.round(done/total*100):0;
}

function totalStreak(){return (state.streakDates||[]).length;}

function updateStreakStatus(){
  var t = todayISO();
  var hasPracticed = Object.keys(state.practiced).some(function(k){ return state.practiced[k]; });
  var idx = state.streakDates.indexOf(t);
  
  if (hasPracticed && idx === -1) {
    state.streakDates.push(t);
  } else if (!hasPracticed && idx !== -1 && state.practicedDate === t) {
    state.streakDates.splice(idx, 1);
  }
}

function currentStreak(){
  var dates = state.streakDates.slice().sort().reverse();
  if(dates.length===0) return 0;
  var streak = 0;
  var checkDate = new Date();
  var todayStr = checkDate.toISOString().slice(0,10);
  checkDate.setDate(checkDate.getDate() - 1);
  var yestStr = checkDate.toISOString().slice(0,10);
  
  var dStart = new Date();
  if(dates.indexOf(todayStr) !== -1) {
     streak = 1; 
  } else if(dates.indexOf(yestStr) !== -1) {
     streak = 1;
     dStart.setDate(dStart.getDate() - 1);
  } else {
     return 0;
  }
  
  for(var i=1; i<=1000; i++){
     dStart.setDate(dStart.getDate() - 1);
     var iso = dStart.toISOString().slice(0,10);
     if(dates.indexOf(iso) !== -1) streak++;
     else break;
  }
  return streak;
}

function blockPKey(name,day){ return name+"."+day; }
function isBlockPracticed(name,day){ return !!state.practiced[blockPKey(name,day)]; }
function toggleBlockPracticed(name,day){ ensureDailyReset(); var kk=blockPKey(name,day); state.practiced[kk]=!state.practiced[kk]; applyStateChange(); }
function dailyBlocksStatus(day,idx){
  var p=PHASES[idx],st={};
  if(p.kind==="setup"){ st.prereq=isBlockPracticed("prereq",day); st.warmup=isBlockPracticed("warmup",day); return st; }
  st.warmup=isBlockPracticed("warmup",day);
  if(isWeekendDay(day)){ st.casual=isBlockPracticed("casual",day); return st; }
  st.focused=isBlockPracticed("focused",day);
  st.casual=isBlockPracticed("casual",day);
  st.cooldown=isBlockPracticed("cooldown",day);
  return st;
}
function isFullyDoneToday(){
  var st=dailyBlocksStatus(activeDay(),state.phaseIndex);
  var keys=Object.keys(st);
  return keys.length>0 && keys.every(function(kk){return st[kk];});
}

function resetPhaseChecks(fromIdx,toIdx){
  for(var i=fromIdx;i<=toIdx;i++){
    var info=itemKeysForPhase(i);
    info.keys.forEach(function(kk){ delete state.checks[kk]; });
  }
}
function markPhaseComplete(idx){
  var info=itemKeysForPhase(idx);
  info.keys.forEach(function(kk){ state.checks[kk]=true; });
  if(info.chopTarget) CHOP.forEach(function(c){ if((state.chop[c.key]||0)<info.chopTarget) state.chop[c.key]=info.chopTarget; });
  if(info.testReq) TESTCATS.forEach(function(c){ if((state.testLevel[c.key]||0)<info.testReq) state.testLevel[c.key]=info.testReq; });
}

function applyStateChange(skipAuto){
  ensureDailyReset();
  updateStreakStatus();
  if(!skipAuto){
    var idx=state.phaseIndex;
    if(idx<PHASES.length-1 && phasePercent(idx)===100){ state.phaseIndex=idx+1; showToast("\ud83d\udd25 Phase unlocked: "+PHASES[idx+1].label+"!"); }
  }
  if(isFullyDoneToday() && state.congratsDate!==todayISO()){
    state.congratsDate=todayISO();
    showToast("\ud83e\udd18 Nice work - today's full session is complete!");
  }
  saveState(); render();
}
function toggleCheck(key){ state.checks[key] = state.checks[key] ? false : todayISO(); applyStateChange(); }
function setChop(sk,d){ state.chop[sk]=Math.max(0,Math.min(10,(state.chop[sk]||0)+d)); applyStateChange(); }
function setTest(sk,d){ state.testLevel[sk]=Math.max(0,Math.min(5,(state.testLevel[sk]||0)+d)); applyStateChange(); }
function setBonusLevel(key,d,max){ state.bonusLevel[key]=Math.max(0,Math.min(max,(state.bonusLevel[key]||0)+d)); applyStateChange(); }
function setActiveDay(d){ state.activeDayOverride=d; state.activeDayDate=todayISO(); saveState(); render(); showToast(DAY_FULL[d]+" is now your active session"); }
function resetActiveDay(){ state.activeDayOverride=null; saveState(); render(); }
function handlePhaseSelect(newIdx){
  var oldIdx=state.phaseIndex;
  if(newIdx===oldIdx) return;
  if(newIdx>oldIdx){
    for(var i=oldIdx;i<newIdx;i++) markPhaseComplete(i);
    state.phaseIndex=newIdx;
    applyStateChange(true);
    showToast("Now on "+PHASES[newIdx].label+" - earlier phases marked complete");
  } else {
    ui.phaseJumpPending=newIdx;
    render();
  }
}
function confirmPhaseJumpBack(){
  var newIdx=ui.phaseJumpPending, oldIdx=state.phaseIndex;
  resetPhaseChecks(newIdx+1,oldIdx);
  state.phaseIndex=newIdx;
  ui.phaseJumpPending=null;
  applyStateChange(true);
  showToast("Now on "+PHASES[newIdx].label+" - later phases reset");
}
function cancelPhaseJumpBack(){ ui.phaseJumpPending=null; render(); }
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast._h);showToast._h=setTimeout(function(){t.classList.remove("show");},2600);}

function handleReset(){ ui.resetConfirm=true; render(); }
function cancelReset(){ ui.resetConfirm=false; render(); }
function confirmReset(){
  localStorage.removeItem(STORAGE_KEY);
  replaceState(defaultState());
  if(hasFirebase && currentUser && db) { setDoc(doc(db, "users", currentUser.uid), state).catch(e => console.error(e)); }
  ui.resetConfirm=false;
  render();
  showToast("Everything has been reset.");
}

function formatGauge(g){
  var parts = g.split('-');
  if(parts.length === 2) {
    var p1 = parseInt(parts[0], 10);
    var p2 = parseInt(parts[1], 10);
    var s1 = (p1 >= 10 && p1 <= 19) ? "0.0" + p1 : "0." + p1;
    var s2 = (p2 >= 10 && p2 <= 99) ? "0.0" + p2 : "0." + p2;
    return s1 + '" - ' + s2 + '" (' + g + ')';
  }
  return g;
}

// --- THEORY DOJO LOGIC ---

let currentMinigame = null;
let currentQuestion = null;

function getDojoLevelInfo(xp) {
  let cur = DOJO_LEVELS[0];
  let next = DOJO_LEVELS[1];
  for(let i=0; i<DOJO_LEVELS.length; i++) {
    if(xp >= DOJO_LEVELS[i].req) {
      cur = DOJO_LEVELS[i];
      next = DOJO_LEVELS[i+1] || {req: 999999};
    }
  }
  let pct = next.req === 999999 ? 100 : Math.floor(((xp - cur.req) / (next.req - cur.req)) * 100);
  return { level: cur.l, title: cur.title, pct: pct, nextReq: next.req, codex: cur.codex };
}

function addXP(amount) {
  state.dojo.xp += amount;
  let info = getDojoLevelInfo(state.dojo.xp);
  if(info.level > state.dojo.level) {
    state.dojo.level = info.level;
    showToast("⭐ Level Up! You are now a " + info.title);
    if(info.codex > 1 && !state.dojo.unlockedCodexes.includes(info.codex)) {
      state.dojo.unlockedCodexes.push(info.codex);
      showToast("📜 📜 New Codex Unlocked!");
    }
  } else {
    showToast("+" + amount + " XP!");
  }
  saveState();
}

function generateHarmonicQuestion() {
  let available = HARMONIC_QUESTIONS.filter(q => q.lvl <= state.dojo.level);
  if(available.length === 0) available = HARMONIC_QUESTIONS;
  let r = Math.floor(Math.random() * available.length);
  return available[r];
}

function startArchitectGame() {
  currentMinigame = "architect";
  currentQuestion = generateHarmonicQuestion();
  
  let html = '<div class="game-header"><span class="game-title">🏛️ The Harmonic Architect</span><button class="tbtn" data-action="dojoback">Back</button></div>';
  html += '<div class="question-box"><h4>' + currentQuestion.q + '</h4></div>';
  
  currentQuestion.opts.forEach((opt, idx) => {
    html += '<button class="opt-btn" data-action="dojoans" data-ans="'+idx+'">' + opt + '</button>';
  });
  
  html += '<div id="dojo-feedback" class="feedback-box"></div>';
  document.getElementById('dojo-game-container').innerHTML = html;
  
  document.getElementById('dojo-dash-view').classList.remove('active');
  document.getElementById('dojo-game-view').classList.add('active');
}

function handleDojoAnswer(idx) {
  var btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.style.pointerEvents = 'none');
  
  var fbox = document.getElementById('dojo-feedback');
  if(idx === currentQuestion.ans) {
    btns[idx].classList.add('correct');
    addXP(50);
    fbox.innerHTML = '<b>✔️ Architect&apos;s Analysis (Correct!)</b><p>' + currentQuestion.exp + '</p><button class="tbtn primary" style="margin-top:12px;" data-action="dojonext">Next Scenario &rsaquo;</button>';
  } else {
    btns[idx].classList.add('wrong');
    btns[currentQuestion.ans].classList.add('correct');
    fbox.innerHTML = '<b>❌ Architect&apos;s Analysis (Incorrect)</b><p>' + currentQuestion.exp + '</p><button class="tbtn" style="margin-top:12px;" data-action="dojoback">Back to Dojo</button>';
  }
  fbox.classList.add('show');
}

function renderDojoDashboard() {
  let info = getDojoLevelInfo(state.dojo.xp);
  let isMuted = state.dojo.audioMuted;
  
  let html = '<div class="eyebrow" style="color:var(--blue);">THEORY DOJO</div>';
  html += '<div class="h2" style="font-size:24px; margin-bottom:4px;">Level ' + info.level + ' - ' + info.title + '</div>';
  
  html += '<div class="xp-bar-container" style="margin-bottom:18px;">';
  html += '<div class="xp-bar-fill" style="width:'+info.pct+'%;"></div>';
  html += '<div class="xp-text">' + state.dojo.xp + ' / ' + (info.nextReq === 999999 ? 'MAX' : info.nextReq) + ' XP</div>';
  html += '</div>';
  
  html += '<div style="display:flex; justify-content:flex-end; margin-bottom:18px; align-items:center; gap:10px;">';
  html += '<span style="font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;">Audio: '+(isMuted?'OFF':'ON')+'</span>';
  html += '<div class="custom-toggle '+(isMuted?'':'on')+'" data-action="togglemute"><div class="knob"></div></div>';
  html += '</div>';
  
  html += '<div class="dojo-dash">';
  
  // Codex Library
  html += '<button class="dojo-btn" style="border-color:var(--blue);" data-action="dojoopen" data-target="codex-list"><div class="ic">📜</div><div class="info"><b>The Architect&apos;s Codex</b><span>Read the theory and context before playing. New modules unlock as you level up.</span></div></button>';
  
  // Games
  html += '<button class="dojo-btn" data-action="dojoplay" data-game="architect"><div class="ic">🏛️</div><div class="info"><b>The Harmonic Architect</b><span>Songwriting decisions and modal tension.</span></div></button>';
  html += '<button class="dojo-btn" data-action="dojoplay" data-game="fretboard"><div class="ic">🎯</div><div class="info"><b>The Fretboard Sniper</b><span>Rapid visual mapping on the neck.</span></div></button>';
  
  if(!isMuted) {
    html += '<button class="dojo-btn" data-action="dojoplay" data-game="rhythm"><div class="ic">🥁</div><div class="info"><b>The Rhythm Decryptor</b><span>Ear training for odd time signatures.</span></div></button>';
  }
  
  html += '</div>';
  return html;
}

function renderCodexList() {
  let html = '<div class="game-header"><span class="game-title">📜 Library of the Architect</span><button class="tbtn" data-action="dojoback">Back</button></div>';
  html += '<p class="lede">Read these contextualized theory scrolls to unlock your true power in the mini-games.</p>';
  
  Object.keys(CODEX_DATA).forEach(k => {
    let id = parseInt(k,10);
    let unlocked = state.dojo.unlockedCodexes.includes(id);
    let read = state.dojo.readCodexes.includes(id);
    
    if(unlocked) {
      html += '<button class="navbtn dojo-btn codex-item-btn" data-action="readcodex" data-id="'+id+'"><div class="ic">'+(read?'✔️':'📖')+'</div><div class="info"><b>' + CODEX_DATA[id].title + '</b></div></button>';
    } else {
      html += '<div class="navbtn dojo-btn codex-item-btn locked"><div class="ic">🔒</div><div class="info"><b>' + CODEX_DATA[id].title + '</b><span>Unlocks at higher levels.</span></div></div>';
    }
  });
  
  return html;
}

function renderDojoView() {
  let html = '<div id="dojo-dash-view" class="codex-view active">' + renderDojoDashboard() + '</div>' +
    '<div id="dojo-codex-list" class="codex-view"></div>' +
    '<div id="dojo-codex-reader" class="codex-view codex-content"></div>' +
    '<div id="dojo-game-view" class="codex-view game-area"><div id="dojo-game-container"></div></div>';
  return html;
}

/* ---------- render helpers ---------- */
function linked(label,url){ return url? '<a href="'+url+'" target="_blank" rel="noopener">'+label+'</a>' : label; }
function checkItem(label,key,url,editable){
  if(editable===undefined) editable=true;
  var c=!!state.checks[key];
  var btn = editable
    ? '<button class="mbtn'+(c?" on":"")+'" data-action="togm" data-key="'+key+'">'+(c?"\u2713 Mastered":"Unmastered")+'</button>'
    : '<button class="mbtn ro'+(c?" on":"")+'">'+(c?"\u2713 Mastered":"Unmastered")+'</button>';
  return '<li class="mrow"><div class="itxt'+(c?" done":"")+'">'+linked(label,url)+'</div>'+btn+'</li>';
}
function watchItem(label,key,url,editable){
  if(editable===undefined) editable=true;
  var c=!!state.checks[key];
  var btn = editable
    ? '<button class="mbtn blue'+(c?" on":"")+'" data-action="togm" data-key="'+key+'">'+(c?"\u2713 Watched":"Unwatched")+'</button>'
    : '<button class="mbtn ro blue'+(c?" on":"")+'">'+(c?"\u2713 Watched":"Unwatched")+'</button>';
  return '<li class="mrow"><div class="itxt'+(c?" done":"")+'">'+linked(label,url)+'</div>'+btn+'</li>';
}
function prereqItem(label,key,url,editable){
  if(editable===undefined) editable=true;
  var c=!!state.checks[key];
  var btn = editable
    ? '<button class="mbtn blue'+(c?" on":"")+'" data-action="togm" data-key="'+key+'">'+(c?"\u2713 Completed":"Incomplete")+'</button>'
    : '<button class="mbtn ro blue'+(c?" on":"")+'">'+(c?"\u2713 Completed":"Incomplete")+'</button>';
  return '<li class="mrow"><div class="itxt'+(c?" done":"")+'">'+linked(label,url)+'</div>'+btn+'</li>';
}
function docItem(label,url){ return '<li class="docli"><div class="docic">\ud83d\udcd6</div><div class="itxt">'+linked(label,url)+'</div></li>'; }
function chopRow(target,onlyKeys,editable){
  if(editable===undefined) editable=true;
  var list=onlyKeys?CHOP.filter(function(c){return onlyKeys.indexOf(c.key)!==-1;}):CHOP;
  return list.map(function(c){
    var lvl=state.chop[c.key]||0,hit=target&&lvl>=target;
    var minus=editable?'<button data-action="chop" data-t="'+c.key+'" data-d="-1"> - </button>':'';
    var plus=editable?'<button data-action="chop" data-t="'+c.key+'" data-d="1">+</button>':'';
    return '<div class="chop"><div class="nm">'+linked(c.label,c.url)+(target?'<b>target: Level '+target+'</b>':'<b>lifetime level</b>')+'</div><div class="stepper">'+
      minus+'<div class="lvl'+(hit?" hit":"")+'">'+lvl+(target?"/"+target:"/10")+'</div>'+plus+'</div></div>';
  }).join("");
}
function testRow(req){
  return TESTCATS.map(function(c){
    var lvl=state.testLevel[c.key]||0,hit=req&&lvl>=req;
    var displayTitle = linked(c.label,c.url) + (c.emoji ? ' <span style="text-decoration:none; display:inline-block;">'+c.emoji+'</span>' : '');
    return '<div class="chop"><div class="nm">'+displayTitle+(req?'<b>need: Level '+req+'</b>':'<b>baseline</b>')+'</div><div class="stepper">'+
      '<button data-action="test" data-t="'+c.key+'" data-d="-1"> - </button><div class="lvl'+(hit?" hit":"")+'">'+lvl+'/5</div>'+
      '<button data-action="test" data-t="'+c.key+'" data-d="1">+</button></div></div>';
  }).join("");
}
function renderBonusList(){
  return BONUS.map(function(b){
    if(b.slider){
      var lvl=state.bonusLevel[b.slider.key]||0;
      var isMax = lvl >= b.slider.max;
      return '<div class="chop"><div class="nm">'+linked(b.t,b.url)+'</div><div class="stepper">'+
        '<button data-action="bonuslvl" data-k="'+b.slider.key+'" data-max="'+b.slider.max+'" data-d="-1"> - </button>'+
        '<div class="lvl'+(isMax?" hit":"")+'">'+lvl+'/'+b.slider.max+'</div>'+
        '<button data-action="bonuslvl" data-k="'+b.slider.key+'" data-max="'+b.slider.max+'" data-d="1">+</button></div></div>';
    }
    return '<div class="chop"><div class="nm">'+linked(b.t,b.url)+'</div></div>';
  }).join("");
}
function progressBar(){
  var segs="",labels="";
  PHASES.forEach(function(p,i){
    var pct=phasePercent(i);
    segs+='<div class="pseg"><i style="width:'+pct+'%"></i></div>';
    labels+='<span class="'+(i===state.phaseIndex?"cur":"")+'">Phase '+i+'</span>';
  });
  return '<div class="phasebar-wrapper"><div class="phasebar">'+segs+'</div><div class="plabels">'+labels+'</div></div>';
}
function dayPicker(selectedDay){
  var today=todayName(), act=activeDay();
  return '<div class="daypick">'+DAY_ORDER.map(function(d){
    var cls="dchip2"+(d===selectedDay?" on":"")+(d===today?" istoday":"")+(d===act&&act!==today?" isactive":"");
    return '<button class="'+cls+'" data-action="setday" data-day="'+d+'">'+d+'</button>';
  }).join("")+'</div>';
}
function blk(name,day,title,minText,bodyHtml,editable,customClass){
  if(editable===undefined) editable=true;
  var done=isBlockPracticed(name,day);
  var check = editable
    ? '<div class="blkcheck" data-action="blockprac" data-block="'+name+'" data-day="'+day+'"><div class="box'+(done?" on":"")+'"></div><span>Practiced</span></div>'
    : '<div class="blkcheck ro"><div class="box'+(done?" on":"")+'"></div><span>Practiced</span></div>';
  var cClass = customClass ? ' ' + customClass : '';

function getDailyActiveSequence(list, prefix, editable, isWatch){

function getEarliestYearMonth() {
  if(!state.streakDates || state.streakDates.length === 0) return { y: new Date().getFullYear(), m: new Date().getMonth() };
  var sorted = state.streakDates.slice().sort();
  var parts = sorted[0].split('-');
  return { y: parseInt(parts[0], 10), m: parseInt(parts[1], 10) - 1 };
}

function buildMonthGrid(y, m){
  var firstDayOfMonth = new Date(y, m, 1);
  var startDayOfWeek = (firstDayOfMonth.getDay() + 6) % 7; 
  var startDate = new Date(y, m, 1 - startDayOfWeek);

  var lastDayOfMonth = new Date(y, m + 1, 0);
  var endDayOfWeek = (lastDayOfMonth.getDay() + 6) % 7; 
  var endDate = new Date(y, m + 1, 0 + (6 - endDayOfWeek));

  var shortDays = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
  var shortMonths = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  var todayIsoStr = todayISO();
  var html = '<div class="streak-grid" >';

  for (var d = new Date(startDate.getTime()); d <= endDate; d.setDate(d.getDate() + 1)) {
    var iso = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
    var isHit = state.streakDates.indexOf(iso) !== -1;
    var isToday = iso === todayIsoStr;
    var isPast = iso < todayIsoStr;
    var dayOfWeek = d.getDay();
    var isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
    var isOtherMonth = d.getMonth() !== m;

    var c = "s-day";
    if(isPast) c += " past";
    if(isWeekend) c += " weekend";
    if(isOtherMonth) c += " other-month";
    if(isHit) c += " hit";
    if(isToday) c += " today";

    var dayName = shortDays[(dayOfWeek + 6) % 7];
    var dateNum = d.getDate();
    var isFirst = dateNum === 1;
    var isLast = dateNum === new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

    var badgeHtml = "";
    if (isFirst || isLast) {
      badgeHtml = '<div class="s-month-badge">' + shortMonths[d.getMonth()] + '</div>';
    }

    html += '<div class="'+c+'">' + badgeHtml + '<div class="s-date">'+dateNum+'</div><div class="s-wkd">'+dayName+'</div></div>';
  }
  html += '</div>';
  return html;
}

function renderStreakCalendar(){
  var now = new Date();
  if (ui.calMonth === undefined) { ui.calMonth = now.getMonth(); ui.calYear = now.getFullYear(); }

  var m = ui.calMonth;
  var y = ui.calYear;
  var earliest = getEarliestYearMonth();

  var prevM = m - 1, prevY = y;
  if(prevM < 0) { prevM = 11; prevY--; }
  var nextM = m + 1, nextY = y;
  if(nextM > 11) { nextM = 0; nextY++; }

  var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  var canGoBack = (y > earliest.y) || (y === earliest.y && m > earliest.m);
  var canGoFwd = (y < now.getFullYear()) || (y === now.getFullYear() && m < now.getMonth());

  var html = '<div class="calendar-header-nav">';
  html += '<div style="display:flex; gap:4px;">';
  html += '<button data-action="calprev" ' + (!canGoBack ? 'disabled' : '') + '><span>&lsaquo;</span><span>Prev</span></button>';
  html += '</div>';
  html += '<div class="center-date">';
  html += '<span style="font-weight:700; color:var(--accent2); text-transform:uppercase; font-size:13px; letter-spacing: 1px;" id="cal-month-title">' + monthNames[m] + '</span>';
  html += '<span style="color:var(--muted); font-weight:600;" id="cal-year-title">' + y + '</span>';
  html += '</div>';
  html += '<div style="display:flex; gap:4px;">';
  html += '<button data-action="calnext" ' + (!canGoFwd ? 'disabled' : '') + '><span>&rsaquo;</span><span>Next</span></button>';
  html += '<button data-action="caltoday" style="background:var(--accent); color:#fff; border-color:var(--accent);"><span>&#9660;</span><span>Today</span></button>';
  html += '</div></div>';

  html += '<div class="streak-wrapper" id="cal-swipe-area">';
  html += '<div class="cal-carousel" id="cal-carousel">';
  
  if(canGoBack) {
    html += '<div class="cal-panel" data-ym="'+prevY+'-'+prevM+'">' + buildMonthGrid(prevY, prevM) + '</div>';
  }
  html += '<div class="cal-panel" data-ym="'+y+'-'+m+'">' + buildMonthGrid(y, m) + '</div>';
  if(canGoFwd) {
    html += '<div class="cal-panel" data-ym="'+nextY+'-'+nextM+'">' + buildMonthGrid(nextY, nextM) + '</div>';
  }
  
  html += '</div></div>';
  return html;
}

function changeCalMonth(dir) {
  ui.calMonth += dir;
  if (ui.calMonth > 11) { ui.calMonth = 0; ui.calYear++; }
  else if (ui.calMonth < 0) { ui.calMonth = 11; ui.calYear--; }
  render();
}

function renderSetup(){
  var isPrs = state.setupGuitar === "prs";
  var conf = setupData[state.setupGuitar][state.setupTuning];
  
  var html='<div class="eyebrow">Gear Optimization</div><div class="h2" style="font-size:22px;margin-bottom:12px;">Guitar Setup Companion</div>';
  html+='<p class="lede">Follow these mechanical adjustments in exactly this order to achieve optimal low string action suitable for shredding without excessive fret buzz.</p>';

  html+='<div style="display:flex; gap:10px; margin-bottom:16px;">';
  html+='<select class="select" style="flex:1; margin-top:0;" data-action="setGuitar">';
  html+='<option value="prs" '+(isPrs?'selected':'')+'>PRS (25")</option>';
  html+='<option value="epi" '+(isPrs?'':'selected')+'>Les Paul (24.75")</option>';
  html+='</select>';
  
  html+='<select class="select" style="flex:1; margin-top:0;" data-action="setTuning">';
  html+='<option value="e_std" '+(state.setupTuning==='e_std'?'selected':'')+'>E Standard</option>';
  html+='<option value="drop_d" '+(state.setupTuning==='drop_d'?'selected':'')+'>Drop D</option>';
  html+='<option value="d_std" '+(state.setupTuning==='d_std'?'selected':'')+'>D Standard</option>';
  html+='<option value="drop_c" '+(state.setupTuning==='drop_c'?'selected':'')+'>Drop C</option>';
  html+='<option value="c_std" '+(state.setupTuning==='c_std'?'selected':'')+'>C Standard</option>';
  html+='<option value="dadfae" '+(state.setupTuning==='dadfae'?'selected':'')+'>DADFAE</option>';
  html+='</select>';
  html+='</div>';
  
  html+='<div class="note"><b>Note:</b> These target measurements are specifically optimized to match the tension profile of '+conf.gauge+' string gauge with E standard tuning on a 25" scale guitar.</div>';
  
  html+='<div class="card"><h3>Recommended Measurements</h3><table class="info"><tr><th>Adjustment</th><th>Target</th></tr>';
  html+='<tr><td class="day">String Gauge</td><td>'+formatGauge(conf.gauge)+'</td></tr>';
  if(isPrs) html+='<tr><td class="day">Tremolo Float</td><td>1.6 mm (1/16") off body</td></tr>';
  html+='<tr><td class="day">Neck Relief</td><td>'+conf.relief+' mm at 8th fret</td></tr>'+
    '<tr><td class="day">String Action (Low E)</td><td>'+conf.actBass+' mm at 12th fret</td></tr>'+
    '<tr><td class="day">String Action (High E)</td><td>'+conf.actTreb+' mm at 12th fret</td></tr>'+
    '<tr><td class="day">Pickup Height (Neck)</td><td>2.5 mm to string</td></tr>'+
    '<tr><td class="day">Pickup Height (Bridge)</td><td>1.5 mm to string</td></tr>'+
    '</table></div>';
    
  html+='<div class="card"><h3>1. Strip and Clean</h3><p style="text-align:justify;">Remove the old strings and deep clean the fretboard to lift away accumulated dirt. If needed (once every six months) condition the rosewood fretboard with a light coat of lemon oil. Leave it for 10 min for the neck to absorb the oils, and then wipe the excess away. Finally, clean the rest of the guitar body and hardware using appropriate instrument cleaning products.</p></div>';
  
  html+='<div class="card"><h3>2. Restring and Stretch</h3><p style="text-align:justify;">Install your fresh strings. Before measuring anything, stretch the strings thoroughly by pulling firmly on each string all the way up and down the neck. Retune and repeat until the tuning stops dropping.</p></div>';
  
  if(isPrs) {
    html+='<div class="card"><h3>3. Set the Tremolo Float</h3><p style="text-align:justify;">The PRS patented tremolo is designed to float exactly 1.6 mm parallel to the guitar body. If it sits too high or low, remove the back cavity plate and adjust the two claw screws holding the springs (tightening pulls the bridge down; loosening lifts it). Retune after every turn.<br><br><b>The PRS F# Test:</b> To confirm the perfect float without a ruler, pull the whammy bar back as far as it will go. When perfectly balanced, your open Low E string will pitch up exactly to an F#.</p></div>';
  }
  
  html+='<div class="card"><h3>4. Adjust Neck Relief (Truss Rod)</h3><p style="text-align:justify;">Put a capo on the 1st fret and hold down the Low E string at the highest fret. Check the gap between the bottom of the string and the top of the 8th fret. You want a tiny '+conf.relief+' mm gap - just enough space to slide a piece of standard printer paper through with slight friction. If the gap is larger, tighten the truss rod (turn clockwise) a quarter-turn at a time.</p></div>';
  
  html+='<div class="card"><h3>5. Lower the String Action</h3><p style="text-align:justify;">With the neck nearly flat, adjust the saddle heights. Set the Low E to '+conf.actBass+' mm at the 12th fret, and the High E to '+conf.actTreb+' - '+(conf.actTreb+0.1).toFixed(1)+' mm at the 12th fret.<br><br><b>Radius matching:</b> '+(isPrs ? 'Drop the individual saddles using a small Allen key on the two grub screws per saddle. Adjust the middle strings so they form a matching '+setupData[state.setupGuitar].radius+' curve to fit the fretboard.' : 'Adjust the thumbwheels on either side of the Tune-O-Matic bridge. The bridge saddle slots are pre-cut to automatically match the '+setupData[state.setupGuitar].radius+' fretboard radius.')+' Test by doing 1.5-step bends above the 15th fret on the High E string; if the note chokes out, raise that specific side.</p></div>';
  
  html+='<div class="card"><h3>6. Lubricate the Nut</h3><p style="text-align:justify;">Apply graphite powder (from a mechanical pencil) or a dedicated lubricant into the nut slots before tuning up to pitch. This stops the strings from binding and pinging.</p></div>';
  
  html+='<div class="card"><h3>7. Set Intonation</h3><p style="text-align:justify;">This must be done last. Check the tuning of the open string, then fret the note at the 12th fret. If the fretted note is <b>sharp</b>, use a screwdriver on the back of the bridge to move the saddle <b>backward</b> (away from the neck). If the fretted note is <b>flat</b>, move the saddle <b>forward</b>. Retune the open string after every saddle adjustment until both match perfectly.</p></div>';

  html+='<div class="card"><h3>8. Adjust Pickup Height</h3><p style="text-align:justify;">Fret the highest note ('+(isPrs?'24th':'22nd')+' fret). Adjust the height screws on either side of the pickups. Set the bass side to <b>2.5 mm</b> below the strings, and the treble side to <b>1.5 mm</b>. In high-gain and shred contexts, keeping the bass side slightly lower prevents the low-end from becoming muddy (stratitis), while the higher treble side keeps your pick attack aggressive and cuts through the mix.</p></div>';

  var vidUrl = isPrs ? 'https://www.youtube.com/watch?v=wmoc9ksdZdE' : 'https://www.youtube.com/watch?v=3Dhn56ybQHg';
  var vidTitle = isPrs ? 'Official PRS Setup Guide' : 'Epiphone Les Paul Setup Guide';

  html+='<button class="tbtn primary" style="width:100%; margin-bottom: 24px; display:flex; justify-content:center; align-items:center; gap:10px;" onclick="window.open(\''+vidUrl+'\', \'_blank\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg> '+vidTitle+'</button>';

  return html;
}

    updateNav();

    document.querySelectorAll('.view-panel').forEach(function(p){
       if(p.id === 'panel-' + ui.view) {
           p.classList.add('active');

           p.classList.remove('active');

       p.scrollTop = tops[p.id] || 0;

    initCalCarousel();

  } catch(err) {

    var root=document.getElementById("root");

// Calendar carousel scroll listener for fluid swiping and month preview
document.addEventListener("scroll", function(e) {
  if(e.target && e.target.id === "cal-carousel") {
    var carousel = e.target;
    var panels = carousel.querySelectorAll('.cal-panel');
    var width = carousel.offsetWidth;
    var scrollLeft = carousel.scrollLeft;
    var index = Math.round(scrollLeft / width);
    if(panels[index]) {
      var ym = panels[index].getAttribute('data-ym').split('-');
      var y = parseInt(ym[0], 10);
      var m = parseInt(ym[1], 10);
      if(ui.calYear !== y || ui.calMonth !== m) {
        ui.calYear = y;
        ui.calMonth = m;
        var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var tTitle = document.getElementById('cal-month-title');
        var yTitle = document.getElementById('cal-year-title');
        if(tTitle) tTitle.textContent = monthNames[m];
        if(yTitle) yTitle.textContent = y;
      }
    }
  }
}, {capture: true, passive: true});


document.addEventListener("click",function(e){

  if(e.target.closest("a")) return;
  var t=e.target.closest("[data-action],[data-toggle],#authBtn,.shell-search");
  if(!t) return;

  if(t.id === "authBtn"){
    if(currentUser){ signOut(auth).then(() => { showToast("Logged out"); render(); }); } 
    else { signInWithPopup(auth, googleProvider).catch(err => showToast("Login failed")); }
    return;
  }
  if(t.classList.contains("shell-search")){
    showToast("Global search coming in a future phase");
    return;
  }

  if(t.dataset.toggle){ toggleCheck(t.dataset.toggle); return; }
  var a=t.dataset.action;
  
  if(a==="go"){
    ui.view=t.dataset.view;
    var panel = document.getElementById('panel-' + ui.view);
    if(panel) panel.scrollTo({top: 0, behavior: 'smooth'});
    updateNav();
    render();
    return;
  }
  
  if(a==="toggleacc"){ui.lib[t.dataset.acc]=!ui.lib[t.dataset.acc]; render();}
  else if(a==="setday"){ ui.dayOverride=t.dataset.day; render(); }
  else if(a==="chop"){ setChop(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="test"){ setTest(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="bonuslvl"){ setBonusLevel(t.dataset.k,parseInt(t.dataset.d,10),parseInt(t.dataset.max,10)); }
  else if(a==="blockprac"){ toggleBlockPracticed(t.dataset.block,t.dataset.day); }
  else if(a==="togm"){ toggleCheck(t.dataset.key); }
  else if(a==="togimprov"){ 
    var gk = "g"+t.dataset.g+"e"+t.dataset.e;
    state.improvChecks[gk] = !state.improvChecks[gk]; 
    saveState(); render();
  }
  else if(a==="advanceimprov"){ 
    state.improvIndex++; 
    showToast("\ud83d\udd13 New Gate Unlocked!"); 
    saveState(); render();
  }
  else if(a==="activateday"){ setActiveDay(t.dataset.day); }
  else if(a==="resetactiveday"){ resetActiveDay(); }
  else if(a==="cloudsave"){ 
    if(!currentUser) { showToast("Please login first to save to cloud."); return; }
    setDoc(doc(db, "users", currentUser.uid), state).then(() => showToast("Progress manually saved to cloud!")).catch(() => showToast("Error saving to cloud."));
  }
  else if(a==="cloudload"){ 
    if(!currentUser) { showToast("Please login first to load from cloud."); return; }
    getDoc(doc(db, "users", currentUser.uid)).then(docSnap => {
      if(docSnap.exists()){
        replaceState(Object.assign(defaultState(), docSnap.data()));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
        showToast("Progress loaded from cloud!");
      } else {
        showToast("No cloud data found.");
      }
    }).catch(() => showToast("Error loading from cloud."));
  }
  else if(a==="reset"){ handleReset(); }
  else if(a==="cancelreset"){ cancelReset(); }
  else if(a==="confirmreset"){ confirmReset(); }
  else if(a==="canceljump"){ cancelPhaseJumpBack(); }
  else if(a==="confirmjump"){ confirmPhaseJumpBack(); }
  else if(a==="togglemute"){ state.dojo.audioMuted = !state.dojo.audioMuted; saveState(); render(); }
  else if(a==="dojoopen"){
    document.querySelectorAll('.codex-view').forEach(e=>e.classList.remove('active'));
    let targetId = t.dataset.target;
    let targetElem = document.getElementById('dojo-' + targetId);
    if(targetId === 'codex-list') targetElem.innerHTML = renderCodexList();
    targetElem.classList.add('active');
  }
  else if(a==="dojoback"){
    document.querySelectorAll('.codex-view').forEach(e=>e.classList.remove('active'));
    document.getElementById('dojo-dash-view').classList.add('active');
    render();
  }
  else if(a==="readcodex"){
    let id = parseInt(t.dataset.id,10);
    if(!state.dojo.readCodexes.includes(id)) {
      state.dojo.readCodexes.push(id);
      addXP(100);
    }
    document.querySelectorAll('.codex-view').forEach(e=>e.classList.remove('active'));
    let reader = document.getElementById('dojo-codex-reader');
    reader.innerHTML = '<div class="game-header" style="margin-bottom:8px;"><button class="tbtn" data-action="dojoopen" data-target="codex-list">&lsaquo; Back to Library</button></div>' + 
      '<h2>' + CODEX_DATA[id].title + '</h2>' + CODEX_DATA[id].content;
    reader.classList.add('active');
  }
  else if(a==="dojoplay"){
    if(t.dataset.game === 'architect') startArchitectGame();
    else showToast("Mini-game coming in next update!");
  }
  else if(a==="dojoans"){
    handleDojoAnswer(parseInt(t.dataset.ans, 10));
  }
  else if(a==="dojonext"){
    if(currentMinigame === 'architect') startArchitectGame();
  }
  else if(a==="calprev"){ changeCalMonth(-1); }
  else if(a==="calnext"){ changeCalMonth(1); }
  else if(a==="caltoday"){ ui.calMonth = new Date().getMonth(); ui.calYear = new Date().getFullYear(); render(); }

});

document.addEventListener("change",function(e){
  if(e.target.dataset.action==="setphase") handlePhaseSelect(parseInt(e.target.value,10));
  if(e.target.dataset.action==="setGuitar") { state.setupGuitar = e.target.value; saveState(); render(); }
  if(e.target.dataset.action==="setTuning") { state.setupTuning = e.target.value; saveState(); render(); }
});

ensureDailyReset();
render();
if (typeof forceRemoveSplash === 'function') {
  forceRemoveSplash();
} else {
  var sp = document.getElementById("splash");
  if (sp) sp.remove();
}
</script>
</body>
