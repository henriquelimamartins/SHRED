<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Shred Roadmap</title>

<link rel="icon" type="image/png" href="./favicon.png?v=4">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=4">
<meta name="theme-color" content="#101217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHRED">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap');

:root{
  --bg:#101217;--card:#1b1e27;--card2:#1e222c;--border:#2a2e38;--accent:#ff3b30;--accent2:#ff5a4e;
  --amber:#f5a623;--text:#eef0f4;--muted:#9aa0ac;--blue:#6fa8ff;--green:#63d69a;--purple:#b052ff;
}
*{box-sizing:border-box}

::-webkit-scrollbar { display: none; }
* { -ms-overflow-style: none; scrollbar-width: none; }

html{
  margin:0; padding:0; width:100%; height:100%; min-height:100vh; background:var(--bg); overflow:hidden;
}
body{
  margin:0; padding:0; width:100%; min-height:100vh; height:100%; background:var(--bg); touch-action:manipulation;
  overflow:hidden; font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;
}
@media all and (display-mode: standalone){ html,body{min-height:100vh;} }
button,a,img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0;}
p{margin:0;line-height:1.5;color:var(--muted);font-size:14px;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:9999;}
.splashinner{display:flex;flex-direction:column;align-items:center;}
.splashtitle{font-family:'Oswald', sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;text-align:center;line-height:1.15;color:#fff;margin-top:16px;}
.splashtitle span{color:var(--accent);}

/* --- RESPONSIVE SHELL LAYOUT --- */
#root{
  position:fixed; inset:0; display:flex; flex-direction:row; width:100%; height:100vh; max-width:100%;
  margin:0; background:var(--bg); overflow:hidden;
}

.sidebar {
  display:none; width:260px; background:#15171e; border-right:1px solid var(--border);
  flex-direction:column; z-index:100;
}
.sidebar-header { padding:24px 20px; border-bottom:1px solid var(--border); }
.sidebar-nav { flex:1; padding:20px 12px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
.sidebar-nav button {
  display:flex; align-items:center; gap:12px; padding:12px 16px; width:100%; border-radius:10px;
  background:transparent; border:none; color:var(--muted); font-size:14px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.5px; transition:background 0.2s, color 0.2s;
}
.sidebar-nav button:hover { background:var(--card); color:var(--text); }
.sidebar-nav button.active { background:var(--card2); color:var(--accent2); }
.sidebar-nav button.active.improv-nav { color:var(--purple); }
.sidebar-nav button.active.dojo-nav { color:var(--blue); }

.main-area { flex:1; display:flex; flex-direction:column; position:relative; overflow:hidden; height:100%; }

.topbar {
  background:#101217; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;
  border-bottom:1px solid var(--border); z-index:50; flex:0 0 auto;
}
.topbar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:10px; max-width:1000px; margin-left:auto; margin-right:auto;}
.brand { font-family:'Oswald', sans-serif; font-weight:700; font-size:15px; letter-spacing:1px; flex:1; margin-bottom:0; }
.brand span { color:var(--accent); }
.mobile-brand { display:block; }
.auth-container { display:flex; align-items:center; gap:8px; }
.user-email { font-size:11px; color:var(--muted); font-family:'Inter', system-ui, sans-serif; font-weight:500; }

.shell-search {
  display:flex; align-items:center; gap:8px; background:var(--card2); border:1px solid var(--border);
  border-radius:20px; padding:6px 12px; color:var(--muted); font-size:12px; cursor:pointer; flex:1;
  max-width:300px; margin:0 10px; transition:0.2s;
}
.shell-search:hover { border-color:var(--muted); color:var(--text); }
.shell-search .ic { font-size:12px; }
.shell-search input { background:transparent; border:none; color:var(--text); outline:none; font-family:inherit; font-size:12px; width:100%; }

.views-container { flex:1; position:relative; overflow:hidden; background:var(--bg); }
.view-panel {
  display:none; width:100%; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:20px 16px calc(90px + env(safe-area-inset-bottom, 0px));
}
.view-panel.active { display:block; animation:fadein 0.25s ease; }
.panel-content { max-width:1000px; margin:0 auto; width:100%; }

.botnav {
  position:fixed; bottom:0; left:0; right:0; background:#15171e; border-top:1px solid var(--border);
  display:flex; padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px)); z-index:100;
}
.botnav-inner { display:flex; width:100%; max-width:520px; margin:0 auto; }
.botnav button {
  flex:1; background:none; border:none; color:var(--muted); font-size:8.5px; text-transform:uppercase;
  letter-spacing:.2px; padding:6px 1px; display:flex; flex-direction:column; align-items:center;
  gap:3px; font-weight:600; border-radius:8px;
}
.botnav button .ic { font-size:16px; }
.botnav button.active { color:var(--accent2); }
.botnav button.active.improv-nav { color:var(--purple); }
.botnav button.active.dojo-nav { color:var(--blue); }

@media (min-width: 768px) {
  .sidebar { display:flex; }
  .botnav { display:none; }
  .mobile-brand { display:none; }
  .topbar-header { justify-content:flex-end; }
  .view-panel { padding:30px 40px 60px; }
}
@media (max-width: 767px) {
  .shell-search .srch-txt { display:none; }
  .shell-search { max-width:36px; padding:6px; justify-content:center; border-radius:50%; margin:0; }
  .shell-search input { display:none; }
}

/* --- REUSABLE UI COMPONENTS --- */
.eyebrow{color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.h2{font-size:18px;}
.lede{font-size:14px;margin-bottom:16px;text-align:justify;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.card h3{font-size:14px;margin-bottom:10px;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.card h3 .tag{text-align:right;}
.tag{color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0;font-weight:500;}

/* HEADER PROGRESS STYLES */
.header-progress-grid { display:flex; gap:16px; margin-bottom:12px; max-width:1000px; margin-left:auto; margin-right:auto; }
.prog-col { flex:1; background:#15171e; border:1px solid var(--border); border-radius:10px; padding:12px; min-width:0; }
.prog-title { font-size:10.5px; color:var(--muted); text-transform:uppercase; font-weight:700; letter-spacing:1px; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* Technique Roadmap specific */
.phasebar-wrapper { width:100%; margin:0; }
.phasebar{display:flex;gap:4px;margin-bottom:4px;}
.pseg{flex:1;height:8px;border-radius:5px;background:var(--card2);border:1px solid var(--border);overflow:hidden;}
.pseg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;}
.plabels{display:flex;gap:4px;}
.plabels span{flex:1;text-align:center;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.plabels span.cur{color:var(--accent2);font-weight:700;}

/* Musical Development specific */
.md-label { font-size:11px; color:var(--muted); font-style:italic; font-weight:500; display:flex; align-items:center; height:22px;}

@media (max-width:767px) { .header-progress-grid { flex-direction:column; gap:8px; } }

.bignum{font-family:'Oswald', sans-serif;font-size:32px;font-weight:700;}
.statrow{display:flex;gap:12px;margin-bottom:16px;}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.stat .lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}

.navbtn{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin-bottom:12px;width:100%;text-align:left;color:var(--text);transition:transform 0.1s, border-color 0.2s;}
.navbtn:active{transform:scale(0.98);}
.navbtn:hover{border-color:var(--muted);}
.navbtn .ic{font-size:24px; flex-shrink:0; text-align:center; min-width:28px;}
.navbtn b{display:block;font-family:'Oswald', sans-serif;font-size:16px;text-transform:uppercase;letter-spacing:.5px;}
.navbtn span{font-size:12px;color:var(--muted);}
.navbtn.accent{border-color:#4a2226;background:#211316;}
.navbtn.blue{border-color:#263049;background:#161b26;}
.navbtn.purple{border-color:#361d4a;background:#1a1025;}
.navbtn.info{border-color:#264034;background:#12211c;}
.navbtn.setupbtn{border-color:#3a301e;background:#1a150e;}

ul.check{list-style:none;padding:0;margin:0;}
ul.check li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #23262f;}
ul.check li:last-child{border-bottom:none;}
.box{flex:0 0 20px;height:20px;border-radius:5px;border:1.5px solid #565a66;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;}
.box.on{background:var(--accent);border-color:var(--accent);}
.box.on:after{content:'\\2713';color:#fff;font-size:12px;font-weight:700;}
.box.purple.on{background:var(--purple);border-color:var(--purple);}

.itxt{flex:1;font-size:13.5px;color:var(--text);line-height:1.4;}
.itxt a{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px;border-radius:4px;}
.itxt a:focus-visible { outline: 2px solid var(--accent); }
.itxt.done, .itxt.done a{color:var(--muted); text-decoration:line-through;}
.itxt.done .tag{text-decoration:none; display:inline-block;}
ul.check li.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #23262f;}
ul.check li.mrow:last-child{border-bottom:none;}

.mbtn{flex:0 0 auto;border-radius:8px;border:1.5px solid var(--border);background:var(--card2);color:var(--muted);font-size:12px;font-weight:700;padding:8px 14px;letter-spacing:.3px;white-space:nowrap;}
.mbtn.on{background:#123324;border-color:var(--green);color:var(--green);}
.mbtn.blue.on{background:#16233a;border-color:var(--blue);color:var(--blue);}
.mbtn.purple.on{background:#231535;border-color:var(--purple);color:var(--purple);}
.mbtn.ro{opacity:.4;pointer-events:none;}

.docli{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #23262f;}
.docli:last-child{border-bottom:none;}
.docic{font-size:15px;flex:0 0 20px;text-align:center;}

.chop{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #23262f;gap:10px;}
.chop:last-child{border-bottom:none;}
.chop .nm{font-size:13px;line-height:1.4;}
.chop .nm b{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px;}
.stepper{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.stepper button{width:30px;height:30px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:16px;line-height:1;}
.stepper .lvl{font-family:'Oswald', sans-serif;font-size:16px;min-width:36px;text-align:center;}
.lvl.hit{color:var(--green);}

.blk{border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:12px;transition:opacity .2s;}
.blk.improv{border-left-color:var(--purple);}
.blk.done-today{border-left-color:var(--green);opacity:.62;}
.blk.improv.done-today{border-left-color:var(--green);}
.blk .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
.blk .nm{font-family:'Oswald', sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;}
.blk .topright{display:flex;align-items:center;gap:12px;}
.blk .min{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.blkcheck{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700;cursor:pointer;white-space:nowrap;}
.blkcheck .box{width:18px;height:18px;border-radius:4px;margin:0;}
.blkcheck .box.on:after{font-size:11px;}
.blkcheck.ro{opacity:.4;cursor:default;}

.daypick{display:flex;gap:6px;margin-bottom:12px;}
.dchip2{flex:1;padding:8px 4px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:11px;font-weight:700;text-align:center;transition:0.2s;}
.dchip2:hover{border-color:var(--muted);}
.dchip2.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.dchip2.istoday:after{content:' •';margin-left:3px;}
.dchip2.isactive{border-color:var(--accent);}

.calendar-header-nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:13px; font-weight:600; color:var(--muted); }
.calendar-header-nav button { flex-direction:column; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:6px; border-radius:6px; font-size:10px; height:auto; gap:3px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; line-height:1; text-transform:uppercase; font-weight:bold; transition:0.2s;}
.calendar-header-nav button:hover:not(:disabled) { border-color:var(--muted); }
.calendar-header-nav button:disabled { opacity:0.2; pointer-events:none; }
.center-date { text-align:center; line-height:1.2; font-size:12px; }
.center-date span { display:block; }

.streak-wrapper { overflow:hidden; position:relative; touch-action:pan-y; }
.cal-carousel { display:flex; width:100%; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; }
.cal-panel { flex:0 0 100%; width:100%; scroll-snap-align:start; }
.streak-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; }

.s-day { background:var(--card2); border-radius:6px; height:50px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; border:1px solid var(--border); position:relative; }
.s-month-badge { position:absolute; top:2px; left:0; right:0; text-align:center; font-size:8px; font-weight:700; color:var(--muted); opacity:0.8; letter-spacing:0.5px; }
.s-day .s-date { font-family:'Oswald', sans-serif; font-size:15px; font-weight:700; color:var(--text); line-height:1; margin-top:2px; transition:color 0.2s;}
.s-day .s-wkd { font-size:9px; text-transform:uppercase; color:var(--muted); margin-top:2px; font-weight:600; letter-spacing:.3px; transition:color 0.2s;}

.s-day.past { background:#16181e; opacity:0.85; }
.s-day.other-month { opacity:0.35 !important; }
.s-day.weekend { background:#2d1e21; border-color:transparent; }
.s-day.past.weekend { background:#1f1618; }
.s-day.hit { background:#123324 !important; border-color:var(--green) !important; opacity:1 !important; }
.s-day.hit .s-date, .s-day.hit .s-wkd { color:var(--green) !important; opacity:1; }
.s-day.today { border-color:var(--accent) !important; background:rgba(255, 59, 48, 0.15) !important; opacity:1 !important; }
.s-day.today .s-date { color:var(--accent) !important; opacity:1; }
.s-day.today.hit .s-wkd { color:var(--muted) !important; }

.note{border-left:3px solid var(--amber);background:#241f14;padding:12px 14px;border-radius:0 10px 10px 0;font-size:13px;color:#e6d9b8;margin-bottom:14px;}
.note.purple{border-left-color:var(--purple); background:#1e1428; color:#d8b8ff;}
.tbtn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;transition:0.2s;}
.tbtn:hover{background:var(--card); border-color:var(--muted);}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.primary:hover{background:var(--accent2);}
.tbtn.danger{background:#2a1214;border-color:#5c1f22;color:#ff8a80;}
.tbtn.danger:hover{background:#3a191c;}
.tbtn.purple{background:#522878;border-color:#6c379e;color:#fff;}
.tbtn.purple:hover{background:#6c379e;}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
@media (min-width: 768px) { .toast { bottom: 40px; } }

.acc{margin-bottom:12px;}
.acchead{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;gap:12px;cursor:pointer;transition:border-color 0.2s;}
.acchead:hover{border-color:var(--muted);}
.acchead b{flex:1;font-family:'Oswald', sans-serif;font-size:14px;text-transform:uppercase;}
.acc-sub{font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500;text-align:right;}
.acc-right{display:flex;align-items:center;gap:10px;}
.accbody{padding:12px 6px 4px 16px; margin-left:8px; border-left:1px solid rgba(255,255,255,0.18); position:relative;}
.chev{color:var(--muted);font-size:14px;transition:transform .2s;}
.chev.open{transform:rotate(90deg);}

.select{
  background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:10px;
  padding:10px 34px 10px 14px; font-size:13.5px; font-weight:500; font-family:inherit;
  width:100%; margin-top:8px; appearance:none; -webkit-appearance:none; outline:none;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239aa0ac' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 14px center; background-size: 14px;
}
.select:hover { border-color:var(--muted); }

.list-card { background:transparent; border:none; padding:0; margin-bottom:16px; }
.list-card h3 { font-size:14.5px; margin-bottom:10px; color:#fff; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
table.info{width:100%;border-collapse:collapse;}
table.info th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:6px 6px;}
table.info td{font-size:13px;color:var(--text);padding:8px 6px;border-bottom:1px solid #23262f;vertical-align:top;}
table.info td.day{font-weight:700;white-space:nowrap;color:var(--accent2);}

@keyframes fadein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

/* --- DOJO SHELL CSS --- */
.dojo-explorer { display:flex; gap:20px; height:100%; min-height:500px; }
.dojo-sidebar { flex:0 0 240px; display:flex; flex-direction:column; gap:8px; border-right:1px solid var(--border); padding-right:16px; }
.dojo-content { flex:1; display:flex; flex-direction:column; }
@media (max-width:767px) { 
  .dojo-explorer { flex-direction:column; } 
  .dojo-sidebar { flex:none; border-right:none; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:16px; padding-right:0; } 
}
.cat-btn { text-align:left; background:transparent; border:1px solid transparent; padding:8px 12px; border-radius:8px; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; transition:0.2s; }
.cat-btn:hover { background:var(--card2); color:var(--text); }
.cat-btn.active { background:var(--card); border-color:var(--border); color:var(--accent2); }

.chapter-list { display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding-bottom:40px;}
.chapter-card { background:var(--card); border:1px solid var(--border); padding:16px; border-radius:12px; cursor:pointer; transition:0.2s; }
.chapter-card:hover { border-color:var(--muted); }
.chapter-card h4 { font-family:'Inter',sans-serif; color:var(--text); font-size:15px; font-weight:600; text-transform:none; margin-bottom:4px; }

.reader-layout { display:flex; gap:24px; }
.reader-article { flex:1; max-width:680px; }

// Strict schema validation merging defaults while preserving unknown cloud properties
function validateSchema(data) {
   if(!data || typeof data !== 'object' || Array.isArray(data)) return false;
   if(data.schemaVersion !== undefined) {
      if(typeof data.schemaVersion !== 'number' || data.schemaVersion < 0 || !Number.isInteger(data.schemaVersion)) return false;
      if(data.schemaVersion > LOCAL_SCHEMA_VERSION) return false;
      if(data.schemaVersion === 0) return false; // P1 correction
   }
   if(data.phaseIndex !== undefined) {
      if(typeof data.phaseIndex !== 'number' || !Number.isInteger(data.phaseIndex) || data.phaseIndex < 0 || data.phaseIndex >= PHASES.length) return false;
   }
   
   // P1 correction: Exhaustive inner object checks
   const objProps = ['chop', 'testLevel', 'bonusLevel', 'checks', 'practiced', 'improvChecks'];
   for(let prop of objProps) {
      if(data[prop] !== undefined && (typeof data[prop] !== 'object' || data[prop] === null || Array.isArray(data[prop]))) return false;
   }
   
   if(data.streakDates !== undefined && !Array.isArray(data.streakDates)) return false;
   if(data.improvIndex !== undefined && (typeof data.improvIndex !== 'number' || !Number.isInteger(data.improvIndex) || data.improvIndex < 0)) return false;
   
   // P1 correction: String fields mapping directly to application settings and dates
   const strProps = ['setupGuitar', 'setupTuning', 'practicedDate', 'congratsDate', 'activeDayOverride', 'activeDayDate'];
   for (let prop of strProps) {
      if(data[prop] !== undefined && data[prop] !== null && typeof data[prop] !== 'string') return false;
   }
   
   return true;
}

if(hasFirebase) {
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    googleProvider = new GoogleAuthProvider();
    db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });

    // Session identification mechanism
    onAuthStateChanged(auth, async (user) => {
      sessionGeneration += 1;
      const mySession = sessionGeneration;
      currentUid = user ? user.uid : null;
      currentUser = user;
      
      cloudWriteLock = false; // P5 correction: Clear stale locks on session change
      if (ui.conflictData) ui.conflictData = null; 
      
      if(user) {
        isSyncing = true; render();
        try {
          const docSnap = await getDoc(doc(db, "users", user.uid));
          if(mySession !== sessionGeneration || currentUid !== user.uid) return;
          
          if(docSnap.exists()){
            const cloudData = docSnap.data();
            if(!validateSchema(cloudData)) {
              cloudWriteLock = true;
              showToast("Cloud schema mismatch or unsupported version. Writes locked.");
            } else {
              if (state.unsynced) {
                // P2 correction: Bind conflict data to the exact session and mutation epoch
                ui.conflictData = { data: cloudData, session: mySession, uid: currentUid, mutation: mutationCount };
              } else {
                // Merge cloud data safely while preserving unknown properties
                state = Object.assign({}, defaultState(), cloudData, {unsynced: false});
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
                showToast("Progress synced from cloud!");
              }
            }
          } else {
            if(!cloudWriteLock) saveState(); 
          }
        } catch(e) { 
          if(mySession === sessionGeneration) {
            cloudWriteLock = true;
            console.error("Cloud read failed, writes locked to prevent overwrite.", e);
          }
        }
        if(mySession === sessionGeneration) {
          isSyncing = false;
          render();
        }
      } else {
        if(mySession === sessionGeneration) {
          isSyncing = false;
          render();
        }
      }
    });
  } catch(e) { console.error("Firebase init error:", e); }
}

const IMPROV_GATES = [
  { title: "The Horizontal Prison", desc: "Destroy the vertical pentatonic boxes and force expressiveness. Stop 'going up and down' and start playing melodies.", exercises: [ { t: "1. One-String Doom", desc: "<b>Key:</b> E minor<br><b>Track:</b> Heavy Stoner/Doom drone<br><b>Rule:</b> You can ONLY use the G string for 3 full minutes. Focus on finding E, G, B, D horizontally. Force yourself to use slides to connect notes instead of crossing strings.", listen: "<b>Tony Iommi (Black Sabbath)</b><br>'Snowblind' solo. Notice how he squeezes huge emotion out of horizontal slides and trills on single strings." }, { t: "2. The 4-Fret Box", desc: "<b>Key:</b> B minor<br><b>Track:</b> Slow minor blues vamp<br><b>Rule:</b> Stay strictly between frets 7 and 10. Use all 6 strings, but your hand cannot shift up or down the neck. Use intense bends to reach pitches that aren't physically under your fingers.", listen: "<b>David Gilmour (Pink Floyd)</b><br>'Comfortably Numb' (1st solo). He stays almost entirely in one tiny box, extracting pure gold via perfectly pitched 1.5-step bends." }, { t: "3. The Singing Acoustic Slide", desc: "<b>Key:</b> D minor (Dm - Bb - C)<br><b>Track:</b> Clean/Acoustic fingerpicked vamp<br><b>Rule:</b> Pick the string only once per beat. Every other note MUST be generated by sliding or hammering-on/pulling-off.", listen: "<b>Mikael Åkerfeldt (Opeth)</b><br>'Windowpane' or 'To Bid You Farewell' solos. Pay attention to his fluid, vocal-like slides between chord tones on clean tones." }, { t: "4. Pre-Bending the Fuzz", desc: "<b>Key:</b> C# minor<br><b>Track:</b> Massive Fuzz Stoner track<br><b>Rule:</b> Every phrase you play must START with a pre-bend (bend the string silently, strike it, and release it down to the target note).", listen: "<b>Nick DiSalvo (Elder)</b><br>'Lore'. Notice the crying, microtonal tension he creates by bending into and out of notes with heavy fuzz." } ] },
  { title: "The Chord Tone Architect", desc: "Eliminate the 4-second mental lag. Train your ear and fingers to land on the changes exactly as they happen.", exercises: [ { t: "1. The Target 3rd", desc: "<b>Key:</b> A minor (Am - F - C - G)<br><b>Track:</b> Prog ballad loop<br><b>Rule:</b> You must land on the 3rd of the chord EXACTLY on Beat 1. (Am -> C, F -> A, C -> E, G -> B). Play freely in between, but nail that target.", listen: "<b>John Petrucci (Dream Theater)</b><br>'The Spirit Carries On'. Notice how his fastest, most chaotic runs always resolve perfectly on the major or minor 3rd exactly on the downbeat." }, { t: "2. Chromatic Enclosures", desc: "<b>Key:</b> D minor (Dm - Bb - Gm - A7)<br><b>Track:</b> Backing track matching the progression<br><b>Rule:</b> Before landing on your target note on Beat 1, you must play the note one fret above it, and one fret below it, on the 'and' of Beat 4.", listen: "<b>Guthrie Govan</b><br>Listen to any of his fusion tracks or clinic solos. He uses chromatic enclosures constantly to 'surround' a note before landing on it safely." }, { t: "3. Arpeggio Outlining", desc: "<b>Key:</b> E minor (Em - C - B7 - Em)<br><b>Track:</b> Heavy mid-tempo<br><b>Rule:</b> NO SWEEPING. You must alternate-pick arpeggiated lines that explicitly spell out the chord underneath. When the B7 hits, you must emphasize the D#.", listen: "<b>Chuck Schuldiner (Death)</b><br>'Crystal Mountain' solo. Hear how he meticulously alternate-picks the underlying triads, completely avoiding bluesy pentatonic habits." }, { t: "4. The Vocal Orchestration", desc: "<b>Key:</b> A Major (A - D - E)<br><b>Track:</b> Epic rock ballad<br><b>Rule:</b> Do not play 'licks'. Imagine you are a singer. Play a distinct verse melody, leave a gap for a breath, and then play a chorus melody. Keep it singable.", listen: "<b>Brian May (Queen)</b><br>'Bohemian Rhapsody' or 'Killer Queen'. He literally plays compositions within compositions. Every solo is a memorable, hummable vocal line." }, { t: "5. The Sludge to Dominant Turn", desc: "<b>Key:</b> C minor (C5 - Bb5 - Ab5 - G7)<br><b>Track:</b> Classic Doom turnaround<br><b>Rule:</b> Play absolute filthy pentatonic sludge over the first 3 chords. When the G7 hits, switch instantly to C Harmonic Minor (target the B natural).", listen: "<b>Matt Pike (High on Fire) / Brent Hinds (Mastodon)</b><br>Listen to how they inject sudden, jarring harmonic minor or Middle Eastern scales at the very end of a dirty riff." } ] },
  { title: "The Rhythmic Displacer", desc: "Break the 'square' playing. Stop ending phrases where the ear expects them to end. Inject groove.", exercises: [ { t: "1. The Groove Metal Shift", desc: "<b>Key:</b> E minor<br><b>Track:</b> 90bpm Groove Metal (Pantera style)<br><b>Rule:</b> Write a heavy 4-note lick. In Bar 1, start it on Beat 1. In Bar 2, force yourself to start the exact same lick on the 'and' of Beat 2. In Bar 3, start it on Beat 4.", listen: "<b>Dimebag Darrell / James Hetfield</b><br>Listen to the main riff of 'I\\'m Broken' or 'Master of Puppets'. The aggression comes from syncopation and starting riffs on off-beats." }, { t: "2. Sustain Beyond the Barline", desc: "<b>Key:</b> B Standard<br><b>Track:</b> 50bpm Sludge/Doom<br><b>Rule:</b> Play a slow phrase but NEVER end it on Beat 4 or Beat 1. Hold your final bent note (or let it feedback) across the bar line into Beat 2 or 3 of the next bar.", listen: "<b>Monolord / Sleep</b><br>Let the fuzz do the work. Listen to how they strike a chord or bend and let it ring across multiple measures to build oppressive weight." }, { t: "3. The Texas Drag", desc: "<b>Key:</b> E Blues<br><b>Track:</b> Slow Blues shuffle<br><b>Rule:</b> Play entirely in triplets, but deliberately play slightly 'behind the beat' (late). Don't rush. Make the backing track wait for you.", listen: "<b>Stevie Ray Vaughan / Jimi Hendrix</b><br>'Texas Flood' or 'Red House'. The swagger comes from them dragging their phrasing slightly behind the snare drum." }, { t: "4. Odd-Meter Survival", desc: "<b>Meter:</b> 7/8<br><b>Track:</b> Prog Metal<br><b>Rule:</b> Improvise without getting lost. Count 1-2-3-4-1-2-3. Force yourself to land your heavy vibrato notes on the 1 of every other bar.", listen: "<b>Leprous / Dream Theater</b><br>'The Dance of Eternity'. Listen to how Petrucci makes weird time signatures feel natural and groovy by emphasizing the strong beats." } ] },
  { title: "The Modal Alchemist", desc: "Translate theory directly into emotion. Command specific colors without leaving the key.", exercises: [ { t: "1. Desert Rock Dorian", desc: "<b>Key:</b> D Dorian (Dm - G)<br><b>Track:</b> Vamp matching the progression<br><b>Rule:</b> Focus purely on the Dorian Major 6th (B natural). Alternate between minor pentatonic dirt and floating, spacey Dorian melodies.", listen: "<b>All Them Witches / King Buffalo</b><br>Listen to how they use the Dorian mode over simple two-chord vamps to create a vast, desert-highway atmosphere." }, { t: "2. Death Metal Dominant", desc: "<b>Key:</b> A Harmonic Minor (Am - E)<br><b>Track:</b> Vamp matching the progression<br><b>Rule:</b> Over the Am, play normal minor. The millisecond the E hits, play an E dominant or G# diminished arpeggio. Focus on the sinister drop from A to G#.", listen: "<b>Chuck Schuldiner (Death)</b><br>'Voice of the Soul'. The entire emotional weight of the track hinges on the tragic pull between the minor 6th and the perfect 5th." }, { t: "3. Oppressive Phrygian/Locrian", desc: "<b>Key:</b> A minor<br><b>Track:</b> Heavy A pedal chug<br><b>Rule:</b> Abuse the minor 2nd (Bb) and the flat 5th (Eb). Create the most dissonant, terrifying atmosphere possible without sounding 'wrong'.", listen: "<b>Gojira / Electric Wizard</b><br>'Toxic Garbage Island' or 'Dopethrone'. The crushing darkness comes directly from exploiting the Phrygian b2 interval against open strings." }, { t: "4. Mixolydian Classic Rock", desc: "<b>Key:</b> A Mixolydian (A7 - D7)<br><b>Track:</b> Vamp matching the progression<br><b>Rule:</b> Mix the Major 3rd (C#) and the minor 3rd (C natural) constantly. Bend the minor 3rd slightly sharp to get that classic blues-rock tension.", listen: "<b>Eric Clapton / Eddie Van Halen</b><br>'Crossroads' or 'Panama'. They seamlessly blur the line between major and minor by manipulating the 3rd." }, { t: "5. The Opeth Diminished Run", desc: "<b>Key:</b> E minor<br><b>Track:</b> Dark prog metal in E<br><b>Rule:</b> Use fully diminished arpeggios (minor 3rd intervals stacked) to transition between two heavy riffs. Build speed gradually.", listen: "<b>Fredrik Åkesson (Opeth)</b><br>'Heir Apparent'. Notice his terrifyingly clean diminished runs that connect the ultra-heavy sections." }, { t: "6. Space Rock Lydian", desc: "<b>Key:</b> C Lydian<br><b>Track:</b> Ambient C major drone<br><b>Rule:</b> Target the #4 (F#) exclusively. Let notes ring out with heavy delay and reverb. Create a sci-fi, floating sensation.", listen: "<b>Blood Incantation</b><br>Listen to their ambient/synth sections or the outro solos on 'Hidden History of the Human Race' for that cosmic Lydian expansion." } ] },
  { title: "Total Audiation", desc: "The Master Level. The brain commands, the fingers obey. No more muscle memory dictating your solos.", exercises: [ { t: "1. The Slash Sing-Along", desc: "<b>Key:</b> Any<br><b>Track:</b> Any melodic backing track<br><b>Rule:</b> Put the pick down. Sing/hum a 2-bar melody. Pick up the guitar and find those exact notes on the very first try. Repeat.", listen: "<b>Slash / Guthrie Govan</b><br>Both players have a 1:1 connection between their inner ear and their fretboard. What they hear in their head is instantly translated to the hands." }, { t: "2. Vocal Call & Response", desc: "<b>Key:</b> Any Blues Key<br><b>Track:</b> Slow Blues<br><b>Rule:</b> Play a lick. Then, attempt to sing a 'response' to that lick. Then play that response on the guitar. Keep the conversation going.", listen: "<b>Eric Clapton / John Mayer</b><br>Listen to how their guitar solos mimic a lead vocalist breathing, pausing, and answering themselves." }, { t: "3. Unaccompanied Soloing", desc: "<b>Key:</b> Free<br><b>Track:</b> NONE<br><b>Rule:</b> Play for 3 minutes with no backing track. You must keep the rhythm, the chord changes, and the melody entirely clear to the listener just by your playing.", listen: "<b>Eddie Van Halen</b><br>'Eruption' or 'Spanish Fly'. The ultimate masterclass in carrying the entire song (harmony, rhythm, melody) alone." }, { t: "4. The Free Expression Flow", desc: "<b>Key:</b> Shifting<br><b>Track:</b> 10-minute complex Prog track<br><b>Rule:</b> Improvise freely. Incorporate Dorian 6ths, Harmonic Minor 7ths, chromatic approaches, and rhythmic displacement seamlessly without stopping to think.", listen: "<b>The Legends</b><br>You are combining the brain of Petrucci, the darkness of Opeth, the soul of Gilmour, and the riff-power of Sabbath. Just play." } ] }
];

function defaultState(){
  return {phaseIndex:0,chop:{alt:0,sweep:0,legato:0,econ:0,tap:0},testLevel:{alt:0,sweep:0,legato:0,econ:0,tap:0,ult:0},bonusLevel:{},checks:{},practiced:{},practicedDate:null,congratsDate:null,activeDayOverride:null,activeDayDate:null,streakDates:[],setupGuitar:"prs",setupTuning:"e_std",improvIndex:0,improvChecks:{}};
}

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      var d=JSON.parse(raw);
      
      // F-03 Correction: Detect and protect against unsupported future schemas
      if (d.schemaVersion !== undefined && d.schemaVersion > LOCAL_SCHEMA_VERSION) {
        cloudWriteLock = true;
        d.schemaError = true;
        return d; // Return raw data to prevent default merge and preserve structure
      }
      
      // Clean up legacy dojo object without gamification variables safely migrating back
      if(d.dojo && (d.dojo.xp !== undefined || d.dojo.level !== undefined)) {
        delete d.dojo;
      }
      var isLegacySync = (d.unsynced === undefined);
      var st = Object.assign(defaultState(),d,{
        chop:Object.assign(defaultState().chop,d.chop||{}),
        testLevel:Object.assign(defaultState().testLevel,d.testLevel||{}),
        bonusLevel:d.bonusLevel||{},
        checks:d.checks||{},
        practiced:d.practiced||{},
        streakDates:d.streakDates||[],
        setupGuitar:d.setupGuitar||"prs",
        setupTuning:d.setupTuning||"e_std",
        improvIndex:d.improvIndex||0,
        improvChecks:d.improvChecks||{}
      });
      if(isLegacySync) { st.unsynced = true; localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }
      return st;
    }
  }catch(e){}
  return defaultState();
}

function markDirty() {
   state.unsynced = true;
   mutationCount += 1;
   try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function saveState(){
  markDirty();
  if(cloudWriteLock || !hasFirebase || !currentUid || !db) return;
  const snapshot = JSON.parse(JSON.stringify(state));
  delete snapshot.unsynced;
  snapshot.schemaVersion = LOCAL_SCHEMA_VERSION;
  
  const capturedSession = sessionGeneration;
  const capturedUid = currentUid;
  const capturedMutation = mutationCount;

  writeQueue = writeQueue.then(async () => {
     if (capturedSession !== sessionGeneration || cloudWriteLock || currentUid !== capturedUid) return;
     try {
        await setDoc(doc(db, "users", capturedUid), snapshot);
        // P3 correction: only clear unsynced if the precise mutation snapshot succeeds and remains current
        if (capturedSession === sessionGeneration && currentUid === capturedUid && capturedMutation === mutationCount) {
           state.unsynced = false;
           try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
        }
     } catch(e) {
        console.error("Cloud write queued fail:", e);
     }
  }).catch(e => { console.error("Write queue stalled:", e); });
}

let state=loadState();

function k(){return Array.prototype.slice.call(arguments).join(".");}
function todayISO(){return new Date().toISOString().slice(0,10);}
function todayName(){return DAYS[new Date().getDay()];}
function isWeekendDay(d){return d==="Sat"||d==="Sun";}
function activeDay(){ if(state.activeDayOverride && state.activeDayDate===todayISO()) return state.activeDayOverride; return todayName(); }

function ensureDailyReset(){
  var t=todayISO();
  if(state.practicedDate!==t){
    updateStreakStatus();
    state.practiced={};
    state.practicedDate=t;
    saveState();
  }
}

function itemKeysForPhase(idx){
  var p=PHASES[idx];
  if(p.kind==="setup"){
    var ks=[]; PREREQ.forEach(function(pr,i){ ks.push(k("p0","pre",i)); });
    return {keys:ks,chopTarget:null,testReq:null};
  }
  var ks3=[];
  (p.concept||[]).forEach(function(_,i){ks3.push(k(p.id,"c",i));});
  p.exercises.forEach(function(_,i){ks3.push(k(p.id,"e",i));});
  p.songs.forEach(function(_,i){ks3.push(k(p.id,"s",i));});
  return {keys:ks3,chopTarget:p.target,testReq:p.testReq};
}
function phasePercent(idx){
  if(idx<state.phaseIndex) return 100;
  if(idx>state.phaseIndex) return 0;
  var info=itemKeysForPhase(idx);
  var total=info.keys.length+(info.chopTarget?CHOP.length:0)+(info.testReq?TESTCATS.length:0);
  var done=info.keys.filter(function(kk){return !!state.checks[kk];}).length;
  if(info.chopTarget) done+=CHOP.filter(function(c){return state.chop[c.key]>=info.chopTarget;}).length;
  if(info.testReq) done+=TESTCATS.filter(function(c){return state.testLevel[c.key]>=info.testReq;}).length;
  return total?Math.round(done/total*100):0;
}

function totalStreak(){return (state.streakDates||[]).length;}
function updateStreakStatus(){
  var t = todayISO();
  var hasPracticed = Object.keys(state.practiced).some(function(k){ return state.practiced[k]; });
  var idx = state.streakDates.indexOf(t);
  if (hasPracticed && idx === -1) { state.streakDates.push(t); } 
  else if (!hasPracticed && idx !== -1 && state.practicedDate === t) { state.streakDates.splice(idx, 1); }
}
function currentStreak(){
  var dates = state.streakDates.slice().sort().reverse();
  if(dates.length===0) return 0;
  var streak = 0;
  var checkDate = new Date();
  var todayStr = checkDate.toISOString().slice(0,10);
  checkDate.setDate(checkDate.getDate() - 1);
  var yestStr = checkDate.toISOString().slice(0,10);
  
  var dStart = new Date();
  if(dates.indexOf(todayStr) !== -1) { streak = 1; } 
  else if(dates.indexOf(yestStr) !== -1) { streak = 1; dStart.setDate(dStart.getDate() - 1); } 
  else { return 0; }
  
  for(var i=1; i<=1000; i++){
     dStart.setDate(dStart.getDate() - 1);
     var iso = dStart.toISOString().slice(0,10);
     if(dates.indexOf(iso) !== -1) streak++;
     else break;
  }
  return streak;
}

function blockPKey(name,day){ return name+"."+day; }
function isBlockPracticed(name,day){ return !!state.practiced[blockPKey(name,day)]; }
function toggleBlockPracticed(name,day){ ensureDailyReset(); var kk=blockPKey(name,day); state.practiced[kk]=!state.practiced[kk]; applyStateChange(); }
function dailyBlocksStatus(day,idx){
  var p=PHASES[idx],st={};

function resetPhaseChecks(fromIdx,toIdx){

function markPhaseComplete(idx){
  var info=itemKeysForPhase(idx);
  info.keys.forEach(function(kk){ state.checks[kk]=true; });
  if(info.chopTarget) CHOP.forEach(function(c){ if((state.chop[c.key]||0)<info.chopTarget) state.chop[c.key]=info.chopTarget; });
  if(info.testReq) TESTCATS.forEach(function(c){ if((state.testLevel[c.key]||0)<info.testReq) state.testLevel[c.key]=info.testReq; });
}

    if(idx<PHASES.length-1 && phasePercent(idx)===100){ state.phaseIndex=idx+1; showToast("\ud83d\udd25 Phase unlocked: "+PHASES[idx+1].label+"!"); }

function handlePhaseSelect(newIdx){

function formatGauge(g){
  var parts = g.split('-');
  if(parts.length === 2) {
    var p1 = parseInt(parts[0], 10);
    var p2 = parseInt(parts[1], 10);
    var s1 = (p1 >= 10 && p1 <= 19) ? "0.0" + p1 : "0." + p1;
    var s2 = (p2 >= 10 && p2 <= 99) ? "0.0" + p2 : "0." + p2;
    return s1 + '" - ' + s2 + '" (' + g + ')';
  }
  return g;
}

function getEarliestYearMonth() {
  if(!state.streakDates || state.streakDates.length === 0) return { y: new Date().getFullYear(), m: new Date().getMonth() };
  var sorted = state.streakDates.slice().sort();
  var parts = sorted[0].split('-');
  return { y: parseInt(parts[0], 10), m: parseInt(parts[1], 10) - 1 };
}

function buildMonthGrid(y, m){
  var firstDayOfMonth = new Date(y, m, 1);
  var startDayOfWeek = (firstDayOfMonth.getDay() + 6) % 7; 
  var startDate = new Date(y, m, 1 - startDayOfWeek);

  var lastDayOfMonth = new Date(y, m + 1, 0);
  var endDayOfWeek = (lastDayOfMonth.getDay() + 6) % 7; 
  var endDate = new Date(y, m + 1, 0 + (6 - endDayOfWeek));

  var shortDays = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
  var shortMonths = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  var todayIsoStr = todayISO();
  var html = '<div class="streak-grid" >';

  for (var d = new Date(startDate.getTime()); d <= endDate; d.setDate(d.getDate() + 1)) {
    var iso = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
    var isHit = state.streakDates.indexOf(iso) !== -1;
    var isToday = iso === todayIsoStr;
    var isPast = iso < todayIsoStr;
    var dayOfWeek = d.getDay();
    var isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
    var isOtherMonth = d.getMonth() !== m;

    var c = "s-day";
    if(isPast) c += " past";
    if(isWeekend) c += " weekend";
    if(isOtherMonth) c += " other-month";
    if(isHit) c += " hit";
    if(isToday) c += " today";

    var dayName = shortDays[(dayOfWeek + 6) % 7];
    var dateNum = d.getDate();
    var isFirst = dateNum === 1;
    var isLast = dateNum === new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();

    var badgeHtml = "";
    if (isFirst || isLast) {
      badgeHtml = '<div class="s-month-badge">' + shortMonths[d.getMonth()] + '</div>';
    }

    html += '<div class="'+c+'">' + badgeHtml + '<div class="s-date">'+dateNum+'</div><div class="s-wkd">'+dayName+'</div></div>';
  }
  html += '</div>';
  return html;
}

function renderStreakCalendar(){
  var now = new Date();
  if (ui.calMonth === undefined) { ui.calMonth = now.getMonth(); ui.calYear = now.getFullYear(); }

  var m = ui.calMonth;
  var y = ui.calYear;
  var earliest = getEarliestYearMonth();
  var prevM = m - 1, prevY = y;
  if(prevM < 0) { prevM = 11; prevY--; }
  var nextM = m + 1, nextY = y;
  if(nextM > 11) { nextM = 0; nextY++; }

  var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var canGoBack = (y > earliest.y) || (y === earliest.y && m > earliest.m);
  var canGoFwd = (y < now.getFullYear()) || (y === now.getFullYear() && m < now.getMonth());

  var html = '<div class="calendar-header-nav">';
  html += '<div style="display:flex; gap:4px;">';
  html += '<button data-action="calprev" ' + (!canGoBack ? 'disabled' : '') + '><span>&lsaquo;</span><span>Prev</span></button>';
  html += '</div>';
  html += '<div class="center-date">';
  html += '<span style="font-weight:700; color:var(--accent2); text-transform:uppercase; font-size:13px; letter-spacing: 1px;" id="cal-month-title">' + monthNames[m] + '</span>';
  html += '<span style="color:var(--muted); font-weight:600;" id="cal-year-title">' + y + '</span>';
  html += '</div>';
  html += '<div style="display:flex; gap:4px;">';
  html += '<button data-action="calnext" ' + (!canGoFwd ? 'disabled' : '') + '><span>&rsaquo;</span><span>Next</span></button>';
  html += '<button data-action="caltoday" style="background:var(--accent); color:#fff; border-color:var(--accent);"><span>&#9660;</span><span>Today</span></button>';
  html += '</div></div>';

  html += '<div class="streak-wrapper" id="cal-swipe-area">';
  html += '<div class="cal-carousel" id="cal-carousel">';
  if(canGoBack) { html += '<div class="cal-panel" data-ym="'+prevY+'-'+prevM+'">' + buildMonthGrid(prevY, prevM) + '</div>'; }
  html += '<div class="cal-panel" data-ym="'+y+'-'+m+'">' + buildMonthGrid(y, m) + '</div>';
  if(canGoFwd) { html += '<div class="cal-panel" data-ym="'+nextY+'-'+nextM+'">' + buildMonthGrid(nextY, nextM) + '</div>'; }
  
  html += '</div></div>';
  return html;
}

      var body = '<p style="color:var(--text); font-weight:600; margin-bottom:6px;">Gate '+(actGate+1)+': '+gateObj.title+'</p>';
      if(nextEx) body += '<p style="font-size:13px; margin-bottom:10px;"><b>Next up:</b> '+nextEx.t+'</p>';

  var essential=ESSENTIAL[day]||"Reinforce Weakest";

  var focusBody='';
  if(day==="Mon"){
    if(p.concept && p.concept.length){
      var conceptHtml = getDailyActiveSequence(p.concept, p.id+".c", editable, true);
      focusBody += conceptHtml ? '<ul class="check">'+conceptHtml+'</ul>' : '<p>All concept videos completed.</p>';
    } else {
      focusBody += '<p>All concept videos completed.</p>';
    }
    
    var monExHtml = p.exercises.map(function(t,i){
      var kk = k(p.id,"e",i);
      return checkItem(t.t, kk, t.url, editable);
    }).join("");
    if(monExHtml) focusBody+='<p style="margin-top:8px;">Exercises in rotation (check off once solid):</p><ul class="check">'+monExHtml+'</ul>';
    else focusBody+='<p style="margin-top:8px;color:var(--muted);">All exercises mastered for this phase! \ud83c\udfb8</p>';

  } else if(day==="Tue"){
    var tueExHtml = p.exercises.map(function(t,i){
      var kk = k(p.id,"e",i);
      return checkItem(t.t, kk, t.url, editable);
    }).join("");
    if(tueExHtml) focusBody+='<p style="margin-bottom:8px;">Exercises in rotation (check off once solid):</p><ul class="check">'+tueExHtml+'</ul>';
    else focusBody+='<p style="margin-bottom:8px;color:var(--muted);">All exercises mastered for this phase! \ud83c\udfb8</p>';
    
    focusBody+='<p style="margin:8px 0;">Chop-builders (picking) - protect ~15 min:</p>'+chopRow(p.target,["alt","sweep"]);
  } else if(day==="Wed"){
    var theoryHtml = "";
    THEORY_DOCS.forEach(function(docItemObj){ theoryHtml += docItem(docItemObj.t, docItemObj.url); });
    var activeItem = null, activeGroup = null;
    for(var i=0; i<THEORY_GROUPS.length; i++){
      var g = THEORY_GROUPS[i];
      for(var j=0; j<g.items.length; j++){
        var t = g.items[j];
        if(!state.checks[t.key] || state.checks[t.key] === todayISO()){
          activeItem = t; activeGroup = g; break;
        }
      }
      if(activeItem) break;
    }
    if(activeGroup && activeGroup.docs) { activeGroup.docs.forEach(function(d){ theoryHtml += docItem(d.t, d.url); }); }
    var theorySeq = getDailyActiveSequence(THEORY_ITEMS, "theory", editable, true);
    if(theorySeq) { theoryHtml += theorySeq; } else { theoryHtml += '<p style="margin-top:8px;color:var(--muted);">All theory items completed!</p>'; }
    focusBody+='<p style="margin-bottom:8px;">Theory in rotation:</p><ul class="check">'+theoryHtml+'</ul>';
  } else if(day==="Thu"){
    focusBody+='<p style="margin-bottom:8px;">Chop-builders (legato/economy/tapping):</p>'+chopRow(p.target,["legato","econ","tap"]);
  } else if(day==="Fri"){
    focusBody+='<p>Revisit your hardest exercise or chop-builder from the week, then spend the micro-dose reinforcing whichever skill felt weakest.</p>';
    if(p.testReq){
      var met=TESTCATS.filter(function(c){return (state.testLevel[c.key]||0)>=p.testReq;}).length;
      focusBody+='<div class="note" style="margin-top:10px;">Phase Transition Test: '+met+'/'+TESTCATS.length+' at Level '+p.testReq+'+. <button class="tbtn" data-action="go" data-view="home" style="margin-top:8px;display:block;">Retake Phase Test \u2192</button></div>';
    }
  }
  if(day!=="Fri") focusBody+='<p style="margin-top:10px;">+ 5 min: '+linked(essential+" micro-dose",essUrl)+'</p>';
  html+=blk("focused",day,"Focused","30 + 5 min",focusBody,editable);

  if(day==="Mon"||day==="Thu"){ 
    var casualBody='';
    var songHtml = getDailyActiveSequence(p.songs||[], p.id+".s", editable, false);
    casualBody += songHtml ? '<ul class="check">'+songHtml+'</ul>' : '<p>All this tier\'s solos learned. \ud83c\udfb8</p>';
    html+=blk("casual",day,"Casual","15 min",casualBody,editable);
  }
  else if(day==="Tue" || day==="Wed" || day==="Fri"){ 
    var actGate = Math.min(state.improvIndex, IMPROV_GATES.length - 1);
    var gateObj = IMPROV_GATES[actGate];
    var nextEx = null;
    for(var i=0; i<gateObj.exercises.length; i++){
      if(!state.improvChecks["g"+actGate+"e"+i]) { nextEx = gateObj.exercises[i]; break; }
    }
    var body = '<p style="color:var(--text); font-weight:600; margin-bottom:6px;">Gate '+(actGate+1)+': '+gateObj.title+'</p>';
    if(nextEx) body += '<p style="font-size:13px; margin-bottom:10px;"><b>Next up:</b> '+nextEx.t+'</p>';
    else body += '<p style="font-size:13px; margin-bottom:10px;">Ready to unlock the next gate!</p>';
    body += '<button class="tbtn purple" data-action="go" data-view="improv" style="width:100%; text-align:center;">Open Improv Masterclass</button>';
    html+=blk("casual",day,"Improv & Expression","15 min",body,editable,"improv");
  }

  html+=blk("cooldown",day,"Cool-Down","5 min",'<p>Quick review - what clicked, what didn\'t.</p>',editable);
  return html;
}

function renderImprov(){
  var html='<div class="eyebrow" style="color:var(--purple);">Expression Track</div><div class="h2" style="font-size:22px;margin-bottom:12px;">The 5 Gates of Freedom</div>';
  html+='<p class="lede">Destroy your muscle memory. This is your progressive masterclass to unlock pure musical audiation. Do not advance until you master every exercise in a Gate.</p>';

  var actGate = Math.min(state.improvIndex, IMPROV_GATES.length - 1);
  var allDone = state.improvIndex >= IMPROV_GATES.length;

  var IMPROV_KEYS = [
    {k:"E minor", t:"Classic Heavy / Thrash"}, {k:"B minor", t:"Prog / Melodic Death"}, {k:"C# minor", t:"Sabbath / Doom Core"},
    {k:"C minor", t:"Sludge / Heavy Drop"}, {k:"A minor", t:"Neoclassical / Classic Rock"}, {k:"D minor", t:"Opeth / Dark Prog"},
    {k:"G minor", t:"Groove Metal"}, {k:"F# minor", t:"Technical / Prog"}, {k:"Bb minor", t:"Drop Bb Death Metal"},
    {k:"Eb minor", t:"Hendrix / Dark Blues"}, {k:"G# minor", t:"Modern Metal"}, {k:"F minor", t:"Moody / Symphonic"}
  ];
  var d = new Date();
  var dayOfYear = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 24 / 60 / 60 / 1000);
  var dayIndex = dayOfYear % IMPROV_KEYS.length;
  var tKey = IMPROV_KEYS[dayIndex];

  if (!allDone) {
    html+='<div class="note purple" style="text-align:center; margin-bottom:18px; padding:16px;">'+
          '<div style="font-size:11.5px; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; color:#d8b8ff;">Daily Transposition Target</div>'+
          '<b style="font-size:18px;">'+tKey.k+'</b> <span style="font-size:13px; opacity:0.8;">('+tKey.t+')</span>'+
          '<div style="font-size:12.5px; margin-top:10px; color:#eef0f4; font-weight:normal; line-height:1.5;">Read the exercises below in their example keys, but <b>force yourself to transpose and play them in '+tKey.k+' today</b>. This breaks vertical habits and builds true neck mastery.</div>'+
          '</div>';
  }

  if(allDone){
    html+='<div class="note purple" style="text-align:center;"><b>\ud83c\udfc6 YOU HAVE MASTERED THE 5 GATES!</b><br>You are now a free player. Keep using these tools in your daily jams.</div>';
  }

  IMPROV_GATES.forEach(function(g, i){
    var isPast = i < state.improvIndex;
    var isCur = i === actGate && !allDone;
    var isLocked = i > actGate;

    if(isLocked){
      html+='<div class="card" style="opacity:0.5;"><h3>\ud83d\udd12 Gate '+(i+1)+': '+g.title+'</h3></div>';
      return;
    }

    if(isPast){
      html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="improvG'+i+'"><b style="color:var(--purple);">\u2713 GATE '+(i+1)+': '+g.title.toUpperCase()+'</b><span class="chev'+(ui.lib["improvG"+i]?" open":"")+'">\u203a</span></div>';
      if(ui.lib["improvG"+i]){
        html+='<div class="accbody">';
        g.exercises.forEach(function(ex){ html+='<p style="font-size:13px; margin-bottom:10px; color:var(--muted);">\u2713 '+ex.t+'</p>'; });
        html+='</div>';
      }
      html+='</div>';
      return;
    }

    html+='<div class="card" style="border-color:var(--purple); box-shadow: 0 0 12px rgba(176,82,255,0.1);">'+
          '<h3 style="color:var(--purple); font-size:18px;">Gate '+(i+1)+': '+g.title+'</h3>'+
          '<p style="font-size:13.5px; margin-bottom:14px; text-align:justify;">'+g.desc+'</p>';
    
    var exercisesDone = 0;
    html+='<ul class="check">';
    g.exercises.forEach(function(ex, j){
      var isChecked = !!state.improvChecks["g"+i+"e"+j];
      if(isChecked) exercisesDone++;
      var btn = '<button class="mbtn purple'+(isChecked?" on":"")+'" data-action="togimprov" data-g="'+i+'" data-e="'+j+'">'+(isChecked?"\u2713 Mastered":"Unmastered")+'</button>';
      html+='<li class="mrow" style="flex-direction:column; align-items:stretch; gap:8px;">'+
            '<div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">'+
              '<b style="color:var(--text); font-size:14px; flex:1; min-width:0;">'+ex.t+'</b>'+
              '<div style="flex:0 0 auto;">'+btn+'</div>'+
            '</div>'+
            '<div style="font-size:13px; line-height:1.5; color:var(--muted); text-align:justify;">'+
              ex.desc+
              '<div class="note purple" style="margin-top:10px; margin-bottom:4px; padding:10px; font-size:12px; text-align:justify;">'+ex.listen+'</div>'+
            '</div>'+
            '</li>';
    });
    html+='</ul>';

    if(exercisesDone === g.exercises.length){
      html+='<button class="tbtn purple" style="width:100%; margin-top:18px;" data-action="advanceimprov">\ud83d\udd13 Unlock Gate '+(i+2)+'</button>';
    }
    
    html+='</div>';
  });

  return html;
}

     COMPENDIUM_CATEGORIES.forEach(function(c) {
        var active = ui.dojoCat === c.id ? " active" : "";

     });
  }
  html += '</div>';

  html += '<div class="dojo-content">';
  
  if (ui.searchStr && ui.searchStr.trim().length > 0) {
    let lowerStr = ui.searchStr.toLowerCase().trim();

    html += '<h3 style="font-size:22px; color:var(--text); margin-bottom:12px;">Results for "'+ui.searchStr+'"</h3><div class="chapter-list">';

       if (c.chapters) {
          c.chapters.forEach(ch => {
             let chData = CHAPTER_DATA[ch.id];
             let matchStr = ch.title.toLowerCase() + " " + c.title.toLowerCase();
             if (chData) {
                 chData.sections.forEach(s => matchStr += " " + s.content.toLowerCase());
             }
             if (matchStr.includes(lowerStr)) {
                hasMatches = true;
                html += '<div class="chapter-card" data-action="dojochap" data-ch="'+ch.id+'" data-cat="'+c.id+'"><h4>'+ch.title+'</h4><p style="font-size:12.5px;">Found in '+c.title+'</p></div>';
             }
          });
       }
    });
    if (!hasMatches) html += '<p style="color:var(--muted);">No matching curriculum chapters found.</p>';

    html += '<h3 style="font-size:22px; color:var(--text); margin-bottom:12px;">' + (cat ? cat.title : 'Select a Category') + '</h3>';

       html += '<p style="color:var(--muted); margin-top:10px;">Chapters for this category will be populated in a future phase.</p>';
    }
  }
  
  html += '</div></div>';
  return html;
}

function renderSetup(){
  var isPrs = state.setupGuitar === "prs";
  var conf = setupData[state.setupGuitar][state.setupTuning];
  
  var html='<div class="eyebrow">Gear Optimization</div><div class="h2" style="font-size:22px;margin-bottom:12px;">Guitar Setup Companion</div>';
  html+='<p class="lede">Follow these mechanical adjustments in exactly this order to achieve optimal low string action suitable for shredding without excessive fret buzz.</p>';

  html+='<div style="display:flex; gap:10px; margin-bottom:16px;">';
  html+='<select class="select" style="flex:1; margin-top:0;" data-action="setGuitar">';
  html+='<option value="prs" '+(isPrs?'selected':'')+'>PRS (25")</option>';
  html+='<option value="epi" '+(isPrs?'':'selected')+'>Les Paul (24.75")</option>';
  html+='</select>';
  
  html+='<select class="select" style="flex:1; margin-top:0;" data-action="setTuning">';
  html+='<option value="e_std" '+(state.setupTuning==='e_std'?'selected':'')+'>E Standard</option>';
  html+='<option value="drop_d" '+(state.setupTuning==='drop_d'?'selected':'')+'>Drop D</option>';
  html+='<option value="d_std" '+(state.setupTuning==='d_std'?'selected':'')+'>D Standard</option>';
  html+='<option value="drop_c" '+(state.setupTuning==='drop_c'?'selected':'')+'>Drop C</option>';
  html+='<option value="c_std" '+(state.setupTuning==='c_std'?'selected':'')+'>C Standard</option>';
  html+='<option value="dadfae" '+(state.setupTuning==='dadfae'?'selected':'')+'>DADFAE</option>';
  html+='</select>';
  html+='</div>';
  
  html+='<div class="note"><b>Note:</b> These target measurements are specifically optimized to match the tension profile of '+conf.gauge+' string gauge with E standard tuning on a 25" scale guitar.</div>';
  
  html+='<div class="card"><h3>Recommended Measurements</h3><table class="info"><tr><th>Adjustment</th><th>Target</th></tr>';
  html+='<tr><td class="day">String Gauge</td><td>'+formatGauge(conf.gauge)+'</td></tr>';
  if(isPrs) html+='<tr><td class="day">Tremolo Float</td><td>1.6 mm (1/16") off body</td></tr>';
  html+='<tr><td class="day">Neck Relief</td><td>'+conf.relief+' mm at 8th fret</td></tr>'+
    '<tr><td class="day">String Action (Low E)</td><td>'+conf.actBass+' mm at 12th fret</td></tr>'+
    '<tr><td class="day">String Action (High E)</td><td>'+conf.actTreb+' mm at 12th fret</td></tr>'+
    '<tr><td class="day">Pickup Height (Neck)</td><td>2.5 mm to string</td></tr>'+
    '<tr><td class="day">Pickup Height (Bridge)</td><td>1.5 mm to string</td></tr>'+
    '</table></div>';
    
  html+='<div class="card"><h3>1. Strip and Clean</h3><p style="text-align:justify;">Remove the old strings and deep clean the fretboard to lift away accumulated dirt. If needed (once every six months) condition the rosewood fretboard with a light coat of lemon oil. Leave it for 10 min for the neck to absorb the oils, and then wipe the excess away. Finally, clean the rest of the guitar body and hardware using appropriate instrument cleaning products.</p></div>';
  
  html+='<div class="card"><h3>2. Restring and Stretch</h3><p style="text-align:justify;">Install your fresh strings. Before measuring anything, stretch the strings thoroughly by pulling firmly on each string all the way up and down the neck. Retune and repeat until the tuning stops dropping.</p></div>';
  
  if(isPrs) {
    html+='<div class="card"><h3>3. Set the Tremolo Float</h3><p style="text-align:justify;">The PRS patented tremolo is designed to float exactly 1.6 mm parallel to the guitar body. If it sits too high or low, remove the back cavity plate and adjust the two claw screws holding the springs (tightening pulls the bridge down; loosening lifts it). Retune after every turn.<br><br><b>The PRS F# Test:</b> To confirm the perfect float without a ruler, pull the whammy bar back as far as it will go. When perfectly balanced, your open Low E string will pitch up exactly to an F#.</p></div>';
  }
  
  html+='<div class="card"><h3>4. Adjust Neck Relief (Truss Rod)</h3><p style="text-align:justify;">Put a capo on the 1st fret and hold down the Low E string at the highest fret. Check the gap between the bottom of the string and the top of the 8th fret. You want a tiny '+conf.relief+' mm gap - just enough space to slide a piece of standard printer paper through with slight friction. If the gap is larger, tighten the truss rod (turn clockwise) a quarter-turn at a time.</p></div>';
  
  html+='<div class="card"><h3>5. Lower the String Action</h3><p style="text-align:justify;">With the neck nearly flat, adjust the saddle heights. Set the Low E to '+conf.actBass+' mm at the 12th fret, and the High E to '+conf.actTreb+' - '+(conf.actTreb+0.1).toFixed(1)+' mm at the 12th fret.<br><br><b>Radius matching:</b> '+(isPrs ? 'Drop the individual saddles using a small Allen key on the two grub screws per saddle. Adjust the middle strings so they form a matching '+setupData[state.setupGuitar].radius+' curve to fit the fretboard.' : 'Adjust the thumbwheels on either side of the Tune-O-Matic bridge. The bridge saddle slots are pre-cut to automatically match the '+setupData[state.setupGuitar].radius+' fretboard radius.')+' Test by doing 1.5-step bends above the 15th fret on the High E string; if the note chokes out, raise that specific side.</p></div>';
  
  html+='<div class="card"><h3>6. Lubricate the Nut</h3><p style="text-align:justify;">Apply graphite powder (from a mechanical pencil) or a dedicated lubricant into the nut slots before tuning up to pitch. This stops the strings from binding and pinging.</p></div>';
  
  html+='<div class="card"><h3>7. Set Intonation</h3><p style="text-align:justify;">This must be done last. Check the tuning of the open string, then fret the note at the 12th fret. If the fretted note is <b>sharp</b>, use a screwdriver on the back of the bridge to move the saddle <b>backward</b> (away from the neck). If the fretted note is <b>flat</b>, move the saddle <b>forward</b>. Retune the open string after every saddle adjustment until both match perfectly.</p></div>';

  html+='<div class="card"><h3>8. Adjust Pickup Height</h3><p style="text-align:justify;">Fret the highest note ('+(isPrs?'24th':'22nd')+' fret). Adjust the height screws on either side of the pickups. Set the bass side to <b>2.5 mm</b> below the strings, and the treble side to <b>1.5 mm</b>. In high-gain and shred contexts, keeping the bass side slightly lower prevents the low-end from becoming muddy (stratitis), while the higher treble side keeps your pick attack aggressive and cuts through the mix.</p></div>';

  var vidUrl = isPrs ? 'https://www.youtube.com/watch?v=wmoc9ksdZdE' : 'https://www.youtube.com/watch?v=3Dhn56ybQHg';
  var vidTitle = isPrs ? 'Official PRS Setup Guide' : 'Epiphone Les Paul Setup Guide';

  html+='<button class="tbtn primary" style="width:100%; margin-bottom: 24px; display:flex; justify-content:center; align-items:center; gap:10px;" onclick="window.open(\''+vidUrl+'\', \'_blank\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33 2.78 2.78 0 0 0 1.94 2c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg> '+vidTitle+'</button>';

  return html;
}

function render(){
  try {
    if (state.schemaError) {
      document.body.innerHTML = '<div style="padding: 30px 20px; color: #ffb3ac; font-family: \'Inter\', sans-serif; line-height: 1.6; background: #101217; height: 100vh; width: 100vw; z-index: 99999; position: fixed; inset: 0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">' +
        '<div style="font-size:48px; margin-bottom:16px;">\u26a0\ufe0f</div>' +
        '<h3 style="font-family: \'Oswald\', sans-serif; font-size:24px; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; color:#fff;">Version Incompatible</h3>' +
        '<p style="max-width:400px; color:var(--muted); font-size:15px;">Your locally stored progress was saved by a newer version of The Shred Roadmap.</p>' +
        '<p style="max-width:400px; color:var(--muted); font-size:15px; margin-top:12px;">Please clear your cache and reload the application to the latest version to prevent data corruption. Cloud sync has been locked.</p>' +
        '</div>';
      return;
    }

    ensureDailyReset();
    if(!document.getElementById("views-container")) initAppLayout();

    var cLayer = document.getElementById('conflict-layer');
    if (ui.view === 'conflict' || ui.conflictData) {
       cLayer.innerHTML = renderConflict();
       return; 
    } else {
       cLayer.innerHTML = '';
    }

    var tops = {};
    document.querySelectorAll('.view-panel').forEach(function(p){ tops[p.id] = p.scrollTop; });

    var topbarHTML = '<div class="topbar-header">';
    topbarHTML += '<div class="brand mobile-brand">THE <span>SHRED</span> ROADMAP</div>';
    topbarHTML += '<div class="shell-search" onclick="showToast(\'Global search coming in a future phase\')"><span class="ic">🔍</span><input type="text" readonly placeholder="Search..." style="pointer-events:none;"></div>';

    if(hasFirebase){
      topbarHTML += '<div class="auth-container">';
      if(currentUser && currentUser.email){
        var shortName = currentUser.email.split('@')[0];
        topbarHTML += '<span class="user-email">' + shortName + '</span>';
      }
      topbarHTML += '<button id="authBtn" class="dchip2" style="padding:7px 12px; margin:0; border-color:var(--border); color:var(--text);">' + (currentUid ? "Logout" : "Login") + '</button></div>';
    }
    topbarHTML += '</div>' + renderHeaderProgress();
    document.getElementById('topbar').innerHTML = topbarHTML;

    document.getElementById('panel-home').innerHTML = '<div class="panel-content">' + renderHome() + '</div>';
    document.getElementById('panel-daily').innerHTML = '<div class="panel-content">' + renderDaily() + '</div>';
    document.getElementById('panel-improv').innerHTML = '<div class="panel-content">' + renderImprov() + '</div>';
    document.getElementById('panel-dojo').innerHTML = '<div class="panel-content">' + renderDojoView() + '</div>';
    document.getElementById('panel-library').innerHTML = '<div class="panel-content">' + renderLibrary() + '</div>';
    document.getElementById('panel-setup').innerHTML = '<div class="panel-content">' + renderSetup() + '</div>';

    updateNav();

    document.querySelectorAll('.view-panel').forEach(function(p){
       if(p.id === 'panel-' + ui.view) { p.classList.add('active'); } 
       else { p.classList.remove('active'); }
       p.scrollTop = tops[p.id] || 0;
    });
    
    initCalCarousel();

  } catch(err) {
    console.error("Render error:", err);
    var root=document.getElementById("root");
    if(root) { root.innerHTML = '<div style="padding: 20px; color: #ff3b30; font-family: monospace;"><h3>Render Error:</h3><p>' + err.message + '</p><pre>' + err.stack + '</pre></div>'; }
  }
}

document.addEventListener("scroll", function(e) {
  if(e.target && e.target.id === "cal-carousel") {
    var carousel = e.target;
    var panels = carousel.querySelectorAll('.cal-panel');
    var width = carousel.offsetWidth;
    var scrollLeft = carousel.scrollLeft;
    var index = Math.round(scrollLeft / width);
    if(panels[index]) {
      var ym = panels[index].getAttribute('data-ym').split('-');
      var y = parseInt(ym[0], 10);
      var m = parseInt(ym[1], 10);
      if(ui.calYear !== y || ui.calMonth !== m) {
        ui.calYear = y;
        ui.calMonth = m;
        var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        var tTitle = document.getElementById('cal-month-title');
        var yTitle = document.getElementById('cal-year-title');
        if(tTitle) tTitle.textContent = monthNames[m];
        if(yTitle) yTitle.textContent = y;
      }
    }
  }
}, {capture: true, passive: true});

document.addEventListener("click",function(e){
  if(e.target.closest("a") && !e.target.closest(".reader-index")) return;
  var t=e.target.closest("[data-action],[data-toggle],#authBtn,.shell-search");
  if(!t) return;

  var a = t.dataset.action || t.dataset.toggle;
  if(t.id === "authBtn") a = "authBtn";

  if (isSyncing) return;
  if (ui.conflictData && a !== "resolveLocal" && a !== "resolveCloud") return;

  if(a === "resolveLocal") {
     // P2 correction: Validate session ownership before proceeding
     if (!ui.conflictData || ui.conflictData.session !== sessionGeneration || ui.conflictData.uid !== currentUid) {
         ui.conflictData = null; render(); return;
     }
     ui.conflictData = null;
     saveState();
     ui.view = 'home';
     render(); return;
  }
  if(a === "resolveCloud") {
     // P2 correction: Validate session ownership & local mutation guard
     if (!ui.conflictData || ui.conflictData.session !== sessionGeneration || ui.conflictData.uid !== currentUid) {
         ui.conflictData = null; render(); return;
     }
     if (ui.conflictData.mutation !== mutationCount) {
         showToast("Local changes occurred. Cannot apply old cloud data safely.");
         ui.conflictData = null; render(); return;
     }
     state = Object.assign({}, defaultState(), ui.conflictData.data, {unsynced: false});
     try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}catch(e){}
     mutationCount += 1;
     ui.conflictData = null;
     ui.view = 'home';
     render(); return;
  }

  if(a === "authBtn"){
    if(currentUid){ signOut(auth).then(() => { showToast("Logged out"); }); } 
    else { signInWithPopup(auth, googleProvider).catch(err => showToast("Login failed")); }
    return;
  }
  if(t.classList.contains("shell-search") && !t.querySelector("#dojo-local-search")){ showToast("Global search coming in a future phase"); return; }

  if(t.dataset.toggle){ toggleCheck(t.dataset.toggle); return; }
  
  if(a==="go"){
    ui.view=t.dataset.view;
    var panel = document.getElementById('panel-' + ui.view);
    if(panel) panel.scrollTo({top: 0, behavior: 'smooth'});
    updateNav();
    render();
    return;
  }
  
  if(a==="toggleacc"){ui.lib[t.dataset.acc]=!ui.lib[t.dataset.acc]; render();}
  else if(a==="setday"){ ui.dayOverride=t.dataset.day; render(); }
  else if(a==="chop"){ setChop(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="test"){ setTest(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="bonuslvl"){ setBonusLevel(t.dataset.k,parseInt(t.dataset.d,10),parseInt(t.dataset.max,10)); }
  else if(a==="blockprac"){ toggleBlockPracticed(t.dataset.block,t.dataset.day); }
  else if(a==="togm"){ toggleCheck(t.dataset.key); }
  else if(a==="togimprov"){ 
    var gk = "g"+t.dataset.g+"e"+t.dataset.e;
    state.improvChecks[gk] = !state.improvChecks[gk]; 
    saveState(); render();
  }
  else if(a==="advanceimprov"){ 
    state.improvIndex++; 
    showToast("\ud83d\udd13 New Gate Unlocked!"); 
    saveState(); render();
  }
  else if(a==="activateday"){ setActiveDay(t.dataset.day); }
  else if(a==="resetactiveday"){ resetActiveDay(); }
  else if(a==="cloudsave"){ 
    if(!currentUid) { showToast("Please login first to save to cloud."); return; }
    if(cloudWriteLock) { showToast("Cloud locked. Cannot save."); return; }
    saveState();
    showToast("Progress manually queued to cloud!");
  }
  else if(a==="cloudload"){ 
    if(!currentUid) { showToast("Please login first to load from cloud."); return; }
    const loadSession = sessionGeneration;
    const loadUid = currentUid;
    const loadMutation = mutationCount;

    isSyncing = true; render();

    getDoc(doc(db, "users", loadUid)).then(docSnap => {
      if(loadSession !== sessionGeneration || currentUid !== loadUid) return;

      if(docSnap.exists()){
        const cloudData = docSnap.data();
        if(!validateSchema(cloudData)) {
            showToast("Cloud version incompatible.");
        } else {
            if (loadMutation !== mutationCount || state.unsynced) {
                // P2 correction: Bind conflict data tightly to the session generating it
                ui.conflictData = { data: cloudData, session: loadSession, uid: loadUid, mutation: mutationCount };
                render();
            } else {
                state = Object.assign({}, defaultState(), cloudData, {unsynced: false});
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
                render();
                showToast("Progress loaded from cloud!");
            }
        }
      } else { showToast("No cloud data found."); }
    }).catch(() => {
      if(loadSession === sessionGeneration) showToast("Error loading from cloud.");
    }).finally(() => {
      if(loadSession === sessionGeneration) { isSyncing = false; render(); }
    });
  }
  else if(a==="reset"){ handleReset(); }
  else if(a==="cancelreset"){ cancelReset(); }
  else if(a==="confirmreset"){ confirmReset(); }
  else if(a==="canceljump"){ cancelPhaseJumpBack(); }
  else if(a==="confirmjump"){ confirmPhaseJumpBack(); }
  else if(a==="scrollto") {
    let target = document.getElementById(t.dataset.target);
    if(target) target.scrollIntoView({behavior: 'smooth'});
  }
  else if(a==="dojonav"){
    ui.dojoView = t.dataset.dest;
    render();
  }
  else if(a==="dojobackcat"){
    ui.dojoView = 'compendium';
    render();
  }
  else if(a==="dojocat"){
    ui.dojoCat = t.dataset.id;
    ui.searchStr = "";
    ui.dojoView = 'compendium';
    render();
  }
  else if(a==="dojochap"){
    ui.dojoChap = t.dataset.ch;
    ui.dojoCat = t.dataset.cat;
    ui.searchStr = "";
    ui.dojoView = 'reader';
    render();
  }
  else if(a==="calprev"){ changeCalMonth(-1); }
  else if(a==="calnext"){ changeCalMonth(1); }
  else if(a==="caltoday"){ ui.calMonth = new Date().getMonth(); ui.calYear = new Date().getFullYear(); render(); }
});

document.addEventListener("change",function(e){
  if(isSyncing || ui.conflictData) return;
  if(e.target.dataset.action==="setphase") handlePhaseSelect(parseInt(e.target.value,10));
  if(e.target.dataset.action==="setGuitar") { state.setupGuitar = e.target.value; saveState(); render(); }
  if(e.target.dataset.action==="setTuning") { state.setupTuning = e.target.value; saveState(); render(); }
});

try {
  ensureDailyReset();
  render();
  if (typeof forceRemoveSplash === 'function') {
    forceRemoveSplash();
  } else {
    var sp = document.getElementById("splash");
    if (sp) sp.remove();
  }
} catch (initErr) {
  console.error("Initialization error:", initErr);
  var root = document.getElementById("root");
  if (root) {
    root.innerHTML = '<div style="padding: 20px; color: #ff3b30; font-family: monospace; line-height: 1.5; background: #101217; height: 100vh; width: 100vw; z-index: 99999; position: relative;"><h3>Application Initialization Error:</h3><p>' + initErr.message + '</p><pre>' + initErr.stack + '</pre></div>';
  }
  if (typeof forceRemoveSplash === 'function') forceRemoveSplash();
}
</script>
</body>
</html>
