<style>
:root{
  --bg:#101217;--card:#1b1e27;--card2:#1e222c;--border:#2a2e38;--accent:#ff3b30;--accent2:#ff5a4e;
  --amber:#f5a623;--text:#eef0f4;--muted:#9aa0ac;--blue:#6fa8ff;--green:#63d69a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);touch-action:manipulation;}
button,a,img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0;}
p{margin:0;line-height:1.45;color:var(--muted);font-size:13.5px;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
#root{max-width:520px;margin:0 auto;padding-bottom:78px;min-height:100vh;}
#splash{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;}
.splashinner{display:flex;flex-direction:column;align-items:center;}
.splashtitle{font-family:'Oswald';font-weight:700;font-size:26px;letter-spacing:2px;text-align:center;line-height:1.15;color:#fff;margin-top:16px;}
.splashtitle span{color:var(--accent);}
.topbar{position:sticky;top:0;z-index:5;background:#101217;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--border);}
.brand{font-family:'Oswald';font-weight:700;font-size:15px;letter-spacing:1px;}
.brand span{color:var(--accent);}
.topsubtitle{font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-family:'Inter',system-ui,sans-serif;font-weight:400;}
.page{padding:6px 16px 20px;}
.eyebrow{color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.h2{font-size:16px;}
.lede{font-size:13px;margin-bottom:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:12px;}
.card h3{font-size:13.5px;margin-bottom:8px;color:#fff;}
.tag{color:var(--muted);font-size:10.5px;text-transform:none;letter-spacing:0;font-weight:500;}
/* progress bar (sticky, always visible) */
.phasebar{display:flex;gap:4px;margin-bottom:3px;}
.pseg{flex:1;height:8px;border-radius:5px;background:var(--card2);border:1px solid var(--border);overflow:hidden;}
.pseg i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;}
.plabels{display:flex;gap:4px;}
.plabels span{flex:1;text-align:center;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.plabels span.cur{color:var(--accent2);font-weight:700;}
.bignum{font-family:'Oswald';font-size:30px;font-weight:700;}
.statrow{display:flex;gap:10px;margin-bottom:12px;}
.stat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;}
.stat .lbl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
/* nav buttons (home menu) */
.navbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;width:100%;text-align:left;color:var(--text);}
.navbtn .ic{font-size:22px;}
.navbtn b{display:block;font-family:'Oswald';font-size:15px;text-transform:uppercase;letter-spacing:.5px;}
.navbtn span{font-size:11.5px;color:var(--muted);}
.navbtn.accent{border-color:#4a2226;background:#211316;}
.navbtn.blue{border-color:#263049;background:#161b26;}
.navbtn.info{border-color:#264034;background:#12211c;}
/* checklist */
ul.check{list-style:none;padding:0;margin:0;}
ul.check li{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;}
ul.check li:last-child{border-bottom:none;}
.box{flex:0 0 20px;height:20px;border-radius:5px;border:1.5px solid #565a66;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;}
.box.on{background:var(--accent);border-color:var(--accent);}
.box.on:after{content:'\2713';color:#fff;font-size:12px;font-weight:700;}
.itxt{flex:1;font-size:13px;color:var(--text);line-height:1.3;}
.itxt a{text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px;}
.itxt.done, .itxt.done a{color:var(--muted); text-decoration:line-through;}
.itxt.done .tag{text-decoration:none; display:inline-block;}
li.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #23262f;}
li.mrow:last-child{border-bottom:none;}
.mbtn{flex:0 0 auto;border-radius:8px;border:1.3px solid var(--border);background:var(--card2);color:var(--muted);font-size:11px;font-weight:700;padding:7px 12px;letter-spacing:.3px;white-space:nowrap;}
.mbtn.on{background:#123324;border-color:var(--green);color:var(--green);}
.mbtn.blue.on{background:#16233a;border-color:var(--blue);color:var(--blue);}
.mbtn.ro{opacity:.4;pointer-events:none;}
.docli{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;}
.docli:last-child{border-bottom:none;}
.docic{font-size:14px;flex:0 0 20px;text-align:center;}
/* chop / test stepper */
.chop{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #23262f;gap:8px;}
.chop:last-child{border-bottom:none;}
.chop .nm{font-size:12px;line-height:1.3;}
.chop .nm b{display:block;font-size:9.5px;color:var(--muted);font-weight:500;}
.stepper{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.stepper button{width:26px;height:26px;border-radius:7px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1;}
.stepper .lvl{font-family:'Oswald';font-size:14px;min-width:34px;text-align:center;}
.lvl.hit{color:var(--green);}
/* daily blocks */
.blk{border-left:3px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;transition:opacity .2s;}
.blk.done-today{border-left-color:var(--green);opacity:.62;}
.blk .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.blk .nm{font-family:'Oswald';font-weight:700;font-size:13.5px;text-transform:uppercase;}
.blk .topright{display:flex;align-items:center;gap:10px;}
.blk .min{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.blkcheck{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700;cursor:pointer;white-space:nowrap;}
.blkcheck .box{width:16px;height:16px;border-radius:4px;margin:0;}
.blkcheck .box.on:after{font-size:10px;}
.blkcheck.ro{opacity:.4;cursor:default;}
/* day picker */
.daypick{display:flex;gap:4px;margin-bottom:10px;}
.dchip2{flex:1;padding:7px 3px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:10.5px;font-weight:700;text-align:center;}
.dchip2.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.dchip2.istoday:after{content:'\2022';margin-left:2px;}
.dchip2.isactive{border-color:var(--accent);}
/* bottom nav */
.botnav{position:fixed;bottom:0;left:0;right:0;background:#15171e;border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;}
.botnav button{flex:1;background:none;border:none;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.3px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;border-radius:8px;}
.botnav button .ic{font-size:16px;}
.botnav button.active{color:var(--accent2);}
/* misc */
.note{border-left:3px solid var(--amber);background:#241f14;padding:10px 12px;border-radius:0 10px 10px 0;font-size:12px;color:#e6d9b8;margin-bottom:12px;}
.tbtn{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:600;}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tbtn.danger{background:#2a1214;border-color:#5c1f22;color:#ff8a80;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.acc{margin-bottom:10px;}
.acchead{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.acchead b{font-family:'Oswald';font-size:13px;text-transform:uppercase;}
.accbody{padding:10px 4px 2px;}
.chev{color:var(--muted);font-size:11px;transition:transform .2s;}
.chev.open{transform:rotate(90deg);}
.select{background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit;width:100%;margin-top:6px;}
table.info{width:100%;border-collapse:collapse;}
table.info th{text-align:left;font-size:9px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding:4px 4px;}
table.info td{font-size:11.5px;color:var(--text);padding:6px 4px;border-bottom:1px solid #23262f;vertical-align:top;}
table.info td.day{font-weight:700;white-space:nowrap;color:var(--accent2);}
.infolist{list-style:none;padding:0;margin:0;}
.infolist li{font-size:12px;color:var(--text);padding:6px 0;border-bottom:1px solid #23262f;}
.infolist li:last-child{border-bottom:none;}
</style>
<!-- Guaranteed splash screen fallback safety script -->
<script>
  window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
      var sp = document.getElementById("splash");
      if(sp) sp.remove();
    }, 1500);
  });
</script>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  // ⚠️ PASTE YOUR FIREBASE CONFIG OBJECT HERE ⚠️
};

const hasFirebase = !!firebaseConfig.apiKey;
let auth, db, googleProvider, currentUser = null;

if(hasFirebase) {
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    googleProvider = new GoogleAuthProvider();
    db = initializeFirestore(app, { localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()}) });

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if(user) {
        try {
          const docSnap = await getDoc(doc(db, "users", user.uid));
          if(docSnap.exists()){
            state = Object.assign(defaultState(), docSnap.data());
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            showToast("Progress synced from cloud!");
          } else {
            await setDoc(doc(db, "users", user.uid), state);
            showToast("Local progress saved to cloud!");
          }
        } catch(e) {
          console.error("Sync error:", e);
        }
      }
      render();
    });
  } catch(e) {
    console.error("Firebase init error:", e);
  }
}

const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_ORDER=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const STORAGE_KEY="shredRoadmapState_v7";

function defaultState(){return {phaseIndex:0,chop:{alt:0,sweep:0,legato:0,econ:0,tap:0},testLevel:{alt:0,sweep:0,legato:0,econ:0,tap:0},bonusLevel:{},checks:{},practiced:{},practicedDate:null,congratsDate:null,activeDayOverride:null,activeDayDate:null,streakDates:[]};}
function loadState(){try{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var d=JSON.parse(raw);return Object.assign(defaultState(),d,{chop:Object.assign(defaultState().chop,d.chop||{}),testLevel:Object.assign(defaultState().testLevel,d.testLevel||{}),bonusLevel:d.bonusLevel||{},checks:d.checks||{},practiced:d.practiced||{},streakDates:d.streakDates||[]});}}catch(e){}return defaultState();}

function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
  if(hasFirebase && currentUser && db) {
    setDoc(doc(db, "users", currentUser.uid), state).catch(e => console.error("Firebase save err", e));
  }
}

let state=loadState();
let ui={view:"home",lib:{},dayOverride:null,surprise:null,resetConfirm:false,phaseJumpPending:null};

function k(){return Array.prototype.slice.call(arguments).join(".");}
function todayISO(){return new Date().toISOString().slice(0,10);}
function todayName(){return DAYS[new Date().getDay()];}
function isWeekendDay(d){return d==="Sat"||d==="Sun";}
function activeDay(){ if(state.activeDayOverride && state.activeDayDate===todayISO()) return state.activeDayOverride; return todayName(); }

function ensureDailyReset(){
  var t=todayISO();
  if(state.practicedDate!==t){ state.practiced={}; state.practicedDate=t; saveState(); }
}

function itemKeysForPhase(idx){
  var p=PHASES[idx];
  if(p.kind==="setup"){
    var ks=[]; PREREQ.forEach(function(pr,i){if(!pr.doc) ks.push(k("p0","pre",i));});
    return {keys:ks,chopTarget:null,testReq:null};
  }
  var ks3=[];
  (p.concept||[]).forEach(function(_,i){ks3.push(k(p.id,"c",i));});
  p.exercises.forEach(function(_,i){ks3.push(k(p.id,"e",i));});
  p.songs.forEach(function(_,i){ks3.push(k(p.id,"s",i));});
  return {keys:ks3,chopTarget:p.target,testReq:p.testReq};
}
function phasePercent(idx){
  if(idx<state.phaseIndex) return 100;
  if(idx>state.phaseIndex) return 0;
  var info=itemKeysForPhase(idx);
  var total=info.keys.length+(info.chopTarget?5:0)+(info.testReq?5:0);
  var done=info.keys.filter(function(kk){return !!state.checks[kk];}).length;
  if(info.chopTarget) done+=CHOP.filter(function(c){return state.chop[c.key]>=info.chopTarget;}).length;
  if(info.testReq) done+=TESTCATS.filter(function(c){return state.testLevel[c.key]>=info.testReq;}).length;
  return total?Math.round(done/total*100):0;
}
function nextUnchecked(list,prefix){for(var i=0;i<list.length;i++){if(!state.checks[prefix+"."+i]) return i;}return -1;}
function totalStreak(){return (state.streakDates||[]).length;}
function logToday(){var t=todayISO();if(state.streakDates.indexOf(t)===-1) state.streakDates.push(t);}

/* ---- block-level "Practiced" flags, keyed per weekday ---- */
function blockPKey(name,day){ return name+"."+day; }
function isBlockPracticed(name,day){ return !!state.practiced[blockPKey(name,day)]; }
function toggleBlockPracticed(name,day){ ensureDailyReset(); var kk=blockPKey(name,day); state.practiced[kk]=!state.practiced[kk]; applyStateChange(); }
function dailyBlocksStatus(day,idx){
  var p=PHASES[idx],st={};
  if(p.kind==="setup"){ st.prereq=isBlockPracticed("prereq",day); st.warmup=isBlockPracticed("warmup",day); return st; }
  st.warmup=isBlockPracticed("warmup",day);
  if(isWeekendDay(day)){ st.casual=isBlockPracticed("casual",day); return st; }
  st.focused=isBlockPracticed("focused",day);
  st.casual=isBlockPracticed("casual",day);
  st.cooldown=isBlockPracticed("cooldown",day);
  return st;
}
function isFullyDoneToday(){
  var st=dailyBlocksStatus(activeDay(),state.phaseIndex);
  var keys=Object.keys(st);
  return keys.length>0 && keys.every(function(kk){return st[kk];});
}

function resetPhaseChecks(fromIdx,toIdx){
  for(var i=fromIdx;i<=toIdx;i++){
    var info=itemKeysForPhase(i);
    info.keys.forEach(function(kk){ delete state.checks[kk]; });
  }
}
function markPhaseComplete(idx){
  var info=itemKeysForPhase(idx);
  info.keys.forEach(function(kk){ state.checks[kk]=true; });
  if(info.chopTarget) CHOP.forEach(function(c){ if((state.chop[c.key]||0)<info.chopTarget) state.chop[c.key]=info.chopTarget; });
  if(info.testReq) TESTCATS.forEach(function(c){ if((state.testLevel[c.key]||0)<info.testReq) state.testLevel[c.key]=info.testReq; });
}

function applyStateChange(skipAuto){
  ensureDailyReset();
  logToday();
  if(!skipAuto){
    var idx=state.phaseIndex;
    if(idx<PHASES.length-1 && phasePercent(idx)===100){ state.phaseIndex=idx+1; showToast("\ud83d\udd25 Phase unlocked: "+PHASES[idx+1].label+"!"); }
  }
  if(isFullyDoneToday() && state.congratsDate!==todayISO()){
    state.congratsDate=todayISO();
    showToast("\ud83e\udd18 Nice work \u2014 today's full session is complete!");
  }
  saveState(); render();
}
function toggleCheck(key){ 
  // Store today's date instead of 'true' so we know exactly when it was checked
  state.checks[key] = state.checks[key] ? false : todayISO(); 
  applyStateChange(); 
}
function setChop(sk,d){ state.chop[sk]=Math.max(0,Math.min(10,(state.chop[sk]||0)+d)); applyStateChange(); }
function setTest(sk,d){ state.testLevel[sk]=Math.max(0,Math.min(5,(state.testLevel[sk]||0)+d)); applyStateChange(); }
function setBonusLevel(key,d,max){ state.bonusLevel[key]=Math.max(0,Math.min(max,(state.bonusLevel[key]||0)+d)); applyStateChange(); }
function setActiveDay(d){
  state.activeDayOverride=d; state.activeDayDate=todayISO();
  saveState(); render();
  showToast(DAY_FULL[d]+" is now your active session");
}
function resetActiveDay(){ state.activeDayOverride=null; saveState(); render(); }

function handlePhaseSelect(newIdx){
  var oldIdx=state.phaseIndex;
  if(newIdx===oldIdx) return;
  if(newIdx>oldIdx){
    for(var i=oldIdx;i<newIdx;i++) markPhaseComplete(i);
    state.phaseIndex=newIdx;
    applyStateChange(true);
    showToast("Now on "+PHASES[newIdx].label+" \u2014 earlier phases marked complete");
  } else {
    ui.phaseJumpPending=newIdx;
    render();
  }
}
function confirmPhaseJumpBack(){
  var newIdx=ui.phaseJumpPending, oldIdx=state.phaseIndex;
  resetPhaseChecks(newIdx+1,oldIdx);
  state.phaseIndex=newIdx;
  ui.phaseJumpPending=null;
  applyStateChange(true);
  showToast("Now on "+PHASES[newIdx].label+" \u2014 later phases reset");
}
function cancelPhaseJumpBack(){ ui.phaseJumpPending=null; render(); }

function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(showToast._h);showToast._h=setTimeout(function(){t.classList.remove("show");},2600);}

/* ---------- backup / reset ---------- */
function exportState(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="shred-roadmap-progress.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){ document.getElementById("importFile").click(); }
function handleImportFile(file){
  var reader=new FileReader();
  reader.onload=function(e){
    try{ var data=JSON.parse(e.target.result); state=Object.assign(defaultState(),data); saveState(); render(); showToast("Progress loaded!"); }
    catch(err){ showToast("That file couldn't be read."); }
  };
  reader.readAsText(file);
}
function handleReset(){ ui.resetConfirm=true; render(); }
function cancelReset(){ ui.resetConfirm=false; render(); }
function confirmReset(){
  localStorage.removeItem(STORAGE_KEY);
  state=defaultState();
  if(hasFirebase && currentUser && db) {
    setDoc(doc(db, "users", currentUser.uid), state).catch(e => console.error(e));
  }
  ui.resetConfirm=false;
  render();
  showToast("Everything has been reset.");
}

/* ---------- render helpers ---------- */
function linked(label,url){ return url? '<a href="'+url+'" target="_blank" rel="noopener">'+label+'</a>' : label; }
function checkItem(label,key,url,editable){
  if(editable===undefined) editable=true;
  var c=!!state.checks[key];
  var btn = editable
    ? '<button class="mbtn'+(c?" on":"")+'" data-action="togm" data-key="'+key+'">'+(c?"\u2713 Mastered":"Unmastered")+'</button>'
    : '<button class="mbtn ro'+(c?" on":"")+'">'+(c?"\u2713 Mastered":"Unmastered")+'</button>';
  return '<li class="mrow"><div class="itxt'+(c?" done":"")+'">'+linked(label,url)+'</div>'+btn+'</li>';
}
function prereqItem(label,key,url,editable){
  if(editable===undefined) editable=true;
  var c=!!state.checks[key];
  var btn = editable
    ? '<button class="mbtn blue'+(c?" on":"")+'" data-action="togm" data-key="'+key+'">'+(c?"\u2713 Completed":"Incomplete")+'</button>'
    : '<button class="mbtn ro blue'+(c?" on":"")+'">'+(c?"\u2713 Completed":"Incomplete")+'</button>';
  return '<li class="mrow"><div class="itxt'+(c?" done":"")+'">'+linked(label,url)+'</div>'+btn+'</li>';
}
function docItem(label,url){ return '<li class="docli"><div class="docic">\ud83d\udcd6</div><div class="itxt">'+linked(label,url)+'</div></li>'; }
function chopRow(target,onlyKeys,editable){
  if(editable===undefined) editable=true;
  var list=onlyKeys?CHOP.filter(function(c){return onlyKeys.indexOf(c.key)!==-1;}):CHOP;
  return list.map(function(c){
    var lvl=state.chop[c.key]||0,hit=target&&lvl>=target;
    var minus=editable?'<button data-action="chop" data-t="'+c.key+'" data-d="-1">\u2013</button>':'';
    var plus=editable?'<button data-action="chop" data-t="'+c.key+'" data-d="1">+</button>':'';
    return '<div class="chop"><div class="nm">'+linked(c.label,c.url)+(target?'<b>target: Level '+target+'</b>':'<b>lifetime level</b>')+'</div><div class="stepper">'+
      minus+'<div class="lvl'+(hit?" hit":"")+'">'+lvl+(target?"/"+target:"/10")+'</div>'+plus+'</div></div>';
  }).join("");
}
function testRow(req){
  return TESTCATS.map(function(c){
    var lvl=state.testLevel[c.key]||0,hit=req&&lvl>=req;
    return '<div class="chop"><div class="nm">'+linked(c.label,c.url)+' <span class="tag">(1-Min Test)</span>'+(req?'<b>need: Level '+req+'</b>':'<b>baseline</b>')+'</div><div class="stepper">'+
      '<button data-action="test" data-t="'+c.key+'" data-d="-1">\u2013</button><div class="lvl'+(hit?" hit":"")+'">'+lvl+'/5</div>'+
      '<button data-action="test" data-t="'+c.key+'" data-d="1">+</button></div></div>';
  }).join("");
}
function renderBonusList(){
  return BONUS.map(function(b){
    if(b.slider){
      var lvl=state.bonusLevel[b.slider.key]||0;
      var isMax = lvl >= b.slider.max;
      return '<div class="chop"><div class="nm">'+linked(b.t,b.url)+'</div><div class="stepper">'+
        '<button data-action="bonuslvl" data-k="'+b.slider.key+'" data-max="'+b.slider.max+'" data-d="-1">\u2013</button>'+
        '<div class="lvl'+(isMax?" hit":"")+'">'+lvl+'/'+b.slider.max+'</div>'+
        '<button data-action="bonuslvl" data-k="'+b.slider.key+'" data-max="'+b.slider.max+'" data-d="1">+</button></div></div>';
    }
    return '<div class="chop"><div class="nm">'+linked(b.t,b.url)+'</div></div>';
  }).join("");
}
function progressBar(){
  var segs="",labels="";
  PHASES.forEach(function(p,i){
    var pct=phasePercent(i);
    segs+='<div class="pseg"><i style="width:'+pct+'%"></i></div>';
    labels+='<span class="'+(i===state.phaseIndex?"cur":"")+'">Phase '+i+'</span>';
  });
  return '<div class="phasebar">'+segs+'</div><div class="plabels">'+labels+'</div>';
}
function dayPicker(selectedDay){
  var today=todayName(), act=activeDay();
  return '<div class="daypick">'+DAY_ORDER.map(function(d){
    var cls="dchip2"+(d===selectedDay?" on":"")+(d===today?" istoday":"")+(d===act&&act!==today?" isactive":"");
    return '<button class="'+cls+'" data-action="setday" data-day="'+d+'">'+d+'</button>';
  }).join("")+'</div>';
}
function blk(name,day,title,minText,bodyHtml,editable){
  if(editable===undefined) editable=true;
  var done=isBlockPracticed(name,day);
  var check = editable
    ? '<div class="blkcheck" data-action="blockprac" data-block="'+name+'" data-day="'+day+'"><div class="box'+(done?" on":"")+'"></div><span>Practiced</span></div>'
    : '<div class="blkcheck ro"><div class="box'+(done?" on":"")+'"></div><span>Practiced</span></div>';
  return '<div class="blk'+(done?" done-today":"")+'"><div class="top"><div class="nm">'+title+'</div><div class="topright">'+(minText?'<div class="min">'+minText+'</div>':'')+check+'</div></div>'+bodyHtml+'</div>';
}

/* ---------- views ---------- */
function renderHome(){
  var cur=PHASES[state.phaseIndex],pct=phasePercent(state.phaseIndex);
  var req=cur.testReq||null;
  var html='<div class="eyebrow">Daily Practice System</div>';
  html+='<div class="statrow"><div class="stat"><div class="bignum">'+pct+'%</div><div class="lbl">'+cur.label+'</div></div>'+
    '<div class="stat"><div class="bignum">\ud83d\udd25'+totalStreak()+'</div><div class="lbl">Days Logged</div></div></div>';
  html+='<div class="card"><h3>\ud83e\uddea Phase Transition Test <span class="tag">1-Minute Workout</span></h3>'+
    (req?'<p style="margin-bottom:8px;">Reach Level '+req+' on all five to unlock '+(PHASES[state.phaseIndex+1]?PHASES[state.phaseIndex+1].label:"the next phase")+'.</p>':'<p style="margin-bottom:8px;">Track your baseline here \u2014 informational at this stage.</p>')+
    testRow(req)+'</div>';
  html+='<button class="navbtn accent" data-action="go" data-view="daily"><div class="ic">\ud83c\udfaf</div><div><b>Daily Practice</b><span>Structured session, any day you pick</span></div></button>';
  html+='<button class="navbtn blue" data-action="go" data-view="free"><div class="ic">\ud83c\udfb8</div><div><b>Free Practice</b><span>Bonus content, essential skills, surprise me</span></div></button>';
  html+='<button class="navbtn" data-action="go" data-view="library"><div class="ic">\ud83d\udcda</div><div><b>All Phases</b><span>Browse &amp; check off any tier</span></div></button>';
  html+='<button class="navbtn info" data-action="go" data-view="info"><div class="ic">\u2139\ufe0f</div><div><b>Guide &amp; Info</b><span>Weekly rhythm, all phases, essential skills</span></div></button>';

  html+='<div class="card"><h3>Jump to phase</h3>';
  if(ui.phaseJumpPending!==null){
    html+='<p style="margin-bottom:8px;color:#ffb3ac;"><b>Jump back to Phase '+ui.phaseJumpPending+'?</b> This resets Phase '+(ui.phaseJumpPending+1)+' through Phase '+state.phaseIndex+"'s checklist items. Chop-builder and test levels are left as they are.</p>";
    html+='<div style="display:flex;gap:8px;"><button class="tbtn" style="flex:1;" data-action="canceljump">Cancel</button><button class="tbtn danger" style="flex:1;" data-action="confirmjump">Confirm</button></div>';
  } else {
    html+='<p>Advancing happens automatically once every item, chop level and test level in your current phase is done. Jump forward and earlier phases are marked complete too; jump back and later phases reset.</p><select class="select" data-action="setphase">';
    PHASES.forEach(function(p,i){html+='<option value="'+i+'"'+(i===state.phaseIndex?" selected":"")+'>Phase '+i+' \u2014 '+p.label+" ("+p.short+')</option>';});
    html+='</select>';
  }
  html+='</div>';

  html+='<div class="card"><h3>Save &amp; Load</h3>';
  if(ui.resetConfirm){
    html+='<p style="color:#ffb3ac;"><b>Delete everything?</b> This wipes every phase, checklist, chop level, test level and streak. This cannot be undone.</p>'+
      '<div style="display:flex;gap:8px;margin-top:10px;"><button class="tbtn" style="flex:1;" data-action="cancelreset">Cancel</button><button class="tbtn danger" style="flex:1;" data-action="confirmreset">Yes, delete everything</button></div>';
  } else {
    html+='<p>Saves automatically in this browser only. Save a copy to move it to another device, or load one back in.</p>'+
      '<div style="display:flex;gap:8px;margin-top:10px;"><button class="tbtn" style="flex:1;" data-action="export">\ud83d\udcbe Save</button><button class="tbtn" style="flex:1;" data-action="import">\ud83d\udcc2 Load</button></div>'+
      '<button class="tbtn danger" style="width:100%;margin-top:8px;" data-action="reset">\u26a0\ufe0f Reset Everything</button>'+
      '<input type="file" id="importFile" accept="application/json" style="display:none;">';
  }
  html+='</div>';
  return html;
}

function renderDaily(){
  var idx=state.phaseIndex,p=PHASES[idx];
  var day=ui.dayOverride||todayName();
  var act=activeDay();
  var editable=(day===act);
  var wknd=isWeekendDay(day);
  var html='<div class="eyebrow">'+DAY_FULL[day]+' &middot; '+p.label+'</div>';
  html+=dayPicker(day);

  if(!editable){
    var notePrefix = state.activeDayOverride ? "Currently selected practice session is" : "Suggested practice session is";
    html+='<div class="note">'+notePrefix+' <b>'+DAY_FULL[act]+'</b>. <button class="tbtn" data-action="activateday" data-day="'+day+'" style="margin-top:8px;display:block;">Switch to '+DAY_FULL[day]+' instead \u2192</button></div>';
  }

  if(p.kind==="setup"){
    var preBody='<ul class="check">'+PREREQ.map(function(pr,i){return pr.doc?docItem(pr.t,pr.url):prereqItem(pr.t,k("p0","pre",i),pr.url,editable);}).join("")+'</ul>';
    html+=blk("prereq",day,"Prerequisites",null,preBody,editable);
    html+=blk("warmup",day,"Warm-Up",null,'<p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p>',editable);
    html+='<div class="note">Run the Phase Transition Test on Home for your baseline \u2014 it\'s informational here, not required to advance.</div>';
    return html;
  }

  if(wknd){
    var nsi=nextUnchecked(p.songs.map(function(s){return s.t;}),p.id+".s");
    html+=blk("warmup",day,"Warm-Up","15 min",'<p>Extended warm-up + weak-spot review.</p>',editable);
    if(day==="Sat"){
      var body='<p>Deep-dive: polish next solo toward full tempo.</p>'+
        (nsi>=0?'<ul class="check">'+checkItem(p.songs[nsi].t,k(p.id,"s",nsi),p.songs[nsi].url,editable)+'</ul>':'');
      html+=blk("casual",day,"Creative","45 min",body,editable);
    } else {
      html+=blk("casual",day,"Creative","45 min",'<p>Improv over a backing track, or pick a bonus drill.</p><button class="tbtn" data-action="go" data-view="free" style="margin-top:8px;">Open Free Practice \u2192</button>',editable);
    }
    return html;
  }

  var ci=nextUnchecked((p.concept||[]).map(function(c){return c.t;}),p.id+".c");
  var essential=ESSENTIAL[day]||"Reinforce Weakest";
  var essUrl=ESSENTIAL_URL[essential];

  html+=blk("warmup",day,"Warm-Up","5 min",'<p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p>',editable);

  var focusBody='';
  if(day==="Mon"){
    if(p.concept&&p.concept.length){ focusBody+= ci>=0 ? '<ul class="check">'+checkItem("Watch: "+p.concept[ci].t,k(p.id,"c",ci),p.concept[ci].url,editable)+'</ul>' : '<p>All concept videos done.</p>'; }
    
    var monExHtml = p.exercises.map(function(t,i){
      var kk = k(p.id,"e",i);
      // Hide ONLY if checked on a previous day
      if (state.checks[kk] && state.checks[kk] !== todayISO()) return "";
      return checkItem(t.t,kk,t.url,editable);
    }).join("");
    if(monExHtml) focusBody+='<p style="margin-top:6px;">Exercises in rotation (check off once solid):</p><ul class="check">'+monExHtml+'</ul>';
    else focusBody+='<p style="margin-top:6px;color:var(--muted);">All exercises mastered for this phase! \ud83c\udfb8</p>';

  } else if(day==="Tue"){
    var tueExHtml = p.exercises.map(function(t,i){
      var kk = k(p.id,"e",i);
      // Hide ONLY if checked on a previous day
      if (state.checks[kk] && state.checks[kk] !== todayISO()) return "";
      return checkItem(t.t,kk,t.url,editable);
    }).join("");
    if(tueExHtml) focusBody+='<p style="margin-bottom:6px;">Exercises in rotation (check off once solid):</p><ul class="check">'+tueExHtml+'</ul>';
    else focusBody+='<p style="margin-bottom:6px;color:var(--muted);">All exercises mastered for this phase! \ud83c\udfb8</p>';
    
    focusBody+='<p style="margin:6px 0;">Chop-builders (picking) \u2014 protect ~15 min:</p>'+chopRow(p.target,["alt","sweep"]);
  } else if(day==="Wed"){
    focusBody+='<p style="margin-bottom:6px;">Theory in rotation:</p><ul class="check">'+THEORY.map(function(t,i){return t.doc?docItem(t.t,t.url):checkItem(t.t,"theory."+i,t.url,editable);}).join("")+'</ul>';
  } else if(day==="Thu"){
    focusBody+='<p style="margin-bottom:6px;">Chop-builders (legato/economy/tapping):</p>'+chopRow(p.target,["legato","econ","tap"]);
  } else if(day==="Fri"){
    focusBody+='<p>Revisit your hardest exercise or chop-builder from the week, then spend the micro-dose reinforcing whichever skill felt weakest.</p>';
    if(p.testReq){
      var met=TESTCATS.filter(function(c){return (state.testLevel[c.key]||0)>=p.testReq;}).length;
      focusBody+='<div class="note" style="margin-top:8px;">Phase Transition Test: '+met+'/5 at Level '+p.testReq+'+. <button class="tbtn" data-action="go" data-view="home" style="margin-top:6px;display:block;">Retake Phase Test \u2192</button></div>';
    }
  }
  if(day!=="Fri") focusBody+='<p style="margin-top:8px;">+ 5 min: '+linked(essential+" micro-dose",essUrl)+'</p>';
  html+=blk("focused",day,"Focused","30 + 5 min",focusBody,editable);

  var si=nextUnchecked(p.songs.map(function(s){return s.t;}),p.id+".s");
  var casualBody='';
  if(day==="Mon"||day==="Thu"){ casualBody += si>=0 ? '<ul class="check">'+checkItem(p.songs[si].t,k(p.id,"s",si),p.songs[si].url,editable)+'</ul>' : '<p>All this tier\'s solos learned. \ud83c\udfb8</p>'; }
  else if(day==="Tue"){ casualBody+='<p>Riff writing / improv over a backing track.</p>'; }
  else if(day==="Wed"){ casualBody+='<p>Apply today\'s theory concept on the fretboard.</p>'; }
  else if(day==="Fri"){ casualBody+='<p>Free jam using everything from the week.</p>'; }
  html+=blk("casual",day,"Casual","15 min",casualBody,editable);
  html+=blk("cooldown",day,"Cool-Down","5 min",'<p>Quick review - what clicked, what didn\'t.</p>',editable);
  return html;
}

function renderLibrary(){
  var html='<div class="eyebrow">Reference &amp; Review</div><div class="h2" style="font-size:20px;margin-bottom:6px;">All Phases</div>';
  html+='<p class="lede">Browse and check off any item, anytime \u2014 it all counts toward the same progress as Daily Practice.</p>';
  PHASES.forEach(function(p,i){
    var open=!!ui.lib["p"+i],pct=phasePercent(i);
    html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="p'+i+'"><b>'+p.label.toUpperCase()+' <span class="tag">Phase '+i+' \u00b7 '+p.short+'</span></b><span style="display:flex;align-items:center;gap:8px;"><span class="tag">'+pct+'%</span><span class="chev'+(open?" open":"")+'">\u203a</span></span></div>';
    if(open){
      html+='<div class="accbody">';
      if(p.kind==="setup"){
        html+='<div class="card"><h3>Prerequisites</h3><ul class="check">'+PREREQ.map(function(pr,j){return pr.doc?docItem(pr.t,pr.url):prereqItem(pr.t,k("p0","pre",j),pr.url);}).join("")+'</ul></div>';
        html+='<div class="card"><h3>Warm-Up</h3><p>'+linked("Ultimate 5-Minute Warm-Up",WARMUP_URL)+'</p></div>';
      } else {
        if(p.concept&&p.concept.length) html+='<div class="card"><h3>Concept Videos</h3><ul class="check">'+p.concept.map(function(t,j){return checkItem(t.t,k(p.id,"c",j),t.url);}).join("")+'</ul></div>';
        html+='<div class="card"><h3>Exercises</h3><ul class="check">'+p.exercises.map(function(t,j){return checkItem(t.t,k(p.id,"e",j),t.url);}).join("")+'</ul></div>';
        html+='<div class="card"><h3>Chop-Builders <span class="tag">target: Level '+p.target+'</span></h3>'+chopRow(p.target)+'</div>';
        html+='<div class="card"><h3>Solos</h3><ul class="check">'+p.songs.map(function(t,j){return checkItem(t.t,k(p.id,"s",j),t.url);}).join("")+'</ul></div>';
        html+='<div class="card"><h3>Phase Transition Test <span class="tag">target: Level '+p.testReq+'</span></h3>'+testRow(p.testReq)+'</div>';
      }
      html+='</div>';
    }
    html+='</div>';
  });
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="theory"><b>Theory Track</b><span class="chev'+(ui.lib.theory?" open":"")+'">\u203a</span></div>';
  if(ui.lib.theory) html+='<div class="accbody"><div class="card"><ul class="check">'+THEORY.map(function(t,j){return t.doc?docItem(t.t,t.url):checkItem(t.t,"theory."+j,t.url);}).join("")+'</ul></div></div>';
  html+='</div>';
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="creative"><b>Creative <span class="tag">Songwriting &amp; Production</span></b><span class="chev'+(ui.lib.creative?" open":"")+'">\u203a</span></div>';
  if(ui.lib.creative){
    html+='<div class="accbody"><div class="card"><h3>Songwriting</h3><ul class="check">'+CREATIVE.songwriting.map(function(t,j){return checkItem(t.t,"creative.sw."+j,t.url);}).join("")+'</ul></div>'+
      '<div class="card"><h3>Production</h3><ul class="check">'+CREATIVE.production.map(function(t,j){return checkItem(t.t,"creative.pr."+j,t.url);}).join("")+'</ul></div></div>';
  }
  html+='</div>';
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="bonuslib"><b>Bonus Content</b><span class="chev'+(ui.lib.bonuslib?" open":"")+'">\u203a</span></div>';
  if(ui.lib.bonuslib) html+='<div class="accbody"><div class="card">'+renderBonusList()+'</div></div>';
  html+='</div>';
  return html;
}

function renderFree(){
  var html='<div class="eyebrow">Off The Plan</div><div class="h2" style="font-size:20px;margin-bottom:10px;">Free Practice</div>';
  html+='<div class="card"><h3>Surprise Me \ud83c\udfb2</h3><p style="margin-bottom:8px;">Pulls a random bonus drill or essential skill for burnout days.</p><button class="tbtn primary" data-action="surprise">Surprise Me</button>'+(ui.surprise?'<div class="note" style="margin-top:10px;">'+ui.surprise+'</div>':'')+'</div>';
  html+='<div class="card"><h3>Bonus Content <span class="tag">also in Library</span></h3>'+renderBonusList()+'</div>';
  html+='<div class="card"><h3>Essential Skills</h3><ul class="check">'+Object.keys(ESSENTIAL).map(function(d){
    var label=ESSENTIAL[d];
    var url=ESSENTIAL_URL[label];
    return '<li style="display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #23262f;"><div class="itxt">'+linked(label,url)+' <span class="tag">('+DAY_FULL[d]+')</span></div></li>';
  }).join("")+'</ul></div>';
  return html;
}

function renderInfo(){
  var html='<div class="eyebrow">The Full Guide</div><div class="h2" style="font-size:20px;margin-bottom:10px;">Guide &amp; Info</div>';
  html+='<div class="card"><h3>How This Plan Works</h3><p style="margin-bottom:6px;">Technique is sequential and full-coverage: start at Beginner regardless of ability, and work every exercise, chop-builder and solo in every tier before advancing.</p>'+
    '<p style="margin-bottom:6px;">Theory and Creative (songwriting/production) run on their own independent tracks \u2014 always available in Library, never gating a phase.</p>'+
    '<p>Essential skills get a 5-minute daily micro-dose \u2014 a different one Monday\u2013Thursday, Friday reinforces whichever felt weakest.</p></div>';
  html+='<div class="card"><h3>Daily Blueprint</h3><p style="margin-bottom:6px;"><b style="color:var(--text)">Weekdays (60 min):</b> 5 Warm-Up + 35 Focused (30 technique/theory + 5 skill micro-dose) + 15 Casual + 5 Cool-Down.</p>'+
    '<p><b style="color:var(--text)">Weekends (60 min):</b> 15 Warm-Up + 45 Casual/Creative.</p></div>';
  html+='<div class="card"><h3>Exercise Time-Split (Tue/Thu)</h3><p>Newest exercise gets the most time (5\u20138 min); older, solid ones just need a quick maintenance rep (1\u20132 min). Chop-builders get a protected floor of ~15 min \u2014 that\'s your real progress signal.</p></div>';
  html+='<div class="card"><h3>Weekly Rhythm</h3><table class="info"><tr><th>Day</th><th>Focused</th><th>Casual</th></tr>'+
    WEEKLY_RHYTHM.map(function(r){return '<tr><td class="day">'+r.day+'</td><td>'+r.focused+'</td><td>'+r.casual+'</td></tr>';}).join("")+'</table></div>';
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="infophases"><b>Phase Overview</b><span class="chev'+(ui.lib.infophases?" open":"")+'">\u203a</span></div>';
  if(ui.lib.infophases){ html+='<div class="accbody"><div class="card">'+PHASES.map(function(p,i){return '<p style="margin-bottom:8px;"><b style="color:var(--text)">Phase '+i+' \u2014 '+p.label+' ('+p.short+'):</b> '+PHASE_BLURB[p.id]+'</p>';}).join("")+
    '<p><b style="color:var(--text)">Creative (no phase number):</b> Once technique work slows down, Creative \u2014 songwriting and production \u2014 becomes your ongoing focus. It\'s tracked in Library like Theory, and never counts toward the phase progress bar.</p></div></div>'; }
  html+='</div>';
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="infoess"><b>Essential Skills Rotation</b><span class="chev'+(ui.lib.infoess?" open":"")+'">\u203a</span></div>';
  if(ui.lib.infoess){ html+='<div class="accbody"><div class="card">'+Object.keys(ESSENTIAL).map(function(d){return '<p style="margin-bottom:4px;"><b style="color:var(--text)">'+DAY_FULL[d]+':</b> '+ESSENTIAL[d]+'</p>';}).join("")+'</div></div>'; }
  html+='</div>';
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="infotheory"><b>Theory Track</b><span class="chev'+(ui.lib.infotheory?" open":"")+'">\u203a</span></div>';
  if(ui.lib.infotheory){ html+='<div class="accbody"><div class="card"><p>Seven lessons, worked strictly in order: start with the Scales Handbook as a standing reference, then Ear Training (chords, then intervals), the four-part Modes Course, Soloing Over Chord Changes, and finally Phrasing Masterclass. The full checklist with links lives in Library.</p></div></div>'; }
  html+='</div>';
  html+='<div class="acc"><div class="acchead" data-action="toggleacc" data-acc="infobonus"><b>Bonus Content</b><span class="chev'+(ui.lib.infobonus?" open":"")+'">\u203a</span></div>';
  if(ui.lib.infobonus){ html+='<div class="accbody"><div class="card"><ul class="infolist">'+BONUS.map(function(t){return '<li>'+t.t+'</li>';}).join("")+'</ul></div></div>'; }
  html+='</div>';
  html+='<div class="note" style="margin-top:4px;">This guide and app are based on <b>Bradley Hall\'s Guitar School</b> (BHGS) Official Roadmap.</div>';
  return html;
}

function render(){
  try {
    ensureDailyReset();
    var root=document.getElementById("root");
    if(!root) return;
    
    // Aligned to the BASELINE so the bottom edges of the texts align perfectly
    var topbarHTML = '<div class="topbar"><div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;"><div class="brand" style="margin-bottom:0;">THE <span>SHRED</span> ROADMAP</div><div class="topsubtitle" style="text-align:right;">Bradley Hall\'s Guitar School</div></div>';
    if(hasFirebase){
      topbarHTML += '<div style="margin-bottom:8px;"><button id="authBtn" class="dchip2" style="padding:5px 10px; flex:0 0 auto; color:var(--text); border-color:var(--border);">'+(currentUser ? "Logout" : "Login with Google")+'</button></div>';
    }
    topbarHTML += progressBar()+'</div>';

    var body = topbarHTML + '<div class="page">';
    if(ui.view==="home") body+=renderHome();
    else if(ui.view==="daily") body+=renderDaily();
    else if(ui.view==="library") body+=renderLibrary();
    else if(ui.view==="free") body+=renderFree();
    else if(ui.view==="info") body+=renderInfo();
    body+='</div><div class="botnav">'+navBtn("home","\ud83c\udfe0","Home")+navBtn("daily","\ud83c\udfaf","Daily")+navBtn("library","\ud83d\udcda","Library")+navBtn("free","\ud83c\udfb8","Free")+navBtn("info","\u2139\ufe0f","Info")+'</div>';
    
    root.innerHTML=body;
    var fi=document.getElementById("importFile");
    if(fi) fi.addEventListener("change",function(e){ if(e.target.files[0]) handleImportFile(e.target.files[0]); });
  } catch(err) {
    console.error("Render error:", err);
    var root=document.getElementById("root");
    if(root) {
      root.innerHTML = '<div style="padding: 20px; color: #ff3b30; font-family: monospace;"><h3>Render Error:</h3><p>' + err.message + '</p><pre>' + err.stack + '</pre></div>';
    }
  }
}
function navBtn(view,ic,label){ return '<button data-action="go" data-view="'+view+'" class="'+(ui.view===view?"active":"")+'"><span class="ic">'+ic+'</span>'+label+'</button>'; }

document.addEventListener("click",function(e){
  if(e.target.closest("a")) return;
  var t=e.target.closest("[data-action],[data-toggle],#authBtn");
  if(!t) return;

  if(t.id === "authBtn"){
    if(currentUser){
      signOut(auth).then(() => { showToast("Logged out"); render(); });
    } else {
      signInWithPopup(auth, googleProvider).catch(err => showToast("Login failed"));
    }
    return;
  }

  if(t.dataset.toggle){ toggleCheck(t.dataset.toggle); return; }
  var a=t.dataset.action;
  if(a==="go"){
    if(t.dataset.view!==ui.view){ ui.lib={}; ui.dayOverride=null; ui.surprise=null; }
    ui.view=t.dataset.view; render();
  }
  else if(a==="toggleacc"){ui.lib[t.dataset.acc]=!ui.lib[t.dataset.acc]; render();}
  else if(a==="setday"){ ui.dayOverride=t.dataset.day; render(); }
  else if(a==="chop"){ setChop(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="test"){ setTest(t.dataset.t,parseInt(t.dataset.d,10)); }
  else if(a==="bonuslvl"){ setBonusLevel(t.dataset.k,parseInt(t.dataset.d,10),parseInt(t.dataset.max,10)); }
  else if(a==="blockprac"){ toggleBlockPracticed(t.dataset.block,t.dataset.day); }
  else if(a==="togm"){ toggleCheck(t.dataset.key); }
  else if(a==="activateday"){ setActiveDay(t.dataset.day); }
  else if(a==="resetactiveday"){ resetActiveDay(); }
  else if(a==="surprise"){
    var pool=BONUS.map(function(b){return b.t;}).concat(Object.keys(ESSENTIAL).map(function(d){return ESSENTIAL[d]+" essential-skill drill";})); 
    ui.surprise=pool[Math.floor(Math.random()*pool.length)]; 
    render();
  }
  else if(a==="export"){ exportState(); }
  else if(a==="import"){ triggerImport(); }
  else if(a==="reset"){ handleReset(); }
  else if(a==="cancelreset"){ cancelReset(); }
  else if(a==="confirmreset"){ confirmReset(); }
  else if(a==="canceljump"){ cancelPhaseJumpBack(); }
  else if(a==="confirmjump"){ confirmPhaseJumpBack(); }
});
document.addEventListener("change",function(e){
  if(e.target.dataset.action==="setphase") handlePhaseSelect(parseInt(e.target.value,10));
});

ensureDailyReset();
render();
setTimeout(function(){
  var sp=document.getElementById("splash");
  if(sp) sp.remove();
},1200);
</script>
