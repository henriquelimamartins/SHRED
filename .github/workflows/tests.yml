# Runs the automated tests (tests/, Playwright, Firebase stubbed) on every pull request to main.
# Phase 1.6 · Safety net. Read-only: no secrets, no deploy, no writes to the repository.
# D107: the tests run in 4 parallel jobs (desktop/mobile × 2 shards) to save time; a final job with
# the original check name "Playwright (desktop + mobile)" is green only if all 4 passed.
name: Tests

on:
  pull_request:
    branches: ["main"]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# The workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same PR cancels the older, still-running test run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: Playwright (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    # Playwright's official image: Chromium and every system package it needs are already inside,
    # so nothing is downloaded from the Ubuntu package mirrors (unreachable in the first two runs
    # of PR #8). The image version must match @playwright/test in package.json (1.63.0).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    strategy:
      # Every shard runs to the end, so one failure does not hide others.
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install test tools (exact versions from package.json)
        run: npm install --no-audit --no-fund

      - name: Run tests (${{ matrix.project }}, part ${{ matrix.shard }} of 2)
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
        env:
          CI: "true"

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright:
    # Same name as the single job before D107, so the PR check keeps its name.
    name: Playwright (desktop + mobile)
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All 4 test jobs passed
        run: |
          echo "Test jobs result: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
