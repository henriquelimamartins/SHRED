# Runs the automated tests (tests/, Playwright, Firebase stubbed) on every pull request to main.
# Phase 1.6 · Safety net. Read-only: no secrets, no deploy, no writes to the repository.
name: Tests

on:
  pull_request:
    branches: ["main"]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# The workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same PR cancels the older, still-running test run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (desktop + mobile)
    # Fixed Ubuntu version: ubuntu-latest is moving to Ubuntu 26.04, whose package mirrors failed
    # to resolve during the first run (PR #8). Playwright 1.63 officially supports 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install test tools (exact versions from package.json)
        run: npm install --no-audit --no-fund

      # Downloads Chromium and the system packages it needs. Up to 3 attempts, because a failing
      # package mirror should not fail the tests.
      - name: Install Chromium for Playwright
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Install attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Run tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
