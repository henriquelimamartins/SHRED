# Runs the automated tests (tests/, Playwright, Firebase stubbed) on every pull request to main.
# Phase 1.6 · Safety net. Read-only: no secrets, no deploy, no writes to the repository.
name: Tests

on:
  pull_request:
    branches: ["main"]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# The workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same PR cancels the older, still-running test run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install test tools (exact versions from package.json)
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test
        env:
          CI: "true"

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
